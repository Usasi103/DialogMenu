<script id="wiki-data" type="application/json">[{"id": "readme", "title": "首页", "file": "README.md", "html": "\u003ch1 id=\"dialogmenu-中文-wiki\">DialogMenu 中文 Wiki\u003c/h1>\n\u003cp>用 YAML 制作 Minecraft Dialog 菜单：玩家设置、NPC 对话、首领介绍、确认界面和物品预览。\u003c/p>\n\u003cp>本文基础章节按 \u003cstrong>0.1.17\u003c/strong> 编写；图标、物品源、资源包及字体命名空间已按当前 \u003cstrong>0.1.22\u003c/strong> 核对补充，其他章节不代表已覆盖全部后续功能。新版菜单格式从 \u003cstrong>0.1.16\u003c/strong> 开始使用。全局 \u003ccode>config.yml\u003c/code> 的版本是 \u003ccode>3\u003c/code>，单个菜单文件的版本是 \u003ccode>1\u003c/code>。这两个数字表示配置格式，不是插件版本。\u003c/p>\n\u003cp>\u003cstrong>先记住三层关系：\u003ccode>config.yml\u003c/code> 选默认菜单 → \u003ccode>menus/文件名.yml\u003c/code> 定义一个菜单 → \u003ccode>Pages\u003c/code> 定义它的子页面。\u003c/strong>\u003c/p>\n\u003ch2 id=\"开始阅读\">开始阅读\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你想做什么\u003c/th>\n\u003cth>阅读入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>第一次写菜单，先跑通一个例子\u003c/td>\n\u003ctd>\u003ca href=\"#quick-start\">快速开始\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>弄清 \u003ccode>menus\u003c/code> 里的文件和字段\u003c/td>\n\u003ctd>\u003ca href=\"#structure\">目录与菜单结构\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>修改现在的玩家设置\u003c/td>\n\u003ctd>\u003ca href=\"#settings\">settings 菜单与页面\u003c/a>、\u003ca href=\"#controls\">控件参考\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>做 NPC 对话或首领界面\u003c/td>\n\u003ctd>\u003ca href=\"#canvas\">canvas 画布\u003c/a>、\u003ca href=\"#elements\">画布元素\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>让按钮执行命令、翻页\u003c/td>\n\u003ctd>\u003ca href=\"#actions\">动作参考\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>选择难度、显示条件文字\u003c/td>\n\u003ctd>\u003ca href=\"#variables\">变量、条件与占位符\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>展示 CraftEngine / 其他插件物品\u003c/td>\n\u003ctd>\u003ca href=\"#items\">物品页面与物品源\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>测试 CE/IA 图片标签与 DialogMenu 独立多语言\u003c/td>\n\u003ctd>\u003ca href=\"#text-tags\">图片标签与独立多语言\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更换图标、使用 IA / Nexo / Oraxen、完全不用 CE\u003c/td>\n\u003ctd>\u003ca href=\"#icons\">图标与材质\u003c/a>、\u003ca href=\"#resource-pack\">资源包\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>排查加载、方块字、布局错误\u003c/td>\n\u003ctd>\u003ca href=\"#resource-pack\">资源包\u003c/a>、\u003ca href=\"#troubleshooting\">常见问题\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>直接复制完整文件\u003c/td>\n\u003ctd>\u003ca href=\"#examples\">示例库\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>从旧版或 TrMenu 理解新格式\u003c/td>\n\u003ctd>\u003ca href=\"#migration\">迁移与 TrMenu 对照\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>全部章节见 \u003ca href=\"#summary\">目录\u003c/a>，命令见 \u003ca href=\"#commands\">命令与权限\u003c/a>。\u003c/p>\n\u003ch2 id=\"两类菜单怎么选\">两类菜单怎么选\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需求\u003c/th>\n\u003cth>\u003ccode>Type: settings\u003c/code>\u003c/th>\n\u003cth>\u003ccode>Type: canvas\u003c/code>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>布局\u003c/td>\n\u003ctd>\u003ccode>Layout\u003c/code> 排列控件，自动分配位置\u003c/td>\n\u003ctd>\u003ccode>Position: [X, Row]\u003c/code> 指定位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常用内容\u003c/td>\n\u003ctd>设置开关、下拉框、滑条、文字、按钮\u003c/td>\n\u003ctd>对话、插图、按钮、自由排列的文字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页内配置\u003c/td>\n\u003ctd>\u003ccode>Layout\u003c/code> + \u003ccode>Icons\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Elements\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多页入口\u003c/td>\n\u003ctd>左侧导航；\u003ccode>page:\u003c/code> 翻页\u003c/td>\n\u003ctd>自己配置翻页按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外观\u003c/td>\n\u003ctd>暗色 / 亮色玩家偏好\u003c/td>\n\u003ctd>\u003ccode>amethyst\u003c/code> / \u003ccode>parchment\u003c/code> 皮肤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>语言\u003c/td>\n\u003ctd>中文、英文行内翻译\u003c/td>\n\u003ctd>普通文本或文本列表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>临时枚举变量\u003c/td>\n\u003ctd>不支持 \u003ccode>Variables\u003c/code>\u003c/td>\n\u003ctd>支持变量、条件显示和选中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真实物品\u003c/td>\n\u003ctd>子页切换为 \u003ccode>Renderer: items\u003c/code>\u003c/td>\n\u003ctd>不支持；sprite 是图片\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>settings 子页的 \u003ccode>Renderer: canvas\u003c/code> 指设置界面的字体画布；它与整个菜单的 \u003ccode>Type: canvas\u003c/code> 是两个不同字段，不能混用其配置。\u003c/p>\n\u003ch2 id=\"当前服务器从哪里改\">当前服务器从哪里改\u003c/h2>\n\u003cp>当前部署目录是 \u003ccode>F:\\OneDrive\\toraka_online\\test_server\\plugins\\DialogMenu\\\u003c/code>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>config.yml\u003c/code>\u003c/td>\n\u003ctd>默认菜单和资源包要求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>menus/demo-settings.yml\u003c/code>\u003c/td>\n\u003ctd>独立设置演示；模拟开关、滑条和下拉框，真实 settings 菜单继续保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>menus/demo-dialogue.yml\u003c/code>\u003c/td>\n\u003ctd>NPC 对话演示，默认 main 页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>menus/demo-boss.yml\u003c/code>\u003c/td>\n\u003ctd>首领演示，intro 介绍和 confirm 确认页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>menus/demo-quests.yml\u003c/code>\u003c/td>\n\u003ctd>任务列表演示；任务与奖励的 Icon 配置见 \u003ca href=\"#icons\">图标与材质\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>修改后先执行 \u003ccode>/dmenu check\u003c/code>，通过后执行 \u003ccode>/dmenu reload\u003c/code>。这份 Wiki 和示例存放在源码目录，不会自动修改服务器菜单。\u003c/p>\n\u003ch2 id=\"阅读和维护\">阅读和维护\u003c/h2>\n\u003cul>\n\u003cli>双击同目录的 \u003ccode>index.html\u003c/code> 阅读离线网页，支持全文搜索、章节跳转和复制代码，无需启动服务器。\u003c/li>\n\u003cli>Markdown 是文档源文件，\u003ccode>SUMMARY.md\u003c/code> 是 GitBook 风格的导航目录。\u003c/li>\n\u003cli>修改 Markdown 后，按 \u003ca href=\"#maintaining\">文档维护说明\u003c/a> 重新生成网页。\u003c/li>\n\u003cli>文档组织参考了 \u003ca href=\"https://hhhhhy.gitbook.io/trmenu-v3\">TrMenu V3 文档\u003c/a>，字段和行为依据 DialogMenu 自己的解析器与运行代码。TrMenu 的动作、脚本和布局语法不能直接移植。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"核对依据\">核对依据\u003c/h2>\n\u003cp>主要实现：\u003ccode>MenuCatalog.kt\u003c/code>、\u003ccode>SimpleMenuParser.kt\u003c/code>、\u003ccode>DialogTemplates.kt\u003c/code>、\u003ccode>MenuDialog.kt\u003c/code>、\u003ccode>TemplateDialog.kt\u003c/code>、\u003ccode>ItemMenuPage.kt\u003c/code>、\u003ccode>MenuResources.kt\u003c/code>。旧说明中的“一页一个文件”属于旧格式。\u003c/p>\n\u003cp>文档核对日期：2026-09-24。示例校验范围见 \u003ca href=\"#maintaining\">维护说明\u003c/a>。\u003c/p>", "text": "DialogMenu 中文 Wiki 用 YAML 制作 Minecraft Dialog 菜单：玩家设置、NPC 对话、首领介绍、确认界面和物品预览。 本文基础章节按 0.1.17 编写；图标、物品源、资源包及字体命名空间已按当前 0.1.22 核对补充，其他章节不代表已覆盖全部后续功能。新版菜单格式从 0.1.16 开始使用。全局 config.yml 的版本是 3 ，单个菜单文件的版本是 1 。这两个数字表示配置格式，不是插件版本。 先记住三层关系： config.yml 选默认菜单 → menus/文件名.yml 定义一个菜单 → Pages 定义它的子页面。 开始阅读 你想做什么 阅读入口 第一次写菜单，先跑通一个例子 快速开始 弄清 menus 里的文件和字段 目录与菜单结构 修改现在的玩家设置 settings 菜单与页面 、 控件参考 做 NPC 对话或首领界面 canvas 画布 、 画布元素 让按钮执行命令、翻页 动作参考 选择难度、显示条件文字 变量、条件与占位符 展示 CraftEngine / 其他插件物品 物品页面与物品源 测试 CE/IA 图片标签与 DialogMenu 独立多语言 图片标签与独立多语言 更换图标、使用 IA / Nexo / Oraxen、完全不用 CE 图标与材质 、 资源包 排查加载、方块字、布局错误 资源包 、 常见问题 直接复制完整文件 示例库 从旧版或 TrMenu 理解新格式 迁移与 TrMenu 对照 全部章节见 目录 ，命令见 命令与权限 。 两类菜单怎么选 需求 Type: settings Type: canvas 布局 Layout 排列控件，自动分配位置 Position: [X, Row] 指定位置 常用内容 设置开关、下拉框、滑条、文字、按钮 对话、插图、按钮、自由排列的文字 页内配置 Layout + Icons Elements 多页入口 左侧导航； page: 翻页 自己配置翻页按钮 外观 暗色 / 亮色玩家偏好 amethyst / parchment 皮肤 语言 中文、英文行内翻译 普通文本或文本列表 临时枚举变量 不支持 Variables 支持变量、条件显示和选中 真实物品 子页切换为 Renderer: items 不支持；sprite 是图片 settings 子页的 Renderer: canvas 指设置界面的字体画布；它与整个菜单的 Type: canvas 是两个不同字段，不能混用其配置。 当前服务器从哪里改 当前部署目录是 F:\\OneDrive\\toraka_online\\test_server\\plugins\\DialogMenu\\ 。 文件 内容 config.yml 默认菜单和资源包要求 menus/demo-settings.yml 独立设置演示；模拟开关、滑条和下拉框，真实 settings 菜单继续保留 menus/demo-dialogue.yml NPC 对话演示，默认 main 页 menus/demo-boss.yml 首领演示，intro 介绍和 confirm 确认页 menus/demo-quests.yml 任务列表演示；任务与奖励的 Icon 配置见 图标与材质 修改后先执行 /dmenu check ，通过后执行 /dmenu reload 。这份 Wiki 和示例存放在源码目录，不会自动修改服务器菜单。 阅读和维护 双击同目录的 index.html 阅读离线网页，支持全文搜索、章节跳转和复制代码，无需启动服务器。 Markdown 是文档源文件， SUMMARY.md 是 GitBook 风格的导航目录。 修改 Markdown 后，按 文档维护说明 重新生成网页。 文档组织参考了 TrMenu V3 文档 ，字段和行为依据 DialogMenu 自己的解析器与运行代码。TrMenu 的动作、脚本和布局语法不能直接移植。 核对依据 主要实现： MenuCatalog.kt 、 SimpleMenuParser.kt 、 DialogTemplates.kt 、 MenuDialog.kt 、 TemplateDialog.kt 、 ItemMenuPage.kt 、 MenuResources.kt 。旧说明中的“一页一个文件”属于旧格式。 文档核对日期：2026-09-24。示例校验范围见 维护说明 。"}, {"id": "quick-start", "title": "快速开始", "file": "quick-start.md", "html": "\u003ch1 id=\"快速开始\">快速开始\u003c/h1>\n\u003cp>以下按已经安装 DialogMenu、客户端能够打开现有菜单的服务器说明。0.1.21 起以 Paper 1.21.11 API 为编译基线，使用 JDK 25 构建、输出 Java 21 字节码；配套资源包声明格式 75–88（1.21.11–26.2）。首次安装及资源包自动接入见 \u003ca href=\"#resource-pack\">资源包指南\u003c/a>，测试环境与限制见项目 README。\u003c/p>\n\u003ch2 id=\"1-找到菜单目录\">1. 找到菜单目录\u003c/h2>\n\u003cp>打开 \u003ccode>plugins/DialogMenu/menus/\u003c/code>。当前全局配置应为 \u003ccode>config.yml\u003c/code> 的 \u003ccode>Version: 3\u003c/code>。旧版先看 \u003ca href=\"#migration\">迁移\u003c/a>，不要只改版本号。\u003c/p>\n\u003cp>新建 \u003ccode>hello.yml\u003c/code>，保存为 UTF-8，粘贴以下完整内容：\u003c/p>\n\u003c!-- example: hello.yml -->\n\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 1\nType: settings\nTitle: 我的第一个菜单\nDefaultPage: main\nMainMenu: [close]\nPages:\n  main:\n    Title: 欢迎\n    Layout: [问候, 帮助, 关闭]\n    Icons:\n      问候:\n        Type: text\n        Name: &quot;你好，{player}！&quot;\n        Description: &quot;这是用 DialogMenu 制作的菜单。&quot;\n      帮助:\n        Name: 查看帮助\n        Actions: [&quot;page: help&quot;]\n      关闭:\n        Actions: [close]\n  help:\n    Title: 使用帮助\n    Layout: [说明, 返回]\n    Icons:\n      说明:\n        Type: text\n        Name: 修改文字后检查并重载即可。\n      返回:\n        Actions: [&quot;page: main&quot;]\n\u003c/code>\u003c/pre>\n\u003cp>这里 hello 是菜单 ID，main、help 是页面 ID；问候、帮助是控件名。不同菜单可以使用相同页面 ID。\u003c/p>\n\u003ch2 id=\"2-检查应用打开\">2. 检查、应用、打开\u003c/h2>\n\u003cp>管理员执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">/dmenu check\n/dmenu reload\n/dmenu open hello\n\u003c/code>\u003c/pre>\n\u003cp>check 只校验。reload 才应用，且所有菜单必须一起通过。打开操作需要由玩家执行，控制台可执行 \u003ccode>dmenu check\u003c/code>、\u003ccode>dmenu reload\u003c/code>。\u003c/p>\n\u003cp>无需在全局文件里注册 hello。若只想添加菜单，保持原来的 DefaultMenu；若希望 \u003ccode>/dmenu\u003c/code> 默认打开它，才把 \u003ccode>config.yml\u003c/code> 的 \u003ccode>DefaultMenu\u003c/code> 改为 hello。\u003c/p>\n\u003ch2 id=\"3-试着改三处\">3. 试着改三处\u003c/h2>\n\u003col>\n\u003cli>改 Name：调整显示文字。\u003c/li>\n\u003cli>改 \u003ccode>Layout: [帮助, 问候, 关闭]\u003c/code>：调整控件顺序。\u003c/li>\n\u003cli>改 \u003ccode>DefaultPage: help\u003c/code>：让这个菜单默认显示帮助页。\u003c/li>\n\u003c/ol>\n\u003cp>每次改完重复 check → reload。Title 是标题，文件名才是命令使用的菜单 ID。\u003c/p>\n\u003ch2 id=\"4-需要自由布局时\">4. 需要自由布局时\u003c/h2>\n\u003cp>复制 \u003ca href=\"#examples\">NPC 对话完整示例\u003c/a> 中的 guide.yml，它使用 \u003ccode>Type: canvas\u003c/code>，通过 Position 调整位置。不要把 Elements 放进上面的 settings 页面。\u003c/p>\n\u003ch2 id=\"避免第一次就踩坑\">避免第一次就踩坑\u003c/h2>\n\u003cul>\n\u003cli>缩进用空格，不用 Tab；字段名区分大小写。\u003c/li>\n\u003cli>Actions 是字符串列表，写 \u003ccode>Actions: [close]\u003c/code>，不要写成 \u003ccode>Actions: close\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>\"off\"\u003c/code>、\u003ccode>\"on\"\u003c/code>、\u003ccode>\"yes\"\u003c/code>、\u003ccode>\"no\"\u003c/code> 等用作字符串时加引号。\u003c/li>\n\u003cli>\u003ccode>Color: \"#e7deed\"\u003c/code> 中的颜色必须加引号，否则 \u003ccode>#\u003c/code> 开始 YAML 注释。\u003c/li>\n\u003cli>多行文字用列表，不在单条文字中嵌入换行。\u003c/li>\n\u003cli>菜单打不开且提示资源包时，先处理 \u003ca href=\"#resource-pack\">资源包加载\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003cp>下一步：\u003ca href=\"#structure\">完整文件结构\u003c/a> · \u003ca href=\"#controls\">控件参考\u003c/a>\u003c/p>", "text": "快速开始 以下按已经安装 DialogMenu、客户端能够打开现有菜单的服务器说明。0.1.21 起以 Paper 1.21.11 API 为编译基线，使用 JDK 25 构建、输出 Java 21 字节码；配套资源包声明格式 75–88（1.21.11–26.2）。首次安装及资源包自动接入见 资源包指南 ，测试环境与限制见项目 README。 1. 找到菜单目录 打开 plugins/DialogMenu/menus/ 。当前全局配置应为 config.yml 的 Version: 3 。旧版先看 迁移 ，不要只改版本号。 新建 hello.yml ，保存为 UTF-8，粘贴以下完整内容： Version: 1 Type: settings Title: 我的第一个菜单 DefaultPage: main MainMenu: [close] Pages: main: Title: 欢迎 Layout: [问候, 帮助, 关闭] Icons: 问候: Type: text Name: \"你好，{player}！\" Description: \"这是用 DialogMenu 制作的菜单。\" 帮助: Name: 查看帮助 Actions: [\"page: help\"] 关闭: Actions: [close] help: Title: 使用帮助 Layout: [说明, 返回] Icons: 说明: Type: text Name: 修改文字后检查并重载即可。 返回: Actions: [\"page: main\"] 这里 hello 是菜单 ID，main、help 是页面 ID；问候、帮助是控件名。不同菜单可以使用相同页面 ID。 2. 检查、应用、打开 管理员执行： /dmenu check /dmenu reload /dmenu open hello check 只校验。reload 才应用，且所有菜单必须一起通过。打开操作需要由玩家执行，控制台可执行 dmenu check 、 dmenu reload 。 无需在全局文件里注册 hello。若只想添加菜单，保持原来的 DefaultMenu；若希望 /dmenu 默认打开它，才把 config.yml 的 DefaultMenu 改为 hello。 3. 试着改三处 改 Name：调整显示文字。 改 Layout: [帮助, 问候, 关闭] ：调整控件顺序。 改 DefaultPage: help ：让这个菜单默认显示帮助页。 每次改完重复 check → reload。Title 是标题，文件名才是命令使用的菜单 ID。 4. 需要自由布局时 复制 NPC 对话完整示例 中的 guide.yml，它使用 Type: canvas ，通过 Position 调整位置。不要把 Elements 放进上面的 settings 页面。 避免第一次就踩坑 缩进用空格，不用 Tab；字段名区分大小写。 Actions 是字符串列表，写 Actions: [close] ，不要写成 Actions: close 。 \"off\" 、 \"on\" 、 \"yes\" 、 \"no\" 等用作字符串时加引号。 Color: \"#e7deed\" 中的颜色必须加引号，否则 # 开始 YAML 注释。 多行文字用列表，不在单条文字中嵌入换行。 菜单打不开且提示资源包时，先处理 资源包加载 。 下一步： 完整文件结构 · 控件参考"}, {"id": "structure", "title": "目录与菜单结构", "file": "structure.md", "html": "\u003ch1 id=\"目录与菜单结构\">目录与菜单结构\u003c/h1>\n\u003ch2 id=\"三个层级\">三个层级\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">plugins/DialogMenu/\n├── config.yml                # 全局入口与资源包\n└── menus/\n    ├── demo-settings.yml     # 独立设置模板；原有 settings.yml 继续用于真实设置\n    │   └── Pages             # YAML 配置段，不是磁盘目录\n    │       ├── profile\n    │       ├── particles\n    │       └── appearance\n    ├── demo-dialogue.yml     # 一个完整的 canvas 菜单\n    │   └── Pages.main\n    └── demo-boss.yml\n        ├── Pages.intro\n        └── Pages.confirm\n\u003c/code>\u003c/pre>\n\u003cp>只有 menus \u003cstrong>直接下级\u003c/strong>、扩展名为小写 \u003ccode>.yml\u003c/code> 的普通文件会被新版加载。子目录不递归加载，\u003ccode>.yaml\u003c/code> 不加载；文件名去掉 \u003ccode>.yml\u003c/code> 后就是菜单 ID。\u003c/p>\n\u003ch2 id=\"全局-configyml\">全局 config.yml\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>默认 / 要求\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Version\u003c/td>\n\u003ctd>整数\u003c/td>\n\u003ctd>必填 3\u003c/td>\n\u003ctd>选择一个文件一个菜单的格式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DefaultMenu\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>默认 settings\u003c/td>\n\u003ctd>必须是一个实际加载的菜单 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ResourcePack\u003c/td>\n\u003ctd>配置段\u003c/td>\n\u003ctd>省略走旧版加载检查\u003c/td>\n\u003ctd>指定需要成功加载的资源包，见\u003ca href=\"#resource-pack\">资源包\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这里只允许以上三个字段。Title、Pages、Language 等属于具体菜单，不再写进全局配置。\u003c/p>\n\u003ch2 id=\"每份菜单文件\">每份菜单文件\u003c/h2>\n\u003cp>两类菜单都需要：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Version\u003c/td>\n\u003ctd>整数\u003c/td>\n\u003ctd>必填 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Type\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>必填 settings 或 canvas\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DefaultPage\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>不填取 Pages 中第一项；填写时必须存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pages\u003c/td>\n\u003ctd>配置段\u003c/td>\n\u003ctd>每个键是一页，值是对应页面配置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>其余根字段按类型选择：\u003ca href=\"#settings\">settings 根字段\u003c/a> / \u003ca href=\"#canvas\">canvas 根字段\u003c/a>。\u003c/p>\n\u003cp>Pages 使用映射，不是页面名列表。只有旧 Version 2 的全局配置才使用 \u003ccode>Pages: [profile, ...]\u003c/code>。\u003c/p>\n\u003ch2 id=\"id-与数量限制\">ID 与数量限制\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>菜单 ID、页面 ID\u003c/td>\n\u003ctd>\u003ccode>[a-z][a-z0-9_-]{0,47}\u003c/code>：小写英文字母开头，总长 1–48\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas 元素 ID、变量名\u003c/td>\n\u003ctd>同上；变量名不能叫 player 或 uuid\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings 控件名\u003c/td>\n\u003ctd>可用中文；非空，不含点 \u003ccode>.\u003c/code> 或控制字符\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>菜单文件数量\u003c/td>\n\u003ctd>1–64\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单文件大小\u003c/td>\n\u003ctd>config.yml 和每份菜单不超过 1 MiB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings 子页\u003c/td>\n\u003ctd>1–8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas 子页\u003c/td>\n\u003ctd>1–64\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings 每页 Layout\u003c/td>\n\u003ctd>1–30 个不重复控件名，仍受实际布局容量限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas 每页 Elements\u003c/td>\n\u003ctd>1–64 个元素\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>比如 boss_01.yml 有效，Boss.yml、1boss.yml、首领.yml 无效。菜单显示的中文名称写 Title。\u003c/p>\n\u003ch2 id=\"加载与错误处理\">加载与错误处理\u003c/h2>\n\u003cp>check 和 reload 会读全部菜单，包括当前没打开的菜单。一个坏文件会使整次重载失败，运行中的上一份有效配置继续使用，磁盘文件不会被改回。\u003c/p>\n\u003cp>启动时配置无效与热重载失败不同：启动尚无旧快照可用，插件记录错误并暂用内置默认菜单。不要把“还能打开菜单”当成这次编辑已成功加载。\u003c/p>\n\u003cp>首次安装、没有 config.yml / menu.yml 且没有既存菜单目录时，才导出默认的三个菜单。正常重启不会覆盖已有文件；缺失引用页会报错。\u003c/p>\n\u003ch2 id=\"新增复制和移除\">新增、复制和移除\u003c/h2>\n\u003cul>\n\u003cli>新增菜单：增加一份完整 .yml，无需注册。\u003c/li>\n\u003cli>新增页面：放进对应文件的 Pages，更新指向它的动作。settings 的声明顺序就是左侧导航顺序。\u003c/li>\n\u003cli>复制菜单：换文件名；page: 仍跳转到复制后菜单内的页面，menu: 的目标不会自动改名。\u003c/li>\n\u003cli>临时停用：将文件移到 menus 外或改为 .yml.disabled，并清理指向它的默认入口和跳转。新版没有 Enabled 字段。\u003c/li>\n\u003cli>移除菜单：检查 DefaultMenu 和其他菜单的链接；重载后已打开的被移除菜单会关闭。\u003c/li>\n\u003c/ul>\n\u003cp>备份放服务器目录之外，不要在 menus 中保留另一个 .yml 副本，否则它也是菜单。\u003c/p>", "text": "目录与菜单结构 三个层级 plugins/DialogMenu/ ├── config.yml # 全局入口与资源包 └── menus/ ├── demo-settings.yml # 独立设置模板；原有 settings.yml 继续用于真实设置 │ └── Pages # YAML 配置段，不是磁盘目录 │ ├── profile │ ├── particles │ └── appearance ├── demo-dialogue.yml # 一个完整的 canvas 菜单 │ └── Pages.main └── demo-boss.yml ├── Pages.intro └── Pages.confirm 只有 menus 直接下级 、扩展名为小写 .yml 的普通文件会被新版加载。子目录不递归加载， .yaml 不加载；文件名去掉 .yml 后就是菜单 ID。 全局 config.yml 字段 类型 默认 / 要求 用途 Version 整数 必填 3 选择一个文件一个菜单的格式 DefaultMenu 字符串 默认 settings 必须是一个实际加载的菜单 ID ResourcePack 配置段 省略走旧版加载检查 指定需要成功加载的资源包，见 资源包 这里只允许以上三个字段。Title、Pages、Language 等属于具体菜单，不再写进全局配置。 每份菜单文件 两类菜单都需要： 字段 类型 要求 Version 整数 必填 1 Type 字符串 必填 settings 或 canvas DefaultPage 字符串 不填取 Pages 中第一项；填写时必须存在 Pages 配置段 每个键是一页，值是对应页面配置 其余根字段按类型选择： settings 根字段 / canvas 根字段 。 Pages 使用映射，不是页面名列表。只有旧 Version 2 的全局配置才使用 Pages: [profile, ...] 。 ID 与数量限制 对象 规则 菜单 ID、页面 ID [a-z][a-z0-9_-]{0,47} ：小写英文字母开头，总长 1–48 canvas 元素 ID、变量名 同上；变量名不能叫 player 或 uuid settings 控件名 可用中文；非空，不含点 . 或控制字符 菜单文件数量 1–64 单文件大小 config.yml 和每份菜单不超过 1 MiB settings 子页 1–8 canvas 子页 1–64 settings 每页 Layout 1–30 个不重复控件名，仍受实际布局容量限制 canvas 每页 Elements 1–64 个元素 比如 boss_01.yml 有效，Boss.yml、1boss.yml、首领.yml 无效。菜单显示的中文名称写 Title。 加载与错误处理 check 和 reload 会读全部菜单，包括当前没打开的菜单。一个坏文件会使整次重载失败，运行中的上一份有效配置继续使用，磁盘文件不会被改回。 启动时配置无效与热重载失败不同：启动尚无旧快照可用，插件记录错误并暂用内置默认菜单。不要把“还能打开菜单”当成这次编辑已成功加载。 首次安装、没有 config.yml / menu.yml 且没有既存菜单目录时，才导出默认的三个菜单。正常重启不会覆盖已有文件；缺失引用页会报错。 新增、复制和移除 新增菜单：增加一份完整 .yml，无需注册。 新增页面：放进对应文件的 Pages，更新指向它的动作。settings 的声明顺序就是左侧导航顺序。 复制菜单：换文件名；page: 仍跳转到复制后菜单内的页面，menu: 的目标不会自动改名。 临时停用：将文件移到 menus 外或改为 .yml.disabled，并清理指向它的默认入口和跳转。新版没有 Enabled 字段。 移除菜单：检查 DefaultMenu 和其他菜单的链接；重载后已打开的被移除菜单会关闭。 备份放服务器目录之外，不要在 menus 中保留另一个 .yml 副本，否则它也是菜单。"}, {"id": "commands", "title": "命令与权限", "file": "commands.md", "html": "\u003ch1 id=\"命令与权限\">命令与权限\u003c/h1>\n\u003cp>主命令 \u003ccode>/dialogmenu\u003c/code>，别名 \u003ccode>/dmenu\u003c/code>、\u003ccode>/playersettings\u003c/code>、\u003ccode>/settings\u003c/code>、\u003ccode>/player-settings\u003c/code>。\u003c/p>\n\u003ch2 id=\"命令表\">命令表\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>命令\u003c/th>\n\u003cth>执行者\u003c/th>\n\u003cth>效果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu\u003c/code>\u003c/td>\n\u003ctd>玩家\u003c/td>\n\u003ctd>打开 DefaultMenu 的默认页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu open &lt;菜单ID&gt;\u003c/code>\u003c/td>\n\u003ctd>玩家\u003c/td>\n\u003ctd>打开该菜单的默认页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu open &lt;菜单ID&gt; &lt;页面ID&gt;\u003c/code>\u003c/td>\n\u003ctd>玩家\u003c/td>\n\u003ctd>打开指定子页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu check\u003c/code>\u003c/td>\n\u003ctd>玩家 / 控制台\u003c/td>\n\u003ctd>校验全局配置、全部菜单、跳转和物品源，不应用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu reload\u003c/code>\u003c/td>\n\u003ctd>玩家 / 控制台\u003c/td>\n\u003ctd>全部通过后应用并刷新已打开菜单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu pack\u003c/code>\u003c/td>\n\u003ctd>玩家\u003c/td>\n\u003ctd>URL 模式发送资源包；其他模式提示包名及来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/dmenu template &lt;模板ID&gt;\u003c/code>\u003c/td>\n\u003ctd>玩家\u003c/td>\n\u003ctd>兼容模板入口，新配置优先用 open\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>控制台输入时去掉 \u003ccode>/\u003c/code>。命令当前没有“替另一名玩家打开”的目标参数；\u003ccode>/dmenu open settings Alice\u003c/code> 中的 Alice 会被当作页面 ID。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">/dmenu open settings appearance\n/dmenu open demo-dialogue\n/dmenu open demo-boss intro\n/dmenu open demo-boss confirm\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"权限表\">权限表\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>权限\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>playersettings.use\u003c/code>\u003c/td>\n\u003ctd>允许普通玩家\u003c/td>\n\u003ctd>主命令与打开菜单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>playersettings.admin\u003c/code>\u003c/td>\n\u003ctd>默认 OP 可用\u003c/td>\n\u003ctd>check / reload 额外检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控件里的 Permission\u003c/td>\n\u003ctd>自己定义\u003c/td>\n\u003ctd>限制该控件动作；不是整个菜单的访问权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>插件更名后保留了旧权限名，不要改成自行猜测的 dialogmenu.use。没有内置的每菜单权限字段；对特定按钮使用 Permission，业务指令本身也由对应插件检查权限。\u003c/p>\n\u003ch2 id=\"重载时已打开的界面\">重载时已打开的界面\u003c/h2>\n\u003cp>settings 下拉框会收起。仍存在的页面会刷新；当前页被删除时回到菜单默认页；整个菜单被删除时关闭。\u003c/p>\n\u003cp>canvas 仍存在的页面重新绘制，并保留该页仍接受的变量值；页面或菜单不再存在则关闭。修改 ResourcePack 设置会关闭已打开菜单，重新满足加载要求后再打开。\u003c/p>\n\u003cp>check 不执行按钮里的命令，也不验证外部业务插件是否完成“扣钱”“发奖”等操作。\u003c/p>\n\u003ch2 id=\"旧入口\">旧入口\u003c/h2>\n\u003cp>旧页面入口如 \u003ccode>/dmenu open particles\u003c/code> 仍有兼容处理，但多菜单下建议总写完整菜单和页名。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>旧模板名\u003c/th>\n\u003cth>新入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>npc-dialogue\u003c/td>\n\u003ctd>\u003ccode>/dmenu open demo-dialogue main\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>boss-intro\u003c/td>\n\u003ctd>\u003ccode>/dmenu open demo-boss intro\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>boss-confirm\u003c/td>\n\u003ctd>\u003ccode>/dmenu open demo-boss confirm\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这些旧名映射要求默认演示菜单及对应页仍存在；复制和改名后使用新的 open 路径。\u003c/p>", "text": "命令与权限 主命令 /dialogmenu ，别名 /dmenu 、 /playersettings 、 /settings 、 /player-settings 。 命令表 命令 执行者 效果 /dmenu 玩家 打开 DefaultMenu 的默认页 /dmenu open \u003c菜单ID> 玩家 打开该菜单的默认页 /dmenu open \u003c菜单ID> \u003c页面ID> 玩家 打开指定子页 /dmenu check 玩家 / 控制台 校验全局配置、全部菜单、跳转和物品源，不应用 /dmenu reload 玩家 / 控制台 全部通过后应用并刷新已打开菜单 /dmenu pack 玩家 URL 模式发送资源包；其他模式提示包名及来源 /dmenu template \u003c模板ID> 玩家 兼容模板入口，新配置优先用 open 控制台输入时去掉 / 。命令当前没有“替另一名玩家打开”的目标参数； /dmenu open settings Alice 中的 Alice 会被当作页面 ID。 /dmenu open settings appearance /dmenu open demo-dialogue /dmenu open demo-boss intro /dmenu open demo-boss confirm 权限表 权限 默认 用途 playersettings.use 允许普通玩家 主命令与打开菜单 playersettings.admin 默认 OP 可用 check / reload 额外检查 控件里的 Permission 自己定义 限制该控件动作；不是整个菜单的访问权限 插件更名后保留了旧权限名，不要改成自行猜测的 dialogmenu.use。没有内置的每菜单权限字段；对特定按钮使用 Permission，业务指令本身也由对应插件检查权限。 重载时已打开的界面 settings 下拉框会收起。仍存在的页面会刷新；当前页被删除时回到菜单默认页；整个菜单被删除时关闭。 canvas 仍存在的页面重新绘制，并保留该页仍接受的变量值；页面或菜单不再存在则关闭。修改 ResourcePack 设置会关闭已打开菜单，重新满足加载要求后再打开。 check 不执行按钮里的命令，也不验证外部业务插件是否完成“扣钱”“发奖”等操作。 旧入口 旧页面入口如 /dmenu open particles 仍有兼容处理，但多菜单下建议总写完整菜单和页名。 旧模板名 新入口 npc-dialogue /dmenu open demo-dialogue main boss-intro /dmenu open demo-boss intro boss-confirm /dmenu open demo-boss confirm 这些旧名映射要求默认演示菜单及对应页仍存在；复制和改名后使用新的 open 路径。"}, {"id": "settings", "title": "settings 菜单与页面", "file": "settings.md", "html": "\u003ch1 id=\"settings-菜单与页面\">settings 菜单与页面\u003c/h1>\n\u003cp>\u003ccode>Type: settings\u003c/code> 用于左侧导航、右侧控件的菜单。位置由插件安排，适合玩家设置与常用操作。完整示例见 \u003ca href=\"#quick-start\">快速开始\u003c/a>。\u003c/p>\n\u003cp>新装附带的 \u003ccode>demo-settings.yml\u003c/code> 使用 \u003ccode>Type: settings-demo\u003c/code>，与真实设置采用相同布局。绑定控件使用本次演示内的独立状态，无需业务插件；语言、主题和缩放也只影响演示，重新打开重置。普通按钮只允许关闭、刷新、搜索与页内跳转。服务器已有 \u003ccode>settings.yml\u003c/code> 的真实功能与持久化选择不受影响。\u003c/p>\n\u003ch2 id=\"菜单根字段\">菜单根字段\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>默认值 / 要求\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Version\u003c/td>\n\u003ctd>整数\u003c/td>\n\u003ctd>必填 1\u003c/td>\n\u003ctd>菜单格式版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Type\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>必填 settings / settings-demo\u003c/td>\n\u003ctd>真实设置或独立演示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Title\u003c/td>\n\u003ctd>文本 / 双语映射\u003c/td>\n\u003ctd>内置“玩家设置 / Player Settings”\u003c/td>\n\u003ctd>整个菜单的标题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DefaultPage\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>Pages 第一页\u003c/td>\n\u003ctd>默认页，必须存在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Language\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>zh_cn\u003c/td>\n\u003ctd>新玩家默认语言：zh_cn / en_us\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Theme\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>dark\u003c/td>\n\u003ctd>新玩家默认主题：dark / light\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HideFocusOutline\u003c/td>\n\u003ctd>布尔\u003c/td>\n\u003ctd>true\u003c/td>\n\u003ctd>固定设置画布的焦点框处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MainMenu\u003c/td>\n\u003ctd>动作列表\u003c/td>\n\u003ctd>关闭后以玩家身份执行 menu\u003c/td>\n\u003ctd>共用返回主菜单按钮；可显式写 [close]\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pages\u003c/td>\n\u003ctd>配置段\u003c/td>\n\u003ctd>必填，1–8 页\u003c/td>\n\u003ctd>顺序也是左侧导航顺序\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Language、Theme 只给没有有效已存偏好的玩家提供默认值。玩家通过控件选择后保存为个人偏好，重连和重启保留；不会跟随每次配置修改重置。\u003c/p>\n\u003cp>默认 MainMenu 依赖服务器提供 \u003ccode>/menu\u003c/code> 命令。独立使用时建议显式写 \u003ccode>MainMenu: [close]\u003c/code>，或改为服务器实际的入口命令。\u003c/p>\n\u003ch2 id=\"子页字段\">子页字段\u003c/h2>\n\u003cp>以下是放到 \u003ccode>Pages.&lt;页面ID&gt;\u003c/code> 下的页面片段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Title: 旅行\nIcon: profile-icon\nKeywords: [旅行, 主城, travel]\nLayout: [介绍, 回城]\nIcons:\n  介绍:\n    Type: text\n    Name: 选择你的目的地\n  回城:\n    Name: 返回主城\n    Actions: [close, &quot;command: spawn&quot;]\n\u003c/code>\u003c/pre>\n\u003cp>此片段的 spawn 命令需要服务器实际提供。它不是一份可直接放进 menus 根目录的完整菜单。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Title\u003c/td>\n\u003ctd>文本 / 双语映射\u003c/td>\n\u003ctd>必填；导航名称和页面标题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Icon\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>可省略；左侧导航的 9 像素图标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Keywords\u003c/td>\n\u003ctd>字符串列表\u003c/td>\n\u003ctd>可省略；该页的搜索关键词\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Layout\u003c/td>\n\u003ctd>字符串列表\u003c/td>\n\u003ctd>必填；1–30 个不重复的控件名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Icons\u003c/td>\n\u003ctd>配置段\u003c/td>\n\u003ctd>必填；给 Layout 中每个控件定义内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Renderer\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>可省略；canvas / items\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>可用导航图标：\u003ccode>profile-icon\u003c/code>、\u003ccode>sound-icon\u003c/code>、\u003ccode>particles-icon\u003c/code>、\u003ccode>notices-icon\u003c/code>、\u003ccode>loot-icon\u003c/code>、\u003ccode>appearance-icon\u003c/code>。它们是内置皮肤图标，不是 Bukkit 材质名，不能写 DIAMOND 替代。\u003c/p>\n\u003cp>单数 \u003ccode>Icon\u003c/code> 是左侧导航图标，复数 \u003ccode>Icons\u003c/code> 是控件集合。导航 Icon 也不能填写 \u003ccode>source:IA:...\u003c/code> 或任务菜单的 Font/Glyph 配置段；换新 PNG 的资源路径见 \u003ca href=\"#icons\">图标与材质\u003c/a>。真实物品使用下方物品布局中的 Display.Material。\u003c/p>\n\u003ch2 id=\"layout-如何排版\">Layout 如何排版\u003c/h2>\n\u003cp>Layout 按从上到下的顺序使用控件。Icons 中未列入 Layout 的定义暂时不显示，且不要依赖未启用定义已经被完整校验。\u003c/p>\n\u003cp>自动排版使用两个面板。上方面板放不下时进入下方面板；\u003ccode>Type: heading\u003c/code> 会主动开始下方面板，作为分组标题。已经进入下方面板后再要求另开一个分组会报布局错误。\u003c/p>\n\u003cp>Description 也占空间；“最多 30 个控件”是配置数量上限，不代表界面能够容纳 30 个按钮。遇到面板不足时，减少说明、调整顺序或拆分到另一个子页。\u003c/p>\n\u003cp>下拉列表还需要展开空间。把选项较多的 dropdown 提前，避免放在页面底部。展开时被覆盖区域的控件和文字暂时不响应 / 显示，收起后恢复。\u003c/p>\n\u003ch2 id=\"文本与双语\">文本与双语\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">Name: {zh_cn: &quot;返回主城&quot;, en_us: &quot;Return to spawn&quot;}\nDescription:\n  - {zh_cn: &quot;点击传送&quot;, en_us: &quot;Click to teleport&quot;}\n  - &quot;这行两种语言显示相同文字&quot;\n\u003c/code>\u003c/pre>\n\u003cp>翻译映射必须同时包含 zh_cn 和 en_us，不能只填一个。Title、Name、Description 每行以及内置绑定的选项名都可使用这种写法。\u003c/p>\n\u003cp>纯文本无需加 \u003ccode>$\u003c/code>。简化格式里的 \u003ccode>$foo\u003c/code> 会作为普通文本，不读取旧版 languages 文件中的 foo。\u003c/p>\n\u003cp>普通文字不解析 MiniMessage / \u003ccode>&amp;a\u003c/code> 颜色语法；控件按皮肤样式显示，长文本按可用宽度裁切。canvas 元素的显式 Color 是另一套字段。\u003ccode>0.1.22\u003c/code> 新增的 image / i18n / l10n 写法见 \u003ca href=\"#text-tags\">图片标签与独立多语言\u003c/a>，翻译由 DialogMenu 自己管理。\u003c/p>\n\u003ch2 id=\"renderer-如何选择\">Renderer 如何选择\u003c/h2>\n\u003cp>未设置 Renderer 时，Layout 中存在 \u003ccode>Display.Material\u003c/code> 或 \u003ccode>Type: item\u003c/code> 会让\u003cstrong>整页\u003c/strong>自动使用原生物品布局。也可以写 \u003ccode>Renderer: items\u003c/code>。\u003c/p>\n\u003cp>显式 \u003ccode>Renderer: canvas\u003c/code> 的 settings 子页不能包含物品。原生物品页不支持 toggle、slider、dropdown，详见 \u003ca href=\"#items\">物品页面\u003c/a>。\u003c/p>\n\u003cp>需要像素坐标、插图、临时变量时，另建 \u003ccode>Type: canvas\u003c/code> 的菜单。\u003c/p>", "text": "settings 菜单与页面 Type: settings 用于左侧导航、右侧控件的菜单。位置由插件安排，适合玩家设置与常用操作。完整示例见 快速开始 。 新装附带的 demo-settings.yml 使用 Type: settings-demo ，与真实设置采用相同布局。绑定控件使用本次演示内的独立状态，无需业务插件；语言、主题和缩放也只影响演示，重新打开重置。普通按钮只允许关闭、刷新、搜索与页内跳转。服务器已有 settings.yml 的真实功能与持久化选择不受影响。 菜单根字段 字段 类型 默认值 / 要求 说明 Version 整数 必填 1 菜单格式版本 Type 字符串 必填 settings / settings-demo 真实设置或独立演示 Title 文本 / 双语映射 内置“玩家设置 / Player Settings” 整个菜单的标题 DefaultPage 字符串 Pages 第一页 默认页，必须存在 Language 字符串 zh_cn 新玩家默认语言：zh_cn / en_us Theme 字符串 dark 新玩家默认主题：dark / light HideFocusOutline 布尔 true 固定设置画布的焦点框处理 MainMenu 动作列表 关闭后以玩家身份执行 menu 共用返回主菜单按钮；可显式写 [close] Pages 配置段 必填，1–8 页 顺序也是左侧导航顺序 Language、Theme 只给没有有效已存偏好的玩家提供默认值。玩家通过控件选择后保存为个人偏好，重连和重启保留；不会跟随每次配置修改重置。 默认 MainMenu 依赖服务器提供 /menu 命令。独立使用时建议显式写 MainMenu: [close] ，或改为服务器实际的入口命令。 子页字段 以下是放到 Pages.\u003c页面ID> 下的页面片段： Title: 旅行 Icon: profile-icon Keywords: [旅行, 主城, travel] Layout: [介绍, 回城] Icons: 介绍: Type: text Name: 选择你的目的地 回城: Name: 返回主城 Actions: [close, \"command: spawn\"] 此片段的 spawn 命令需要服务器实际提供。它不是一份可直接放进 menus 根目录的完整菜单。 字段 类型 要求 Title 文本 / 双语映射 必填；导航名称和页面标题 Icon 字符串 可省略；左侧导航的 9 像素图标 Keywords 字符串列表 可省略；该页的搜索关键词 Layout 字符串列表 必填；1–30 个不重复的控件名 Icons 配置段 必填；给 Layout 中每个控件定义内容 Renderer 字符串 可省略；canvas / items 可用导航图标： profile-icon 、 sound-icon 、 particles-icon 、 notices-icon 、 loot-icon 、 appearance-icon 。它们是内置皮肤图标，不是 Bukkit 材质名，不能写 DIAMOND 替代。 单数 Icon 是左侧导航图标，复数 Icons 是控件集合。导航 Icon 也不能填写 source:IA:... 或任务菜单的 Font/Glyph 配置段；换新 PNG 的资源路径见 图标与材质 。真实物品使用下方物品布局中的 Display.Material。 Layout 如何排版 Layout 按从上到下的顺序使用控件。Icons 中未列入 Layout 的定义暂时不显示，且不要依赖未启用定义已经被完整校验。 自动排版使用两个面板。上方面板放不下时进入下方面板； Type: heading 会主动开始下方面板，作为分组标题。已经进入下方面板后再要求另开一个分组会报布局错误。 Description 也占空间；“最多 30 个控件”是配置数量上限，不代表界面能够容纳 30 个按钮。遇到面板不足时，减少说明、调整顺序或拆分到另一个子页。 下拉列表还需要展开空间。把选项较多的 dropdown 提前，避免放在页面底部。展开时被覆盖区域的控件和文字暂时不响应 / 显示，收起后恢复。 文本与双语 Name: {zh_cn: \"返回主城\", en_us: \"Return to spawn\"} Description: - {zh_cn: \"点击传送\", en_us: \"Click to teleport\"} - \"这行两种语言显示相同文字\" 翻译映射必须同时包含 zh_cn 和 en_us，不能只填一个。Title、Name、Description 每行以及内置绑定的选项名都可使用这种写法。 纯文本无需加 $ 。简化格式里的 $foo 会作为普通文本，不读取旧版 languages 文件中的 foo。 普通文字不解析 MiniMessage / &a 颜色语法；控件按皮肤样式显示，长文本按可用宽度裁切。canvas 元素的显式 Color 是另一套字段。 0.1.22 新增的 image / i18n / l10n 写法见 图片标签与独立多语言 ，翻译由 DialogMenu 自己管理。 Renderer 如何选择 未设置 Renderer 时，Layout 中存在 Display.Material 或 Type: item 会让 整页 自动使用原生物品布局。也可以写 Renderer: items 。 显式 Renderer: canvas 的 settings 子页不能包含物品。原生物品页不支持 toggle、slider、dropdown，详见 物品页面 。 需要像素坐标、插图、临时变量时，另建 Type: canvas 的菜单。"}, {"id": "controls", "title": "settings 控件参考", "file": "controls.md", "html": "\u003ch1 id=\"settings-控件参考\">settings 控件参考\u003c/h1>\n\u003cp>本章字段放在 \u003ccode>Pages.&lt;页ID&gt;.Icons.&lt;控件名&gt;\u003c/code> 下，并把控件名加入该页 Layout。以下均是 \u003cstrong>Icons 内的片段\u003c/strong>，不是完整菜单。\u003c/p>\n\u003ch2 id=\"字段总览\">字段总览\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>适用条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Type\u003c/td>\n\u003ctd>button / text / heading / toggle / slider / dropdown\u003c/td>\n\u003ctd>不填为 button\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Name\u003c/td>\n\u003ctd>显示名称\u003c/td>\n\u003ctd>不填取控件名；支持中英映射\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Description\u003c/td>\n\u003ctd>一段或列表形式的说明\u003c/td>\n\u003ctd>字体设置页最多 3 行；heading 不使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bind\u003c/td>\n\u003ctd>内置状态与动作绑定\u003c/td>\n\u003ctd>toggle / slider / dropdown\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>State\u003c/td>\n\u003ctd>完整的 %PAPI变量%\u003c/td>\n\u003ctd>无 Bind 的 toggle / slider / dropdown\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Options\u003c/td>\n\u003ctd>选项映射，顺序就是显示顺序\u003c/td>\n\u003ctd>slider / dropdown，2–8 项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Actions\u003c/td>\n\u003ctd>有序动作列表\u003c/td>\n\u003ctd>button / 无 Bind 的 toggle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Permission\u003c/td>\n\u003ctd>执行动作需要的玩家权限\u003c/td>\n\u003ctd>交互控件；不是隐藏条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RequiresPlugin\u003c/td>\n\u003ctd>依赖的插件名\u003c/td>\n\u003ctd>交互控件；按实际插件名填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这些是字体设置页的控件字段；物品页另外支持 Display，见 \u003ca href=\"#items\">物品页面\u003c/a>。\u003c/p>\n\u003ch2 id=\"button普通按钮\">button：普通按钮\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">回城:\n  Type: button\n  Name: 返回主城\n  Description: 点击返回出生点\n  Actions:\n    - close\n    - &quot;command: spawn&quot;\n\u003c/code>\u003c/pre>\n\u003cp>Type 和 Name 都可省略；Actions 必须提供。button 不读取 State，也没有 Options。spawn 需要对应插件或服务器命令支持。\u003c/p>\n\u003ch2 id=\"text说明文字\">text：说明文字\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">玩家信息:\n  Type: text\n  Name: &quot;玩家：{player}&quot;\n  Description:\n    - &quot;世界：{world}&quot;\n    - &quot;延迟：{ping} 毫秒&quot;\n\u003c/code>\u003c/pre>\n\u003cp>只使用 Type、Name、Description，不可添加 Actions、Bind、Permission。\u003c/p>\n\u003ch2 id=\"heading下方面板标题\">heading：下方面板标题\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">更多设置:\n  Type: heading\n  Name: 更多设置\n\u003c/code>\u003c/pre>\n\u003cp>只使用 Type、Name。它会开始下方面板，而非在当前位置随意插入一个标题。想显示普通小标题，可用 text。\u003c/p>\n\u003ch2 id=\"toggle开关\">toggle：开关\u003c/h2>\n\u003cp>内置绑定写法：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">环境粒子:\n  Type: toggle\n  Name: 环境粒子\n  Bind: particles\n\u003c/code>\u003c/pre>\n\u003cp>自定义联动写法：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">私人消息:\n  Type: toggle\n  Name: 接收私人消息\n  State: &quot;%example_messages_enabled%&quot;\n  RequiresPlugin: ExamplePlugin\n  Actions: [&quot;command: messages toggle&quot;]\n\u003c/code>\u003c/pre>\n\u003cp>第二个例子需要自己的插件提供 PAPI 变量、messages 指令和实际保存逻辑。\u003ccode>%example_messages_enabled%\u003c/code> 是示意变量，不是 DialogMenu 提供的变量。\u003c/p>\n\u003cp>toggle 识别的真值：开、开启、on、enabled、true、1；假值：关、关闭、off、disabled、false、0。英文字母不区分大小写。未解析或不认识的状态显示未接入。\u003c/p>\n\u003ch2 id=\"slider离散滑条\">slider：离散滑条\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">粒子密度:\n  Type: slider\n  Name: 粒子密度\n  Bind: particle-density\n  Options:\n    &quot;off&quot;: 关闭\n    low: 低\n    medium: 中\n    high: 高\n\u003c/code>\u003c/pre>\n\u003cp>按 Options 顺序分配档位，通过点击轨道或两侧箭头切换。它不是可以连续拖动的原生滑条。允许 2–8 个选项。\u003c/p>\n\u003ch2 id=\"dropdown下拉选择\">dropdown：下拉选择\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">界面主题:\n  Type: dropdown\n  Name: 界面主题\n  Bind: theme\n  Options:\n    dark: 暗色\n    light: 亮色\n\u003c/code>\u003c/pre>\n\u003cp>选择后立即应用并收起；同一时间只展开一个下拉框。下拉内容要完全放在画布内，空间不足会使 check 失败。\u003c/p>\n\u003ch2 id=\"全部内置-bind\">全部内置 Bind\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bind\u003c/th>\n\u003cth>控件类型\u003c/th>\n\u003cth>值 / 功能\u003c/th>\n\u003cth>联动来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>language\u003c/td>\n\u003ctd>dropdown / slider\u003c/td>\n\u003ctd>zh_cn、en_us\u003c/td>\n\u003ctd>DialogMenu 个人偏好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>theme\u003c/td>\n\u003ctd>dropdown / slider\u003c/td>\n\u003ctd>dark、light\u003c/td>\n\u003ctd>DialogMenu 个人偏好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>particle-density\u003c/td>\n\u003ctd>slider / dropdown\u003c/td>\n\u003ctd>off、low、medium、high\u003c/td>\n\u003ctd>Ambience，状态通过 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>particles\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>环境粒子总开关\u003c/td>\n\u003ctd>Ambience，状态通过 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sounds\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>环境音效\u003c/td>\n\u003ctd>Ambience，状态通过 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>leaves\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>落叶\u003c/td>\n\u003ctd>Ambience，状态通过 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>firefly\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>萤火虫\u003c/td>\n\u003ctd>Ambience，状态通过 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>biome\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>群系粒子\u003c/td>\n\u003ctd>Ambience，状态通过 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pickup\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>拾取提示\u003c/td>\n\u003ctd>PickupNotifier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>loot-beams\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>掉落光柱\u003c/td>\n\u003ctd>LootBeam\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>loot-sounds\u003c/td>\n\u003ctd>toggle\u003c/td>\n\u003ctd>光柱音效\u003c/td>\n\u003ctd>LootBeam\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Bind 同时提供状态来源和动作；用了 Bind 就不要再写 State 或控件层 Actions。其必要插件依赖不能被 RequiresPlugin 替换成另一个插件。\u003c/p>\n\u003cp>选择控件的内置 Options 只能使用该绑定允许的值。例如 theme 不接受 blue。选项显示文字可以自由修改。\u003c/p>\n\u003ch2 id=\"自定义-dropdown-slider\">自定义 dropdown / slider\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">游戏模式:\n  Type: dropdown\n  Name: 游戏难度\n  State: &quot;%example_mode%&quot;\n  RequiresPlugin: ExamplePlugin\n  Options:\n    easy:\n      Name: 简单\n      Actions: [&quot;command: examplemode easy&quot;]\n    hard:\n      Name: 困难\n      Actions: [&quot;command: examplemode hard&quot;]\n\u003c/code>\u003c/pre>\n\u003cp>无 Bind 时，Options 每项需要 Name 和 Actions，而不是一条文字。动作写在选项里，不能写在控件外层。控件的 Permission 和 RequiresPlugin 会用于各选项动作。\u003c/p>\n\u003cp>读取到的状态要与选项键匹配。DialogMenu 不会替外部插件保存这个模式；执行命令后重新读取 State。\u003c/p>\n\u003ch2 id=\"常见组合错误\">常见组合错误\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>错误\u003c/th>\n\u003cth>改法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Bind 与 State / Actions 同时写\u003c/td>\n\u003ctd>保留 Bind，或完全改成自定义 State + 动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>toggle 使用 Bind: theme\u003c/td>\n\u003ctd>theme 是选择值，使用 dropdown / slider\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>button 配 Options\u003c/td>\n\u003ctd>改为选择控件，或删掉 Options\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义 dropdown 的 Options 写纯文字\u003c/td>\n\u003ctd>改成每项 Name + Actions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>heading 带 Description\u003c/td>\n\u003ctd>删除说明，另用 text\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未加引号的 off 变成布尔值\u003c/td>\n\u003ctd>写成 \u003ccode>\"off\"\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>", "text": "settings 控件参考 本章字段放在 Pages.\u003c页ID>.Icons.\u003c控件名> 下，并把控件名加入该页 Layout。以下均是 Icons 内的片段 ，不是完整菜单。 字段总览 字段 用途 适用条件 Type button / text / heading / toggle / slider / dropdown 不填为 button Name 显示名称 不填取控件名；支持中英映射 Description 一段或列表形式的说明 字体设置页最多 3 行；heading 不使用 Bind 内置状态与动作绑定 toggle / slider / dropdown State 完整的 %PAPI变量% 无 Bind 的 toggle / slider / dropdown Options 选项映射，顺序就是显示顺序 slider / dropdown，2–8 项 Actions 有序动作列表 button / 无 Bind 的 toggle Permission 执行动作需要的玩家权限 交互控件；不是隐藏条件 RequiresPlugin 依赖的插件名 交互控件；按实际插件名填写 这些是字体设置页的控件字段；物品页另外支持 Display，见 物品页面 。 button：普通按钮 回城: Type: button Name: 返回主城 Description: 点击返回出生点 Actions: - close - \"command: spawn\" Type 和 Name 都可省略；Actions 必须提供。button 不读取 State，也没有 Options。spawn 需要对应插件或服务器命令支持。 text：说明文字 玩家信息: Type: text Name: \"玩家：{player}\" Description: - \"世界：{world}\" - \"延迟：{ping} 毫秒\" 只使用 Type、Name、Description，不可添加 Actions、Bind、Permission。 heading：下方面板标题 更多设置: Type: heading Name: 更多设置 只使用 Type、Name。它会开始下方面板，而非在当前位置随意插入一个标题。想显示普通小标题，可用 text。 toggle：开关 内置绑定写法： 环境粒子: Type: toggle Name: 环境粒子 Bind: particles 自定义联动写法： 私人消息: Type: toggle Name: 接收私人消息 State: \"%example_messages_enabled%\" RequiresPlugin: ExamplePlugin Actions: [\"command: messages toggle\"] 第二个例子需要自己的插件提供 PAPI 变量、messages 指令和实际保存逻辑。 %example_messages_enabled% 是示意变量，不是 DialogMenu 提供的变量。 toggle 识别的真值：开、开启、on、enabled、true、1；假值：关、关闭、off、disabled、false、0。英文字母不区分大小写。未解析或不认识的状态显示未接入。 slider：离散滑条 粒子密度: Type: slider Name: 粒子密度 Bind: particle-density Options: \"off\": 关闭 low: 低 medium: 中 high: 高 按 Options 顺序分配档位，通过点击轨道或两侧箭头切换。它不是可以连续拖动的原生滑条。允许 2–8 个选项。 dropdown：下拉选择 界面主题: Type: dropdown Name: 界面主题 Bind: theme Options: dark: 暗色 light: 亮色 选择后立即应用并收起；同一时间只展开一个下拉框。下拉内容要完全放在画布内，空间不足会使 check 失败。 全部内置 Bind Bind 控件类型 值 / 功能 联动来源 language dropdown / slider zh_cn、en_us DialogMenu 个人偏好 theme dropdown / slider dark、light DialogMenu 个人偏好 particle-density slider / dropdown off、low、medium、high Ambience，状态通过 PlaceholderAPI particles toggle 环境粒子总开关 Ambience，状态通过 PlaceholderAPI sounds toggle 环境音效 Ambience，状态通过 PlaceholderAPI leaves toggle 落叶 Ambience，状态通过 PlaceholderAPI firefly toggle 萤火虫 Ambience，状态通过 PlaceholderAPI biome toggle 群系粒子 Ambience，状态通过 PlaceholderAPI pickup toggle 拾取提示 PickupNotifier loot-beams toggle 掉落光柱 LootBeam loot-sounds toggle 光柱音效 LootBeam Bind 同时提供状态来源和动作；用了 Bind 就不要再写 State 或控件层 Actions。其必要插件依赖不能被 RequiresPlugin 替换成另一个插件。 选择控件的内置 Options 只能使用该绑定允许的值。例如 theme 不接受 blue。选项显示文字可以自由修改。 自定义 dropdown / slider 游戏模式: Type: dropdown Name: 游戏难度 State: \"%example_mode%\" RequiresPlugin: ExamplePlugin Options: easy: Name: 简单 Actions: [\"command: examplemode easy\"] hard: Name: 困难 Actions: [\"command: examplemode hard\"] 无 Bind 时，Options 每项需要 Name 和 Actions，而不是一条文字。动作写在选项里，不能写在控件外层。控件的 Permission 和 RequiresPlugin 会用于各选项动作。 读取到的状态要与选项键匹配。DialogMenu 不会替外部插件保存这个模式；执行命令后重新读取 State。 常见组合错误 错误 改法 Bind 与 State / Actions 同时写 保留 Bind，或完全改成自定义 State + 动作 toggle 使用 Bind: theme theme 是选择值，使用 dropdown / slider button 配 Options 改为选择控件，或删掉 Options 自定义 dropdown 的 Options 写纯文字 改成每项 Name + Actions heading 带 Description 删除说明，另用 text 未加引号的 off 变成布尔值 写成 \"off\""}, {"id": "canvas", "title": "canvas 画布", "file": "canvas.md", "html": "\u003ch1 id=\"canvas-画布\">canvas 画布\u003c/h1>\n\u003cp>\u003ccode>Type: canvas\u003c/code> 把每页作为可自由安排文字、按钮和图片的画布，适合 NPC 对话与首领界面。\u003c/p>\n\u003ch2 id=\"菜单和页面字段\">菜单和页面字段\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>菜单根字段\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Version: 1\u003c/td>\n\u003ctd>必填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Type: canvas\u003c/td>\n\u003ctd>必填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DefaultPage\u003c/td>\n\u003ctd>默认子页，不填取第一页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Title\u003c/td>\n\u003ctd>子页未配置标题时使用的公共标题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skin\u003c/td>\n\u003ctd>公共皮肤，默认 amethyst\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Canvas\u003c/td>\n\u003ctd>公共画布设置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Variables\u003c/td>\n\u003ctd>公共枚举变量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pages\u003c/td>\n\u003ctd>1–64 个页面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>每个 Pages 子页只支持 Title、Skin、Canvas、Variables、Elements。每页必须有 Elements；Title、Skin、Canvas、Variables 可继承根配置。\u003c/p>\n\u003cp>\u003cstrong>继承以整个字段 / 配置段为单位替换，不做深度合并。\u003c/strong> 子页写了 Variables，就替换根部全部变量；子页写了 Canvas，就替换根部整个 Canvas 配置段，未写的子字段重新取解析器默认值。\u003c/p>\n\u003cp>例如根部 \u003ccode>Canvas: {Width: 700, Rows: 24, Background: none, HideFocusOutline: false}\u003c/code>，子页只写 \u003ccode>Canvas: {Rows: 22}\u003c/code>，不会保留宽度 700。它会回到 Width 552、Background panel、HideFocusOutline true，并因非默认行数而报错。需要覆盖时复制完整段再修改。\u003c/p>\n\u003ch2 id=\"canvas-全字段\">Canvas 全字段\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">Canvas:\n  Width: 552\n  Rows: 20\n  Background: panel\n  HideFocusOutline: true\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>范围 / 用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Width\u003c/td>\n\u003ctd>552\u003c/td>\n\u003ctd>整数，180–960 像素\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rows\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>整数，8–28 行；每行 9 像素\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Background\u003c/td>\n\u003ctd>panel\u003c/td>\n\u003ctd>当前 Skin 中的内置贴图名；none 表示无背景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HideFocusOutline\u003c/td>\n\u003ctd>true\u003c/td>\n\u003ctd>仅 Width 552 且 Rows 20 时可为 true\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>默认画布为 \u003cstrong>552 × 180 像素\u003c/strong>。自定义尺寸时设置 HideFocusOutline: false。背景贴图必须放得下，改变 Width / Rows 不会把 panel 拉伸缩放。\u003c/p>\n\u003cp>例如小画布配置片段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Canvas:\n  Width: 360\n  Rows: 12\n  Background: none\n  HideFocusOutline: false\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"位置怎么计算\">位置怎么计算\u003c/h2>\n\u003cp>\u003ccode>Position: [156, 8]\u003c/code> 表示从画布左边向右 156 像素，从顶端向下 8 行，也就是 72 像素。坐标从 0 开始，必须为非负整数。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">左上角 [0, 0] ─────────────────→ X 像素\n    │\n    │ Row 1 = 向下 9 像素\n    │ Row 2 = 向下 18 像素\n    ↓\n   Row\n\n默认有效空间：X 宽 552 像素，Row 高 20 行\n\u003c/code>\u003c/pre>\n\u003cp>元素必须完整位于画布中：\u003ccode>X + Width &lt;= Canvas.Width\u003c/code>，\u003ccode>Row + Rows &lt;= Canvas.Rows\u003c/code>。\u003c/p>\n\u003cp>普通按钮宽 108、高 2 行，因此 \u003ccode>Position: [414, 17]\u003c/code> 可以放下；\u003ccode>[500, 19]\u003c/code> 会越界。\u003c/p>\n\u003ch2 id=\"skin-和-theme-的区别\">Skin 和 Theme 的区别\u003c/h2>\n\u003cp>canvas 皮肤仅有 amethyst（紫晶）和 parchment（羊皮纸）。它们尺寸相同，颜色和美术不同。canvas 不读取 settings 的玩家 dark / light 主题偏好。\u003c/p>\n\u003cp>同一菜单不同子页可以选择不同 Skin。Skin 选择的是已经在资源包里的贴图，不能写本地 PNG 文件路径。\u003c/p>\n\u003ch2 id=\"标题关闭与交互\">标题、关闭与交互\u003c/h2>\n\u003cp>Title 是 Dialog 的外部标题元数据，不能代替画布内的可见标题元素。要在面板上显示“守门人”，添加 Type: text 的 Elements 元素。\u003c/p>\n\u003cp>canvas 没有自动的左侧导航，也没有底部原生关闭按钮。翻页和 × 都需要自己配置 button；ESC 可以关闭。\u003c/p>\n\u003cp>没有变量选择或按钮操作时，画面不会自动定时刷新。要更新文字可使用 refresh 或重新打开。\u003c/p>\n\u003ch2 id=\"焦点框和客户端尺寸\">焦点框和客户端尺寸\u003c/h2>\n\u003cp>焦点框隐藏依赖配套 gui 着色器的几何匹配，并不能按菜单 ID 识别。其默认区域为 576 × 188；其他同位置、同尺寸白线也可能匹配。\u003c/p>\n\u003cp>修改画布尺寸时关闭 HideFocusOutline，并注意客户端 GUI 缩放。页面裁切时先把 GUI 缩放调小；增加 Rows 不会自动扩大玩家窗口。\u003c/p>\n\u003cp>下一步：\u003ca href=\"#elements\">元素和图片字段\u003c/a> · \u003ca href=\"#variables\">变量与条件\u003c/a>\u003c/p>", "text": "canvas 画布 Type: canvas 把每页作为可自由安排文字、按钮和图片的画布，适合 NPC 对话与首领界面。 菜单和页面字段 菜单根字段 用途 Version: 1 必填 Type: canvas 必填 DefaultPage 默认子页，不填取第一页 Title 子页未配置标题时使用的公共标题 Skin 公共皮肤，默认 amethyst Canvas 公共画布设置 Variables 公共枚举变量 Pages 1–64 个页面 每个 Pages 子页只支持 Title、Skin、Canvas、Variables、Elements。每页必须有 Elements；Title、Skin、Canvas、Variables 可继承根配置。 继承以整个字段 / 配置段为单位替换，不做深度合并。 子页写了 Variables，就替换根部全部变量；子页写了 Canvas，就替换根部整个 Canvas 配置段，未写的子字段重新取解析器默认值。 例如根部 Canvas: {Width: 700, Rows: 24, Background: none, HideFocusOutline: false} ，子页只写 Canvas: {Rows: 22} ，不会保留宽度 700。它会回到 Width 552、Background panel、HideFocusOutline true，并因非默认行数而报错。需要覆盖时复制完整段再修改。 Canvas 全字段 Canvas: Width: 552 Rows: 20 Background: panel HideFocusOutline: true 字段 默认 范围 / 用途 Width 552 整数，180–960 像素 Rows 20 整数，8–28 行；每行 9 像素 Background panel 当前 Skin 中的内置贴图名；none 表示无背景 HideFocusOutline true 仅 Width 552 且 Rows 20 时可为 true 默认画布为 552 × 180 像素 。自定义尺寸时设置 HideFocusOutline: false。背景贴图必须放得下，改变 Width / Rows 不会把 panel 拉伸缩放。 例如小画布配置片段： Canvas: Width: 360 Rows: 12 Background: none HideFocusOutline: false 位置怎么计算 Position: [156, 8] 表示从画布左边向右 156 像素，从顶端向下 8 行，也就是 72 像素。坐标从 0 开始，必须为非负整数。 左上角 [0, 0] ─────────────────→ X 像素 │ │ Row 1 = 向下 9 像素 │ Row 2 = 向下 18 像素 ↓ Row 默认有效空间：X 宽 552 像素，Row 高 20 行 元素必须完整位于画布中： X + Width \u003c= Canvas.Width ， Row + Rows \u003c= Canvas.Rows 。 普通按钮宽 108、高 2 行，因此 Position: [414, 17] 可以放下； [500, 19] 会越界。 Skin 和 Theme 的区别 canvas 皮肤仅有 amethyst（紫晶）和 parchment（羊皮纸）。它们尺寸相同，颜色和美术不同。canvas 不读取 settings 的玩家 dark / light 主题偏好。 同一菜单不同子页可以选择不同 Skin。Skin 选择的是已经在资源包里的贴图，不能写本地 PNG 文件路径。 标题、关闭与交互 Title 是 Dialog 的外部标题元数据，不能代替画布内的可见标题元素。要在面板上显示“守门人”，添加 Type: text 的 Elements 元素。 canvas 没有自动的左侧导航，也没有底部原生关闭按钮。翻页和 × 都需要自己配置 button；ESC 可以关闭。 没有变量选择或按钮操作时，画面不会自动定时刷新。要更新文字可使用 refresh 或重新打开。 焦点框和客户端尺寸 焦点框隐藏依赖配套 gui 着色器的几何匹配，并不能按菜单 ID 识别。其默认区域为 576 × 188；其他同位置、同尺寸白线也可能匹配。 修改画布尺寸时关闭 HideFocusOutline，并注意客户端 GUI 缩放。页面裁切时先把 GUI 缩放调小；增加 Rows 不会自动扩大玩家窗口。 下一步： 元素和图片字段 · 变量与条件"}, {"id": "elements", "title": "canvas 元素与贴图", "file": "elements.md", "html": "\u003ch1 id=\"canvas-元素与贴图\">canvas 元素与贴图\u003c/h1>\n\u003cp>字段放在 \u003ccode>Pages.&lt;页ID&gt;.Elements.&lt;元素ID&gt;\u003c/code>。元素 ID 必须是小写英文开头的合法 ID，不使用中文；显示文字放 Text。\u003c/p>\n\u003ch2 id=\"通用字段\">通用字段\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>类型 / 默认\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Type\u003c/td>\n\u003ctd>text / button / sprite；默认 text\u003c/td>\n\u003ctd>元素种类\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Position\u003c/td>\n\u003ctd>必填 [X, Row]\u003c/td>\n\u003ctd>横向像素、纵向行，每行 9 像素\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Text\u003c/td>\n\u003ctd>单行字符串或字符串列表\u003c/td>\n\u003ctd>text 正文；button 必须恰好一行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Color\u003c/td>\n\u003ctd>默认 \"#e7deed\"\u003c/td>\n\u003ctd>\u003ccode>#RRGGBB\u003c/code>，作用于文字\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VisibleWhen\u003c/td>\n\u003ctd>可省略\u003c/td>\n\u003ctd>声明过的变量等值条件，如 difficulty=hard\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SelectedWhen\u003c/td>\n\u003ctd>可省略\u003c/td>\n\u003ctd>选中条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SelectedSprite\u003c/td>\n\u003ctd>可省略\u003c/td>\n\u003ctd>选中时替换的内置贴图，尺寸必须与原贴图相同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Permission\u003c/td>\n\u003ctd>可省略\u003c/td>\n\u003ctd>button 点击权限；不使元素隐藏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Actions\u003c/td>\n\u003ctd>button 必填，1–16 条\u003c/td>\n\u003ctd>\u003ca href=\"#actions\">canvas 动作\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>配置只应使用对应类型有意义的字段。sprite 不绘制 Text，text 不使用 Sprite，Permission 对非按钮不提供可见性控制。\u003c/p>\n\u003ch2 id=\"text正文与标题\">text：正文与标题\u003c/h2>\n\u003cp>放入 Elements 的片段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">dialogue:\n  Type: text\n  Position: [156, 8]\n  Width: 348\n  Rows: 5\n  Text:\n    - &quot;你好，{player}。&quot;\n    - &quot;古堡的灯重新亮起，你愿意前往调查吗？&quot;\n  Color: &quot;#e7deed&quot;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>text 专用字段\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Width\u003c/td>\n\u003ctd>Canvas.Width - X - 12\u003c/td>\n\u003ctd>1–960，仍需放得进画布\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rows\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1–28，仍需放得进画布\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>文本按测量宽度换行，最多显示 Rows 行；超出时截断并在末尾显示 \u003ccode>..\u003c/code>。Text 的列表表示多条起始文本，每条仍可自动折行。\u003c/p>\n\u003cp>每条输入文本最多 2048 字符，不允许换行 / Tab 等控制字符。使用列表处理多段，不使用 \u003ccode>Text: |\u003c/code> 的多行块。普通文字使用 Color，不解析 MiniMessage 或 \u003ccode>&amp;a\u003c/code>。\u003ccode>0.1.22\u003c/code> 的 image / i18n / l10n 文本解析见 \u003ca href=\"#text-tags\">图片标签与独立多语言\u003c/a>。\u003c/p>\n\u003ch2 id=\"button可点击区域\">button：可点击区域\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">accept:\n  Type: button\n  Position: [156, 16]\n  Sprite: wide-button\n  Text: 接受委托\n  Actions: [&quot;message: 你接受了演示委托。&quot;, close]\n\u003c/code>\u003c/pre>\n\u003cp>button 默认 Sprite 是 button，大小由贴图决定。设置 Width / Rows 不能把内置按钮拉伸；需要宽按钮时使用 wide-button。\u003c/p>\n\u003cp>按钮文字自动居中，过长裁切。按钮背景和文字都属于点击区域。按钮间不允许重叠，除非双方 VisibleWhen 是同一个变量的不同值，确保不会同时显示。\u003c/p>\n\u003ch2 id=\"sprite装饰图片\">sprite：装饰图片\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">portrait:\n  Type: sprite\n  Position: [24, 3]\n  Sprite: emblem\n\u003c/code>\u003c/pre>\n\u003cp>不写 Sprite 时默认 emblem。装饰图没有动作；reward 也只是一张图片，不是玩家可以拿走的物品。\u003c/p>\n\u003ch2 id=\"内置贴图尺寸\">内置贴图尺寸\u003c/h2>\n\u003cp>两种 Skin 都提供以下贴图。Rows 是画布行数：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sprite\u003c/th>\n\u003cth>Width\u003c/th>\n\u003cth>Rows\u003c/th>\n\u003cth>像素尺寸\u003c/th>\n\u003cth>常见用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>panel\u003c/td>\n\u003ctd>552\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>552 × 180\u003c/td>\n\u003ctd>整块背景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>button\u003c/td>\n\u003ctd>108\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>108 × 18\u003c/td>\n\u003ctd>标准按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>selected\u003c/td>\n\u003ctd>108\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>108 × 18\u003c/td>\n\u003ctd>选中的标准按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>wide-button\u003c/td>\n\u003ctd>144\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>144 × 18\u003c/td>\n\u003ctd>宽按钮\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>close\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>18 × 18\u003c/td>\n\u003ctd>右上角 ×\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>divider\u003c/td>\n\u003ctd>348\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>348 × 9\u003c/td>\n\u003ctd>分隔线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>emblem\u003c/td>\n\u003ctd>108\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>108 × 108\u003c/td>\n\u003ctd>占位徽记 / 插图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reward\u003c/td>\n\u003ctd>27\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>27 × 27\u003c/td>\n\u003ctd>奖励占位图\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>wide-button 不能配 SelectedSprite: selected，因为 144 与 108 的宽度不同。标准 button 可以配 selected。\u003c/p>\n\u003ch2 id=\"接入已有资源包字体立绘\">接入已有资源包字体立绘\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">portrait:\n  Type: sprite\n  Position: [24, 3]\n  Font: &quot;my_pack:portraits&quot;\n  Glyph: &quot;\\uE001&quot;\n  Width: 108\n  Rows: 12\n  Advance: 109\n\u003c/code>\u003c/pre>\n\u003cp>这是示意片段，需要资源包实际提供 \u003ccode>my_pack:portraits\u003c/code> 字体与对应字形。直接填图片文件名不能显示。\u003c/p>\n\u003cp>不依赖 CE，也不能把 Font 改成 \u003ccode>source:IA:...\u003c/code> 等物品注册 ID。从 PNG 定义原生 bitmap 字体，以及任务 Icon 与物品 Material 的区别，见 \u003ca href=\"#icons\">图标与材质\u003c/a>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>自定义字体字段\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Font\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>字体资源 ID，只用于 sprite\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Glyph\u003c/td>\n\u003ctd>必填\u003c/td>\n\u003ctd>单个 BMP 字符；YAML 双引号可用 Unicode 转义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Width\u003c/td>\n\u003ctd>108\u003c/td>\n\u003ctd>1–256，实际图片占用宽度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rows\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>1–28，实际高度按每行 9 像素计算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advance\u003c/td>\n\u003ctd>Width + 1\u003c/td>\n\u003ctd>0–1024，字体绘制后的游标前进量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Width 与 Advance 不是同一个概念。要按实际字体 metrics 填写，否则图片后续元素可能偏位。插件不能仅凭 YAML 校验客户端字体图片是否存在、尺寸是否正确，需要加载资源包后查看实际效果。\u003c/p>", "text": "canvas 元素与贴图 字段放在 Pages.\u003c页ID>.Elements.\u003c元素ID> 。元素 ID 必须是小写英文开头的合法 ID，不使用中文；显示文字放 Text。 通用字段 字段 类型 / 默认 用途 Type text / button / sprite；默认 text 元素种类 Position 必填 [X, Row] 横向像素、纵向行，每行 9 像素 Text 单行字符串或字符串列表 text 正文；button 必须恰好一行 Color 默认 \"#e7deed\" #RRGGBB ，作用于文字 VisibleWhen 可省略 声明过的变量等值条件，如 difficulty=hard SelectedWhen 可省略 选中条件 SelectedSprite 可省略 选中时替换的内置贴图，尺寸必须与原贴图相同 Permission 可省略 button 点击权限；不使元素隐藏 Actions button 必填，1–16 条 canvas 动作 配置只应使用对应类型有意义的字段。sprite 不绘制 Text，text 不使用 Sprite，Permission 对非按钮不提供可见性控制。 text：正文与标题 放入 Elements 的片段： dialogue: Type: text Position: [156, 8] Width: 348 Rows: 5 Text: - \"你好，{player}。\" - \"古堡的灯重新亮起，你愿意前往调查吗？\" Color: \"#e7deed\" text 专用字段 默认 限制 Width Canvas.Width - X - 12 1–960，仍需放得进画布 Rows 1 1–28，仍需放得进画布 文本按测量宽度换行，最多显示 Rows 行；超出时截断并在末尾显示 .. 。Text 的列表表示多条起始文本，每条仍可自动折行。 每条输入文本最多 2048 字符，不允许换行 / Tab 等控制字符。使用列表处理多段，不使用 Text: | 的多行块。普通文字使用 Color，不解析 MiniMessage 或 &a 。 0.1.22 的 image / i18n / l10n 文本解析见 图片标签与独立多语言 。 button：可点击区域 accept: Type: button Position: [156, 16] Sprite: wide-button Text: 接受委托 Actions: [\"message: 你接受了演示委托。\", close] button 默认 Sprite 是 button，大小由贴图决定。设置 Width / Rows 不能把内置按钮拉伸；需要宽按钮时使用 wide-button。 按钮文字自动居中，过长裁切。按钮背景和文字都属于点击区域。按钮间不允许重叠，除非双方 VisibleWhen 是同一个变量的不同值，确保不会同时显示。 sprite：装饰图片 portrait: Type: sprite Position: [24, 3] Sprite: emblem 不写 Sprite 时默认 emblem。装饰图没有动作；reward 也只是一张图片，不是玩家可以拿走的物品。 内置贴图尺寸 两种 Skin 都提供以下贴图。Rows 是画布行数： Sprite Width Rows 像素尺寸 常见用途 panel 552 20 552 × 180 整块背景 button 108 2 108 × 18 标准按钮 selected 108 2 108 × 18 选中的标准按钮 wide-button 144 2 144 × 18 宽按钮 close 18 2 18 × 18 右上角 × divider 348 1 348 × 9 分隔线 emblem 108 12 108 × 108 占位徽记 / 插图 reward 27 3 27 × 27 奖励占位图 wide-button 不能配 SelectedSprite: selected，因为 144 与 108 的宽度不同。标准 button 可以配 selected。 接入已有资源包字体立绘 portrait: Type: sprite Position: [24, 3] Font: \"my_pack:portraits\" Glyph: \"\\uE001\" Width: 108 Rows: 12 Advance: 109 这是示意片段，需要资源包实际提供 my_pack:portraits 字体与对应字形。直接填图片文件名不能显示。 不依赖 CE，也不能把 Font 改成 source:IA:... 等物品注册 ID。从 PNG 定义原生 bitmap 字体，以及任务 Icon 与物品 Material 的区别，见 图标与材质 。 自定义字体字段 默认 要求 Font 无 字体资源 ID，只用于 sprite Glyph 必填 单个 BMP 字符；YAML 双引号可用 Unicode 转义 Width 108 1–256，实际图片占用宽度 Rows 12 1–28，实际高度按每行 9 像素计算 Advance Width + 1 0–1024，字体绘制后的游标前进量 Width 与 Advance 不是同一个概念。要按实际字体 metrics 填写，否则图片后续元素可能偏位。插件不能仅凭 YAML 校验客户端字体图片是否存在、尺寸是否正确，需要加载资源包后查看实际效果。"}, {"id": "text-tags", "title": "图片标签与独立多语言", "file": "text-tags.md", "html": "\u003ch1 id=\"图片标签与独立多语言\">图片标签与独立多语言\u003c/h1>\n\u003cp>从 \u003ccode>0.1.22\u003c/code> 开始提供。正式版包含 0.1.21 的兼容与资源自动导入功能，以及后续修复合法目录联接被路径检查拒绝的补丁。\u003c/p>\n\u003cp>CE 已通过真实插件联动验证；IA 适配已实现，尚待真实 IA 服务器验证。完整验证范围见 \u003ca href=\"../development/RELEASE-0.1.22.md\">正式版验证记录\u003c/a>。\u003c/p>\n\u003ch2 id=\"翻译由-dialogmenu-管理\">翻译由 DialogMenu 管理\u003c/h2>\n\u003cp>启动后在 \u003ccode>plugins/DialogMenu/\u003c/code> 自动生成：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">text.yml\ntranslations/zh_cn.yml\ntranslations/en_us.yml\n\u003c/code>\u003c/pre>\n\u003cp>不需要在 CraftEngine 中创建翻译，也不需要安装 CE 才能使用多语言。CE、IA 等插件仍可负责资源包的构建与发送；翻译文件留在 DialogMenu 目录，不放进资源包。\u003c/p>\n\u003cp>\u003ccode>text.yml\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">DefaultLanguage: zh_cn\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>translations/zh_cn.yml\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">menu:\n  title: &quot;旅行菜单&quot;\n  welcome: &quot;你好，&lt;arg:0&gt;！&quot;\n  spawn: &quot;返回主城&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>translations/en_us.yml\u003c/code>：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">menu:\n  title: &quot;Travel menu&quot;\n  welcome: &quot;Hello, &lt;arg:0&gt;!&quot;\n  spawn: &quot;Return to spawn&quot;\n\u003c/code>\u003c/pre>\n\u003cp>菜单字段可以写：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Title: &quot;&lt;l10n:menu.title&gt;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>settings 控件片段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Name: &quot;&lt;l10n:menu.spawn&gt;&quot;\nDescription:\n  - &quot;&lt;i18n:menu.title&gt;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>canvas 元素片段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">welcome:\n  Type: text\n  Position: [156, 8]\n  Width: 348\n  Rows: 2\n  Text: &quot;&lt;l10n:menu.welcome:'{player}'&gt;&quot;\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>标签\u003c/th>\n\u003cth>语言选择\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;i18n:menu.title&gt;\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>text.yml\u003c/code> 的 DefaultLanguage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;l10n:menu.title&gt;\u003c/code>\u003c/td>\n\u003ctd>当前查看菜单的玩家客户端语言\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;l10n:menu.welcome:'Alex'&gt;\u003c/code>\u003c/td>\n\u003ctd>翻译内 \u003ccode>&lt;arg:0&gt;\u003c/code> 为第一个参数，序号从 0 开始\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>支持新增 \u003ccode>ja_jp.yml\u003c/code>、\u003ccode>fr_fr.yml\u003c/code> 等语言文件。查找顺序是客户端完整语言（如 \u003ccode>fr_ca\u003c/code>）、仅语言文件（如 \u003ccode>fr.yml\u003c/code>）、默认语言；同样适用于某个键缺失时的回退。全部找不到则显示键名，并在控制台报告。\u003ccode>i18n\u003c/code> 只查默认语言。\u003c/p>\n\u003cp>现有 \u003ccode>Name: {zh_cn: ..., en_us: ...}\u003c/code> 及玩家保存的菜单语言偏好继续有效；它们不改变 \u003ccode>l10n\u003c/code> 的客户端语言含义。客户端语言切换后重新打开或刷新菜单即可更新。\u003c/p>\n\u003cp>翻译支持嵌套 \u003ccode>i18n\u003c/code> / \u003ccode>l10n\u003c/code>、图片、颜色和加粗等文字装饰；循环引用受限制。翻译应使用单行字符串，控制字符显示为空格。修改后执行 \u003ccode>/dmenu check\u003c/code>、\u003ccode>/dmenu reload\u003c/code>，不需要重新生成资源包。语法错误保留旧菜单与旧翻译。\u003c/p>\n\u003ch2 id=\"引用-ce-ia-的字体图片\">引用 CE / IA 的字体图片\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;image:my_pack:star&gt;\u003c/code>\u003c/td>\n\u003ctd>默认 CraftEngine\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;image:CE:my_pack:star&gt;\u003c/code>\u003c/td>\n\u003ctd>CraftEngine，别名 CraftEngine\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;image:IA:my_pack:star&gt;\u003c/code>\u003c/td>\n\u003ctd>ItemsAdder，别名 ItemsAdder\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&lt;image:CE:default:emojis:0:1&gt;\u003c/code>\u003c/td>\n\u003ctd>CE 图集第 0 行、第 1 列\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>插件前缀不区分大小写；图片 ID 使用来源插件注册的完整 ID。CE/IA 是两套图片注册表，图片 ID 不是物品 ID 或 PNG 路径。其他来源前缀暂未接入，现有 ItemBridge 物品源数量不代表图片来源数量。\u003c/p>\n\u003cp>例如，settings 的 \u003ccode>Name\u003c/code> 或 canvas 的 \u003ccode>Text\u003c/code> 可以写：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Text: &quot;&lt;image:IA:my_pack:star&gt; &lt;l10n:menu.title&gt;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>需要对应插件已启用、图片已注册，且玩家加载了包含字体和图片的资源包。图片使用来源插件定义的高度和基线；菜单的 FontSize 不缩放图片。大图片应为它预留足够的行高，小图标更适合插入按钮文字。\u003c/p>\n\u003cp>DialogMenu 在换行、居中、裁切前解析图片与翻译；图片按一个完整字形处理，不把标签原文当作文字宽度。CE 字宽从实际 PNG 的透明边界和字体高度测量，支持已注册的图集单元及图片引用。IA 使用 FontImageWrapper 的图片字符串与宽度 API。\u003c/p>\n\u003cp>图片缺失、插件未安装或 API 不兼容时显示 \u003ccode>[image:图片ID]\u003c/code>，并报告原因。\u003ccode>/dmenu reload\u003c/code> 会清除图片缓存，CE/IA 的数据重载事件也会刷新已打开菜单。更换图片资源后仍需通过来源插件构建、发送新资源包。\u003c/p>\n\u003cp>本测试版不解析任意物品为图片，也不支持 CE 图片标签的末尾 format 参数或独立 \u003ccode>&lt;shift&gt;\u003c/code>。原有 \u003ccode>Sprite\u003c/code> 和 \u003ccode>Font/Glyph/Width/Rows/Advance\u003c/code> 继续可用。\u003c/p>\n\u003ch2 id=\"可用字段与兼容规则\">可用字段与兼容规则\u003c/h2>\n\u003cp>支持 settings 的标题、导航名称、控件名/说明/选项，以及原生物品页面文字；canvas 的标题、正文和按钮文字也支持。图片标签写在文本字段，不能替代 \u003ccode>Icon\u003c/code>、\u003ccode>Sprite\u003c/code>、\u003ccode>Display.Material\u003c/code> 的原有配置格式。canvas 的 \u003ccode>message:\u003c/code> 动作也可使用标签；命令和权限字段保持原语义。\u003c/p>\n\u003cp>只有包含 \u003ccode>&lt;image:...&gt;\u003c/code>、\u003ccode>&lt;i18n:...&gt;\u003c/code> 或 \u003ccode>&lt;l10n:...&gt;\u003c/code> 的文本才启用这套解析。其他既有文本仍为普通文字，不会突然把 \u003ccode>&lt;red&gt;\u003c/code> 或 \u003ccode>&amp;a\u003c/code> 当作颜色。启用标签的文本支持 MiniMessage 颜色、文字装饰和 reset；不执行文本中的点击命令或悬浮事件。\u003c/p>\n\u003cp>测试示例见 \u003ca href=\"examples/text-tags.yml\">独立多语言菜单\u003c/a>。将它复制到 \u003ccode>plugins/DialogMenu/menus/text-tags.yml\u003c/code>，执行 \u003ccode>/dmenu reload\u003c/code>、\u003ccode>/dmenu open text-tags\u003c/code>。默认示例只依赖随 JAR 提供的翻译，图片行需要替换成你已有的图片 ID。\u003c/p>", "text": "图片标签与独立多语言 从 0.1.22 开始提供。正式版包含 0.1.21 的兼容与资源自动导入功能，以及后续修复合法目录联接被路径检查拒绝的补丁。 CE 已通过真实插件联动验证；IA 适配已实现，尚待真实 IA 服务器验证。完整验证范围见 正式版验证记录 。 翻译由 DialogMenu 管理 启动后在 plugins/DialogMenu/ 自动生成： text.yml translations/zh_cn.yml translations/en_us.yml 不需要在 CraftEngine 中创建翻译，也不需要安装 CE 才能使用多语言。CE、IA 等插件仍可负责资源包的构建与发送；翻译文件留在 DialogMenu 目录，不放进资源包。 text.yml ： DefaultLanguage: zh_cn translations/zh_cn.yml ： menu: title: \"旅行菜单\" welcome: \"你好，\u003carg:0>！\" spawn: \"返回主城\" translations/en_us.yml ： menu: title: \"Travel menu\" welcome: \"Hello, \u003carg:0>!\" spawn: \"Return to spawn\" 菜单字段可以写： Title: \"\u003cl10n:menu.title>\" settings 控件片段： Name: \"\u003cl10n:menu.spawn>\" Description: - \"\u003ci18n:menu.title>\" canvas 元素片段： welcome: Type: text Position: [156, 8] Width: 348 Rows: 2 Text: \"\u003cl10n:menu.welcome:'{player}'>\" 标签 语言选择 \u003ci18n:menu.title> text.yml 的 DefaultLanguage \u003cl10n:menu.title> 当前查看菜单的玩家客户端语言 \u003cl10n:menu.welcome:'Alex'> 翻译内 \u003carg:0> 为第一个参数，序号从 0 开始 支持新增 ja_jp.yml 、 fr_fr.yml 等语言文件。查找顺序是客户端完整语言（如 fr_ca ）、仅语言文件（如 fr.yml ）、默认语言；同样适用于某个键缺失时的回退。全部找不到则显示键名，并在控制台报告。 i18n 只查默认语言。 现有 Name: {zh_cn: ..., en_us: ...} 及玩家保存的菜单语言偏好继续有效；它们不改变 l10n 的客户端语言含义。客户端语言切换后重新打开或刷新菜单即可更新。 翻译支持嵌套 i18n / l10n 、图片、颜色和加粗等文字装饰；循环引用受限制。翻译应使用单行字符串，控制字符显示为空格。修改后执行 /dmenu check 、 /dmenu reload ，不需要重新生成资源包。语法错误保留旧菜单与旧翻译。 引用 CE / IA 的字体图片 写法 来源 \u003cimage:my_pack:star> 默认 CraftEngine \u003cimage:CE:my_pack:star> CraftEngine，别名 CraftEngine \u003cimage:IA:my_pack:star> ItemsAdder，别名 ItemsAdder \u003cimage:CE:default:emojis:0:1> CE 图集第 0 行、第 1 列 插件前缀不区分大小写；图片 ID 使用来源插件注册的完整 ID。CE/IA 是两套图片注册表，图片 ID 不是物品 ID 或 PNG 路径。其他来源前缀暂未接入，现有 ItemBridge 物品源数量不代表图片来源数量。 例如，settings 的 Name 或 canvas 的 Text 可以写： Text: \"\u003cimage:IA:my_pack:star> \u003cl10n:menu.title>\" 需要对应插件已启用、图片已注册，且玩家加载了包含字体和图片的资源包。图片使用来源插件定义的高度和基线；菜单的 FontSize 不缩放图片。大图片应为它预留足够的行高，小图标更适合插入按钮文字。 DialogMenu 在换行、居中、裁切前解析图片与翻译；图片按一个完整字形处理，不把标签原文当作文字宽度。CE 字宽从实际 PNG 的透明边界和字体高度测量，支持已注册的图集单元及图片引用。IA 使用 FontImageWrapper 的图片字符串与宽度 API。 图片缺失、插件未安装或 API 不兼容时显示 [image:图片ID] ，并报告原因。 /dmenu reload 会清除图片缓存，CE/IA 的数据重载事件也会刷新已打开菜单。更换图片资源后仍需通过来源插件构建、发送新资源包。 本测试版不解析任意物品为图片，也不支持 CE 图片标签的末尾 format 参数或独立 \u003cshift> 。原有 Sprite 和 Font/Glyph/Width/Rows/Advance 继续可用。 可用字段与兼容规则 支持 settings 的标题、导航名称、控件名/说明/选项，以及原生物品页面文字；canvas 的标题、正文和按钮文字也支持。图片标签写在文本字段，不能替代 Icon 、 Sprite 、 Display.Material 的原有配置格式。canvas 的 message: 动作也可使用标签；命令和权限字段保持原语义。 只有包含 \u003cimage:...> 、 \u003ci18n:...> 或 \u003cl10n:...> 的文本才启用这套解析。其他既有文本仍为普通文字，不会突然把 \u003cred> 或 &a 当作颜色。启用标签的文本支持 MiniMessage 颜色、文字装饰和 reset；不执行文本中的点击命令或悬浮事件。 测试示例见 独立多语言菜单 。将它复制到 plugins/DialogMenu/menus/text-tags.yml ，执行 /dmenu reload 、 /dmenu open text-tags 。默认示例只依赖随 JAR 提供的翻译，图片行需要替换成你已有的图片 ID。"}, {"id": "actions", "title": "动作参考", "file": "actions.md", "html": "\u003ch1 id=\"动作参考\">动作参考\u003c/h1>\n\u003cp>Actions 始终是有序的字符串列表，每组 1–16 条。settings 与 canvas 支持的动作以及 close 的位置不同。\u003c/p>\n\u003ch2 id=\"动作速查\">动作速查\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>动作\u003c/th>\n\u003cth>settings / 物品页\u003c/th>\n\u003cth>canvas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>command: 指令\u003c/code>\u003c/td>\n\u003ctd>玩家身份执行\u003c/td>\n\u003ctd>玩家身份执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>console: 指令\u003c/code>\u003c/td>\n\u003ctd>控制台身份执行\u003c/td>\n\u003ctd>控制台身份执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>page: 页ID\u003c/code>\u003c/td>\n\u003ctd>当前菜单内跳转，放最后\u003c/td>\n\u003ctd>当前菜单内跳转，放最后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>menu: 菜单ID\u003c/code>\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003ctd>跳到另一个 canvas 菜单默认页，放最后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>close\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>只能放第一项\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>只能放最后一项\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>refresh\u003c/code>\u003c/td>\n\u003ctd>刷新当前页，放最后\u003c/td>\n\u003ctd>刷新当前页，放最后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>search\u003c/code>\u003c/td>\n\u003ctd>打开页面搜索，放最后\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>message: 文本\u003c/code>\u003c/td>\n\u003ctd>不支持内置 message 动作\u003c/td>\n\u003ctd>给玩家发聊天消息\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>set: 变量=值\u003c/code>\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003ctd>设置已声明枚举变量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>template: 模板ID\u003c/code>\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003ctd>兼容动作；新版优先 page / menu\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>动作名使用小写。没有 TrMenu 的 tell、op、delay、js、kether、give-money 等内置动作；功能可由实际业务插件的命令提供。\u003c/p>\n\u003ch2 id=\"settings-的顺序\">settings 的顺序\u003c/h2>\n\u003cp>以下为控件内的动作片段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Actions:\n  - close\n  - &quot;command: spawn&quot;\n\u003c/code>\u003c/pre>\n\u003cp>先关闭当前界面，再执行玩家命令。spawn 需要服务器提供。\u003c/p>\n\u003cp>需要刷新或翻页时：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Actions:\n  - &quot;command: example save&quot;\n  - &quot;page: help&quot;\n\u003c/code>\u003c/pre>\n\u003cp>example save 是外部命令示意，help 必须是当前菜单实际存在的页。page、search、refresh 只能位于动作末尾。\u003c/p>\n\u003cp>仅有命令且没有 close 时，动作执行完会刷新菜单。跨到其他界面时通常先 close，避免旧界面自动刷新覆盖新界面。\u003c/p>\n\u003cp>打开另一个 DialogMenu：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Actions:\n  - close\n  - &quot;command: dmenu open demo-boss&quot;\n\u003c/code>\u003c/pre>\n\u003cp>这适用于 settings 控件；目标菜单需要存在，玩家仍需满足打开权限和资源包条件。\u003c/p>\n\u003ch2 id=\"canvas-的顺序\">canvas 的顺序\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">Actions:\n  - &quot;set: difficulty=hard&quot;\n  - &quot;message: 你选择了 {difficulty} 难度。&quot;\n  - &quot;page: confirm&quot;\n\u003c/code>\u003c/pre>\n\u003cp>difficulty 必须声明 hard 值，confirm 必须存在。动作逐条执行，因此消息读取的是刚设置的新值。\u003c/p>\n\u003cp>真正进入副本时的示意：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Permission: &quot;example.dungeon.enter&quot;\nActions:\n  - &quot;console: yourdungeon join {player} {difficulty}&quot;\n  - close\n\u003c/code>\u003c/pre>\n\u003cp>yourdungeon 是占位命令，必须替换成你的副本插件实际命令。文本中写“消耗钥匙”不会扣除物品，所需物品、次数、费用和发奖应由业务插件检查并处理。\u003c/p>\n\u003cp>没有 close、page、menu、template、refresh 时，canvas 在动作执行完后自动重绘当前页面。用命令打开其他 UI 时，后续重绘或 close 可能影响刚打开的界面；canvas 之间使用 page / menu 跳转。\u003c/p>\n\u003ch2 id=\"命令身份与占位符\">命令身份与占位符\u003c/h2>\n\u003cp>命令内容不写开头的 \u003ccode>/\u003c/code>，最长 512 字符，不允许控制字符或 \u003ccode>%\u003c/code>。一条列表项表示一次命令调用，不会把分号拆成多条命令。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>位置\u003c/th>\n\u003cth>可以替换\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>settings 的 command / console\u003c/td>\n\u003ctd>\u003ccode>{player}\u003c/code>、\u003ccode>{uuid}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas 的 command / console\u003c/td>\n\u003ctd>\u003ccode>{player}\u003c/code>、\u003ccode>{uuid}\u003c/code>、当前页声明的枚举变量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>两种命令动作\u003c/td>\n\u003ctd>都不展开 PlaceholderAPI\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>command 保留玩家自身权限，不临时提权；console 由控制台执行。Permission 检查点击玩家的权限，它不改变命令发送者。\u003c/p>\n\u003ch2 id=\"失败时发生什么\">失败时发生什么\u003c/h2>\n\u003cp>当 Bukkit / 外部命令执行接口返回失败时，停止后续动作；已执行的命令不会回滚。外部插件若仅发送失败提示却返回成功，DialogMenu 无法据此推断业务失败。\u003c/p>\n\u003cp>因此，扣钱 → 给物品这样的多步业务不能仅靠多个菜单命令保证原子性。应让业务插件提供一个完成校验与发放的入口。\u003c/p>\n\u003ch2 id=\"permission-与-requiresplugin\">Permission 与 RequiresPlugin\u003c/h2>\n\u003cp>settings 的 button、toggle、选择控件可以添加 Permission / RequiresPlugin；选择控件把限制带到每个选项动作。内置 Bind 还会保留其必要依赖。\u003c/p>\n\u003cp>canvas 的按钮支持 Permission，不支持 RequiresPlugin。无权限时按钮不会自动隐藏，点击时拒绝动作；隐藏由 VisibleWhen 控制，而 VisibleWhen 只读取枚举变量。\u003c/p>\n\u003ch2 id=\"兼容-template\">兼容 template\u003c/h2>\n\u003cp>在新版目录中内部页面 ID 为 \u003ccode>菜单ID/页面ID\u003c/code>。canvas 仍能使用例如 \u003ccode>template: demo-boss/confirm\u003c/code>，但新文件推荐 \u003ccode>page: confirm\u003c/code> 或 \u003ccode>menu: demo-boss\u003c/code>，这样同菜单复制改名更方便。\u003c/p>\n\u003cp>旧独立模板中的 \u003ccode>template: boss-confirm\u003c/code> 属于旧模板目录的 ID；不要原样移到 Version 3 后假定仍会在解析阶段映射。\u003c/p>", "text": "动作参考 Actions 始终是有序的字符串列表，每组 1–16 条。settings 与 canvas 支持的动作以及 close 的位置不同。 动作速查 动作 settings / 物品页 canvas command: 指令 玩家身份执行 玩家身份执行 console: 指令 控制台身份执行 控制台身份执行 page: 页ID 当前菜单内跳转，放最后 当前菜单内跳转，放最后 menu: 菜单ID 不支持 跳到另一个 canvas 菜单默认页，放最后 close 只能放第一项 只能放最后一项 refresh 刷新当前页，放最后 刷新当前页，放最后 search 打开页面搜索，放最后 不支持 message: 文本 不支持内置 message 动作 给玩家发聊天消息 set: 变量=值 不支持 设置已声明枚举变量 template: 模板ID 不支持 兼容动作；新版优先 page / menu 动作名使用小写。没有 TrMenu 的 tell、op、delay、js、kether、give-money 等内置动作；功能可由实际业务插件的命令提供。 settings 的顺序 以下为控件内的动作片段： Actions: - close - \"command: spawn\" 先关闭当前界面，再执行玩家命令。spawn 需要服务器提供。 需要刷新或翻页时： Actions: - \"command: example save\" - \"page: help\" example save 是外部命令示意，help 必须是当前菜单实际存在的页。page、search、refresh 只能位于动作末尾。 仅有命令且没有 close 时，动作执行完会刷新菜单。跨到其他界面时通常先 close，避免旧界面自动刷新覆盖新界面。 打开另一个 DialogMenu： Actions: - close - \"command: dmenu open demo-boss\" 这适用于 settings 控件；目标菜单需要存在，玩家仍需满足打开权限和资源包条件。 canvas 的顺序 Actions: - \"set: difficulty=hard\" - \"message: 你选择了 {difficulty} 难度。\" - \"page: confirm\" difficulty 必须声明 hard 值，confirm 必须存在。动作逐条执行，因此消息读取的是刚设置的新值。 真正进入副本时的示意： Permission: \"example.dungeon.enter\" Actions: - \"console: yourdungeon join {player} {difficulty}\" - close yourdungeon 是占位命令，必须替换成你的副本插件实际命令。文本中写“消耗钥匙”不会扣除物品，所需物品、次数、费用和发奖应由业务插件检查并处理。 没有 close、page、menu、template、refresh 时，canvas 在动作执行完后自动重绘当前页面。用命令打开其他 UI 时，后续重绘或 close 可能影响刚打开的界面；canvas 之间使用 page / menu 跳转。 命令身份与占位符 命令内容不写开头的 / ，最长 512 字符，不允许控制字符或 % 。一条列表项表示一次命令调用，不会把分号拆成多条命令。 位置 可以替换 settings 的 command / console {player} 、 {uuid} canvas 的 command / console {player} 、 {uuid} 、当前页声明的枚举变量 两种命令动作 都不展开 PlaceholderAPI command 保留玩家自身权限，不临时提权；console 由控制台执行。Permission 检查点击玩家的权限，它不改变命令发送者。 失败时发生什么 当 Bukkit / 外部命令执行接口返回失败时，停止后续动作；已执行的命令不会回滚。外部插件若仅发送失败提示却返回成功，DialogMenu 无法据此推断业务失败。 因此，扣钱 → 给物品这样的多步业务不能仅靠多个菜单命令保证原子性。应让业务插件提供一个完成校验与发放的入口。 Permission 与 RequiresPlugin settings 的 button、toggle、选择控件可以添加 Permission / RequiresPlugin；选择控件把限制带到每个选项动作。内置 Bind 还会保留其必要依赖。 canvas 的按钮支持 Permission，不支持 RequiresPlugin。无权限时按钮不会自动隐藏，点击时拒绝动作；隐藏由 VisibleWhen 控制，而 VisibleWhen 只读取枚举变量。 兼容 template 在新版目录中内部页面 ID 为 菜单ID/页面ID 。canvas 仍能使用例如 template: demo-boss/confirm ，但新文件推荐 page: confirm 或 menu: demo-boss ，这样同菜单复制改名更方便。 旧独立模板中的 template: boss-confirm 属于旧模板目录的 ID；不要原样移到 Version 3 后假定仍会在解析阶段映射。"}, {"id": "variables", "title": "变量、条件与占位符", "file": "variables.md", "html": "\u003ch1 id=\"变量条件与占位符\">变量、条件与占位符\u003c/h1>\n\u003ch2 id=\"支持范围速查\">支持范围速查\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>使用位置\u003c/th>\n\u003cth>内置值\u003c/th>\n\u003cth>自定义值\u003c/th>\n\u003cth>PAPI\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>settings 显示文本\u003c/td>\n\u003ctd>player、uuid、ping、world\u003c/td>\n\u003ctd>外部插件提供的 PAPI\u003c/td>\n\u003ctd>支持完整 \u003ccode>%变量%\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings State\u003c/td>\n\u003ctd>使用 Bind 或完整 PAPI token\u003c/td>\n\u003ctd>外部插件状态\u003c/td>\n\u003ctd>支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings 命令动作\u003c/td>\n\u003ctd>player、uuid\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas Text / message\u003c/td>\n\u003ctd>player、uuid\u003c/td>\n\u003ctd>Variables 中的枚举变量\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas 命令动作\u003c/td>\n\u003ctd>player、uuid\u003c/td>\n\u003ctd>Variables 中的枚举变量\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas VisibleWhen / SelectedWhen\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>声明的枚举变量等值比较\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Display.Material\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>静态物品 ID\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>以上内置值写作 \u003ccode>{player}\u003c/code> 等；PAPI 使用 \u003ccode>%example_value%\u003c/code>。\u003c/p>\n\u003cp>canvas 的 Title 直接作为普通外部标题使用，不做上述替换；需要动态可见标题时使用 text 元素。\u003c/p>\n\u003ch2 id=\"settings-文字中的变量\">settings 文字中的变量\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">玩家:\n  Type: text\n  Name: &quot;你好，{player}&quot;\n  Description:\n    - &quot;世界：{world}&quot;\n    - &quot;延迟：{ping} 毫秒&quot;\n\u003c/code>\u003c/pre>\n\u003cp>PAPI 必须安装 PlaceholderAPI，并由对应扩展 / 插件提供该变量。未解析、空值或原样返回 token 时显示未接入。解析后的传统颜色代码会去除，控制字符转换为空格。\u003c/p>\n\u003cp>State 必须是一枚完整 token，例如 \u003ccode>State: \"%example_mode%\"\u003c/code>；不能写成 \u003ccode>State: \"当前：%example_mode%\"\u003c/code>。\u003c/p>\n\u003ch2 id=\"canvas-variables\">canvas Variables\u003c/h2>\n\u003cp>菜单根部或页面中的变量段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Variables:\n  difficulty: [normal, hard, overload]\n  choice: [pending, accepted, declined]\n\u003c/code>\u003c/pre>\n\u003cp>每个变量是枚举：\u003c/p>\n\u003cul>\n\u003cli>变量名为小写英文字母开头的合法 ID，不能叫 player / uuid。\u003c/li>\n\u003cli>允许值为 1–48 位英文字母、数字、下划线、短横线，大小写保留。\u003c/li>\n\u003cli>每个变量 1–16 个不同值，第一项就是默认值。\u003c/li>\n\u003cli>不允许任意输入、数值运算、中文枚举值或未声明值。中文显示名称写在 Text。\u003c/li>\n\u003c/ul>\n\u003cp>若需要 on / off 作为枚举值，写成 \u003ccode>[\"on\", \"off\"]\u003c/code>，避免 YAML 布尔转换。\u003c/p>\n\u003ch2 id=\"条件显示与选中\">条件显示与选中\u003c/h2>\n\u003cp>以下为 Elements 内的片段，要求当前页已声明 difficulty：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">hard:\n  Type: button\n  Position: [144, 11]\n  Text: 困难\n  SelectedWhen: difficulty=hard\n  SelectedSprite: selected\n  Actions: [&quot;set: difficulty=hard&quot;, refresh]\nhard-description:\n  Type: text\n  Position: [282, 11]\n  Width: 222\n  Rows: 4\n  VisibleWhen: difficulty=hard\n  Text:\n    - 生命与攻击提高\n    - 适合熟悉机制的队伍\n\u003c/code>\u003c/pre>\n\u003cp>VisibleWhen 决定是否绘制与提供点击区域。SelectedWhen 决定是否改用 SelectedSprite；只写 SelectedWhen、不提供 SelectedSprite，不会自动生成高亮贴图。\u003c/p>\n\u003cp>条件语法只有 \u003ccode>变量=值\u003c/code>。不支持大于、小于、\u003ccode>&amp;&amp;\u003c/code>、\u003ccode>||\u003c/code>、权限表达式、JavaScript 或 PAPI 判断。\u003c/p>\n\u003ch2 id=\"变量能保留多久\">变量能保留多久\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>set 后刷新\u003c/td>\n\u003ctd>保留修改后的值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>page / menu / template 跳转\u003c/td>\n\u003ctd>目标页声明同名变量且接受该值时保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标页没声明该变量\u003c/td>\n\u003ctd>不带入该变量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标页声明同名变量，但不接受旧值\u003c/td>\n\u003ctd>取目标页枚举第一项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重新用命令打开\u003c/td>\n\u003ctd>从默认值开始\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭后重新打开 / 重连\u003c/td>\n\u003ctd>不恢复临时变量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重载仍存在的 canvas 页\u003c/td>\n\u003ctd>保留仍合法的变量值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>多页都需要的变量，建议放到菜单根部，不在子页重写 Variables；这样不用重复声明，也能避免整段覆盖造成变量丢失。\u003c/p>\n\u003cp>这些不是数据库字段，不能用来记录永久任务进度、购买次数或余额。永久业务状态由对应插件保存。\u003c/p>\n\u003ch2 id=\"玩家语言和主题是另一种状态\">玩家语言和主题是另一种状态\u003c/h2>\n\u003cp>settings 的 language / theme 绑定保存在玩家 PDC，键保留为 \u003ccode>playersettings:menu_language\u003c/code> 与 \u003ccode>playersettings:menu_theme\u003c/code>。它们是跨菜单共享的玩家偏好，不会改变 Minecraft 本身或其他插件的语言。\u003c/p>\n\u003cp>修改根 Language / Theme 只改变缺少有效偏好的玩家的默认值；已有玩家可通过对应下拉框重新选择。\u003c/p>", "text": "变量、条件与占位符 支持范围速查 使用位置 内置值 自定义值 PAPI settings 显示文本 player、uuid、ping、world 外部插件提供的 PAPI 支持完整 %变量% settings State 使用 Bind 或完整 PAPI token 外部插件状态 支持 settings 命令动作 player、uuid 不支持 不支持 canvas Text / message player、uuid Variables 中的枚举变量 不支持 canvas 命令动作 player、uuid Variables 中的枚举变量 不支持 canvas VisibleWhen / SelectedWhen 无 声明的枚举变量等值比较 不支持 Display.Material 无 静态物品 ID 不支持 以上内置值写作 {player} 等；PAPI 使用 %example_value% 。 canvas 的 Title 直接作为普通外部标题使用，不做上述替换；需要动态可见标题时使用 text 元素。 settings 文字中的变量 玩家: Type: text Name: \"你好，{player}\" Description: - \"世界：{world}\" - \"延迟：{ping} 毫秒\" PAPI 必须安装 PlaceholderAPI，并由对应扩展 / 插件提供该变量。未解析、空值或原样返回 token 时显示未接入。解析后的传统颜色代码会去除，控制字符转换为空格。 State 必须是一枚完整 token，例如 State: \"%example_mode%\" ；不能写成 State: \"当前：%example_mode%\" 。 canvas Variables 菜单根部或页面中的变量段： Variables: difficulty: [normal, hard, overload] choice: [pending, accepted, declined] 每个变量是枚举
