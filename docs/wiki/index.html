： 变量名为小写英文字母开头的合法 ID，不能叫 player / uuid。 允许值为 1–48 位英文字母、数字、下划线、短横线，大小写保留。 每个变量 1–16 个不同值，第一项就是默认值。 不允许任意输入、数值运算、中文枚举值或未声明值。中文显示名称写在 Text。 若需要 on / off 作为枚举值，写成 [\"on\", \"off\"] ，避免 YAML 布尔转换。 条件显示与选中 以下为 Elements 内的片段，要求当前页已声明 difficulty： hard: Type: button Position: [144, 11] Text: 困难 SelectedWhen: difficulty=hard SelectedSprite: selected Actions: [\"set: difficulty=hard\", refresh] hard-description: Type: text Position: [282, 11] Width: 222 Rows: 4 VisibleWhen: difficulty=hard Text: - 生命与攻击提高 - 适合熟悉机制的队伍 VisibleWhen 决定是否绘制与提供点击区域。SelectedWhen 决定是否改用 SelectedSprite；只写 SelectedWhen、不提供 SelectedSprite，不会自动生成高亮贴图。 条件语法只有 变量=值 。不支持大于、小于、 && 、 || 、权限表达式、JavaScript 或 PAPI 判断。 变量能保留多久 操作 行为 set 后刷新 保留修改后的值 page / menu / template 跳转 目标页声明同名变量且接受该值时保留 目标页没声明该变量 不带入该变量 目标页声明同名变量，但不接受旧值 取目标页枚举第一项 重新用命令打开 从默认值开始 关闭后重新打开 / 重连 不恢复临时变量 重载仍存在的 canvas 页 保留仍合法的变量值 多页都需要的变量，建议放到菜单根部，不在子页重写 Variables；这样不用重复声明，也能避免整段覆盖造成变量丢失。 这些不是数据库字段，不能用来记录永久任务进度、购买次数或余额。永久业务状态由对应插件保存。 玩家语言和主题是另一种状态 settings 的 language / theme 绑定保存在玩家 PDC，键保留为 playersettings:menu_language 与 playersettings:menu_theme 。它们是跨菜单共享的玩家偏好，不会改变 Minecraft 本身或其他插件的语言。 修改根 Language / Theme 只改变缺少有效偏好的玩家的默认值；已有玩家可通过对应下拉框重新选择。"}, {"id": "icons", "title": "图标与材质：更换图片与非 CE 用法", "file": "icons.md", "html": "\u003ch1 id=\"图标与材质更换图片与非-ce-用法\">图标与材质：更换图片与非 CE 用法\u003c/h1>\n\u003cp>DialogMenu 不强制依赖 CraftEngine。先看要改的是哪个字段：物品模型、字体贴图和资源包发送方式分别配置，不能互相替代。\u003c/p>\n\u003cp>\u003ccode>0.1.22\u003c/code> 可在文本中使用 \u003ccode>&lt;image:CE:namespace:id&gt;\u003c/code>、\u003ccode>&lt;image:IA:namespace:id&gt;\u003c/code>，详见 \u003ca href=\"#text-tags\">图片标签与独立多语言\u003c/a>。以下原有字段继续兼容。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>所在位置\u003c/th>\n\u003cth>显示内容\u003c/th>\n\u003cth>更换方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>settings 的 \u003ccode>Pages.&lt;页&gt;.Icon\u003c/code>\u003c/td>\n\u003ctd>左侧分类的内置字体图标\u003c/td>\n\u003ctd>换内置名称，或替换资源包中对应 PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings 的 \u003ccode>Pages.&lt;页&gt;.Icons\u003c/code>\u003c/td>\n\u003ctd>本页控件集合\u003c/td>\n\u003ctd>复数 Icons 是容器，本身不是材质字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>settings 的 \u003ccode>Icons.&lt;控件&gt;.Display.Material\u003c/code>\u003c/td>\n\u003ctd>真实物品及其模型\u003c/td>\n\u003ctd>原版材质或 \u003ccode>source:插件ID:物品ID\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>quest-demo 的 \u003ccode>Tasks.&lt;任务&gt;.Icon\u003c/code>、\u003ccode>Rewards[].Icon\u003c/code>\u003c/td>\n\u003ctd>任务 / 奖励字体图标\u003c/td>\n\u003ctd>内置名称或 \u003ccode>Font/Glyph/Width/Advance\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>canvas 的 \u003ccode>Elements.&lt;元素&gt;\u003c/code>，\u003ccode>Type: sprite\u003c/code>\u003c/td>\n\u003ctd>装饰贴图\u003c/td>\n\u003ctd>内置 \u003ccode>Sprite\u003c/code>，或自定义 \u003ccode>Font/Glyph/Width/Rows/Advance\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"原版与其他插件的物品材质\">原版与其他插件的物品材质\u003c/h2>\n\u003cp>下面是已有 settings 菜单 \u003ccode>Pages.preview\u003c/code> 的\u003cstrong>子页片段\u003c/strong>。它不是独立菜单文件；添加后按需设置页名和导航。\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Title: 物品预览\nRenderer: items\nLayout: [武器]\nIcons:\n  武器:\n    Type: item\n    Display:\n      Material: &quot;source:IA:my_pack:sword&quot;\n      Name: 武器展示\n      Fallback: BARRIER\n\u003c/code>\u003c/pre>\n\u003cp>只需按实际来源替换 Material：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>来源\u003c/th>\n\u003cth>Material 示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原版\u003c/td>\n\u003ctd>\u003ccode>DIAMOND\u003c/code> 或 \u003ccode>minecraft:diamond\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CraftEngine\u003c/td>\n\u003ctd>\u003ccode>source:CE:my_pack:sword\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ItemsAdder\u003c/td>\n\u003ctd>\u003ccode>source:IA:my_pack:sword\u003c/code> 或 \u003ccode>source:ItemsAdder:my_pack:sword\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nexo\u003c/td>\n\u003ctd>\u003ccode>source:Nexo:my_sword\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oraxen\u003c/td>\n\u003ctd>\u003ccode>source:Oraxen:my_sword\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NeigeItems\u003c/td>\n\u003ctd>\u003ccode>source:NI:物品ID\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>自定义物品 ID 是示例，须在对应插件中存在；IA / CE 使用完整的小写 \u003ccode>namespace:id\u003c/code>。只安装实际使用的来源插件，ItemBridge 已内置，无需另外安装。自定义模型仍需来源插件的资源包。\u003c/p>\n\u003cp>\u003ccode>Fallback: BARRIER\u003c/code> 在来源不可用时显示屏障；如果该控件是带动作的 button，还会停用动作。没有 Fallback 时，来源不可用会使检查 / 重载失败。原生物品图标本身不绑定点击动作，button 使用旁边文字或下方同名按钮操作。\u003c/p>\n\u003cp>Display.Material 会让\u003cstrong>整页\u003c/strong>使用原生 Dialog 物品布局，不保留字体画布皮肤与自由坐标，不能与 toggle / slider / dropdown 同页混用。需要画布装饰时使用下面的字体图标。完整规则见 \u003ca href=\"#items\">物品页面与物品源\u003c/a>。\u003c/p>\n\u003ch2 id=\"任务菜单的-icon\">任务菜单的 Icon\u003c/h2>\n\u003cp>编辑 \u003ccode>menus/demo-quests.yml\u003c/code> 中的 \u003ccode>Tasks.&lt;任务&gt;.Icon\u003c/code> 或 \u003ccode>Rewards\u003c/code> 每项的 Icon。内置可用名称是：\u003c/p>\n\u003cp>\u003ccode>iron_sword\u003c/code>、\u003ccode>fishing_rod\u003c/code>、\u003ccode>nether_star\u003c/code>、\u003ccode>book\u003c/code>、\u003ccode>iron_ingot\u003c/code>、\u003ccode>gold_ingot\u003c/code>、\u003ccode>experience_bottle\u003c/code>、\u003ccode>amethyst_shard\u003c/code>、\u003ccode>cod\u003c/code>、\u003ccode>diamond_chestplate\u003c/code>、\u003ccode>bread\u003c/code>、\u003ccode>oak_sapling\u003c/code>、\u003ccode>compass\u003c/code>。\u003c/p>\n\u003cp>例如，把已有任务的 \u003ccode>Icon: iron_sword\u003c/code> 改成 \u003ccode>Icon: compass\u003c/code>。这些名称映射到 \u003ccode>dialogmenu_dialogue:quest_items\u003c/code> 字体中的既定字形，不接受任意原版材质名，也不接受 \u003ccode>source:IA:...\u003c/code> 等物品源写法。\u003c/p>\n\u003cp>自定义 Icon 可替换为以下配置段；奖励图标也使用同样格式：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Icon:\n  Font: &quot;my_pack:icons&quot;\n  Glyph: &quot;\\uE001&quot;\n  Width: 12\n  Advance: 13\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>Font\u003c/code> 是资源包字体 ID，\u003ccode>Glyph\u003c/code> 是该字体中的单个 BMP 字符，Unicode 转义须写在 YAML 双引号内。\u003ccode>Width\u003c/code> 是横向占位，支持 1–18；\u003ccode>Advance\u003c/code> 必填，使用字形实际绘制后的前进量。这两个字段不会缩放图片；示例中的 12 / 13 必须按实际图片和字体指标调整。建议显示高度 12、ascent 4，并让图形落在 18 像素高的任务条目内。\u003c/p>\n\u003ch2 id=\"不依赖-ce-的自定义-png-字体\">不依赖 CE 的自定义 PNG 字体\u003c/h2>\n\u003cp>可以用已有资源包中的字体，也可以自行定义 Minecraft bitmap 字体。例如，在\u003cstrong>资源包根目录\u003c/strong>准备：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">assets/my_pack/textures/gui/menu_icon.png\nassets/my_pack/font/icons.json\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>menu_icon.png\u003c/code> 由你提供。以下是 icons.json 的完整内容，示例按单个方形图标设置：\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;providers&quot;: [\n    {\n      &quot;type&quot;: &quot;bitmap&quot;,\n      &quot;file&quot;: &quot;my_pack:gui/menu_icon.png&quot;,\n      &quot;height&quot;: 12,\n      &quot;ascent&quot;: 4,\n      &quot;chars&quot;: [&quot;\\uE001&quot;]\n    }\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>图片路径相对命名空间下的 textures；\u003ccode>my_pack:icons\u003c/code> 对应 font/icons.json。字体 JSON 的 height 控制显示高度，ascent 控制基线位置。透明留白、图片比例和显示高度会影响实际可见宽度与 Advance，不能只照抄上面的数字。更新字体和 PNG 后，需要重新构建并发送资源包。\u003c/p>\n\u003cp>已有 IA / Nexo / Oraxen 资源包也可以使用这套原生字体文件，合入其实际资源包源目录并保留 assets 结构；具体合并入口取决于对应插件。物品注册 ID 与字体 ID 是两套名称，DialogMenu 不会自动把物品模型转换成字体贴图。\u003c/p>\n\u003cp>canvas 中用同一个字体时，将 Font / Glyph 写进 \u003ccode>Type: sprite\u003c/code> 元素，并配置 Position、Width、Rows、Advance。其示例和范围见 \u003ca href=\"#elements\">画布元素\u003c/a>。\u003c/p>\n\u003ch2 id=\"设置菜单左侧的-icon\">设置菜单左侧的 Icon\u003c/h2>\n\u003cp>settings 的 \u003ccode>Pages.&lt;页&gt;.Icon\u003c/code> 只接受内置名称，不接受 Material 或 Font/Glyph 配置段。常用名称与当前资源包贴图对应如下：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Icon\u003c/th>\n\u003cth>\u003ccode>assets/dialogmenu_settings/textures/ui/\u003c/code> 下的文件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>profile-icon\u003c/td>\n\u003ctd>hallow_icon_0.png\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sound-icon\u003c/td>\n\u003ctd>hallow_icon_1.png\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>particles-icon\u003c/td>\n\u003ctd>hallow_icon_2.png\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>notices-icon\u003c/td>\n\u003ctd>hallow_icon_3.png\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>loot-icon\u003c/td>\n\u003ctd>hallow_icon_4.png\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>appearance-icon\u003c/td>\n\u003ctd>hallow_icon_5.png\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>换成已有图标只需改 Icon 名称。换全新图片时，修改合并资源包源目录中的对应 PNG，保留原尺寸和字形指标；字体映射在 \u003ccode>assets/dialogmenu_settings/font/ui.json\u003c/code>。同名图标被其他页面引用时也会一起变化。仅增加 PNG 或编造一个新的 Icon 名称不会自动注册导航图标。\u003c/p>\n\u003ch2 id=\"完全不用-ce-时发送资源包\">完全不用 CE 时发送资源包\u003c/h2>\n\u003cp>把 DialogMenu 配套资源和需要的自定义图标 / 模型合入客户端会加载的资源包。全局 config.yml 的 ResourcePack 使用以下任一方式：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Provider: URL\u003c/code>：填写真实资源包 ZIP 直链，玩家通过 \u003ccode>/dmenu pack\u003c/code> 接收。\u003c/li>\n\u003cli>\u003ccode>Provider: External\u003c/code>：由 IA / Nexo / Oraxen 等插件或 server.properties 发送，填写\u003cstrong>发送方实际使用的 UUID\u003c/strong>，而不是随意生成一个 UUID。\u003c/li>\n\u003c/ul>\n\u003cp>完整可复制的 ResourcePack 配置见 \u003ca href=\"#resource-pack\">资源包\u003c/a>。Provider 只决定检查 / 发送哪个包，不会自动合并文件、生成字体或改写字体 ID；\u003ccode>RequireLoaded: false\u003c/code> 只关闭加载门槛，不会补齐缺失图片。\u003c/p>\n\u003cp>菜单改完先 \u003ccode>/dmenu check\u003c/code>，通过后 \u003ccode>/dmenu reload\u003c/code>。只有菜单文字或已有图标名称变化时不需要重新打包；新增或替换 PNG、字体、模型时需要更新资源包并让玩家重新加载。\u003c/p>", "text": "图标与材质：更换图片与非 CE 用法 DialogMenu 不强制依赖 CraftEngine。先看要改的是哪个字段：物品模型、字体贴图和资源包发送方式分别配置，不能互相替代。 0.1.22 可在文本中使用 \u003cimage:CE:namespace:id> 、 \u003cimage:IA:namespace:id> ，详见 图片标签与独立多语言 。以下原有字段继续兼容。 所在位置 显示内容 更换方法 settings 的 Pages.\u003c页>.Icon 左侧分类的内置字体图标 换内置名称，或替换资源包中对应 PNG settings 的 Pages.\u003c页>.Icons 本页控件集合 复数 Icons 是容器，本身不是材质字段 settings 的 Icons.\u003c控件>.Display.Material 真实物品及其模型 原版材质或 source:插件ID:物品ID quest-demo 的 Tasks.\u003c任务>.Icon 、 Rewards[].Icon 任务 / 奖励字体图标 内置名称或 Font/Glyph/Width/Advance canvas 的 Elements.\u003c元素> ， Type: sprite 装饰贴图 内置 Sprite ，或自定义 Font/Glyph/Width/Rows/Advance 原版与其他插件的物品材质 下面是已有 settings 菜单 Pages.preview 的 子页片段 。它不是独立菜单文件；添加后按需设置页名和导航。 Title: 物品预览 Renderer: items Layout: [武器] Icons: 武器: Type: item Display: Material: \"source:IA:my_pack:sword\" Name: 武器展示 Fallback: BARRIER 只需按实际来源替换 Material： 来源 Material 示例 原版 DIAMOND 或 minecraft:diamond CraftEngine source:CE:my_pack:sword ItemsAdder source:IA:my_pack:sword 或 source:ItemsAdder:my_pack:sword Nexo source:Nexo:my_sword Oraxen source:Oraxen:my_sword NeigeItems source:NI:物品ID 自定义物品 ID 是示例，须在对应插件中存在；IA / CE 使用完整的小写 namespace:id 。只安装实际使用的来源插件，ItemBridge 已内置，无需另外安装。自定义模型仍需来源插件的资源包。 Fallback: BARRIER 在来源不可用时显示屏障；如果该控件是带动作的 button，还会停用动作。没有 Fallback 时，来源不可用会使检查 / 重载失败。原生物品图标本身不绑定点击动作，button 使用旁边文字或下方同名按钮操作。 Display.Material 会让 整页 使用原生 Dialog 物品布局，不保留字体画布皮肤与自由坐标，不能与 toggle / slider / dropdown 同页混用。需要画布装饰时使用下面的字体图标。完整规则见 物品页面与物品源 。 任务菜单的 Icon 编辑 menus/demo-quests.yml 中的 Tasks.\u003c任务>.Icon 或 Rewards 每项的 Icon。内置可用名称是： iron_sword 、 fishing_rod 、 nether_star 、 book 、 iron_ingot 、 gold_ingot 、 experience_bottle 、 amethyst_shard 、 cod 、 diamond_chestplate 、 bread 、 oak_sapling 、 compass 。 例如，把已有任务的 Icon: iron_sword 改成 Icon: compass 。这些名称映射到 dialogmenu_dialogue:quest_items 字体中的既定字形，不接受任意原版材质名，也不接受 source:IA:... 等物品源写法。 自定义 Icon 可替换为以下配置段；奖励图标也使用同样格式： Icon: Font: \"my_pack:icons\" Glyph: \"\\uE001\" Width: 12 Advance: 13 Font 是资源包字体 ID， Glyph 是该字体中的单个 BMP 字符，Unicode 转义须写在 YAML 双引号内。 Width 是横向占位，支持 1–18； Advance 必填，使用字形实际绘制后的前进量。这两个字段不会缩放图片；示例中的 12 / 13 必须按实际图片和字体指标调整。建议显示高度 12、ascent 4，并让图形落在 18 像素高的任务条目内。 不依赖 CE 的自定义 PNG 字体 可以用已有资源包中的字体，也可以自行定义 Minecraft bitmap 字体。例如，在 资源包根目录 准备： assets/my_pack/textures/gui/menu_icon.png assets/my_pack/font/icons.json menu_icon.png 由你提供。以下是 icons.json 的完整内容，示例按单个方形图标设置： { \"providers\": [ { \"type\": \"bitmap\", \"file\": \"my_pack:gui/menu_icon.png\", \"height\": 12, \"ascent\": 4, \"chars\": [\"\\uE001\"] } ] } 图片路径相对命名空间下的 textures； my_pack:icons 对应 font/icons.json。字体 JSON 的 height 控制显示高度，ascent 控制基线位置。透明留白、图片比例和显示高度会影响实际可见宽度与 Advance，不能只照抄上面的数字。更新字体和 PNG 后，需要重新构建并发送资源包。 已有 IA / Nexo / Oraxen 资源包也可以使用这套原生字体文件，合入其实际资源包源目录并保留 assets 结构；具体合并入口取决于对应插件。物品注册 ID 与字体 ID 是两套名称，DialogMenu 不会自动把物品模型转换成字体贴图。 canvas 中用同一个字体时，将 Font / Glyph 写进 Type: sprite 元素，并配置 Position、Width、Rows、Advance。其示例和范围见 画布元素 。 设置菜单左侧的 Icon settings 的 Pages.\u003c页>.Icon 只接受内置名称，不接受 Material 或 Font/Glyph 配置段。常用名称与当前资源包贴图对应如下： Icon assets/dialogmenu_settings/textures/ui/ 下的文件 profile-icon hallow_icon_0.png sound-icon hallow_icon_1.png particles-icon hallow_icon_2.png notices-icon hallow_icon_3.png loot-icon hallow_icon_4.png appearance-icon hallow_icon_5.png 换成已有图标只需改 Icon 名称。换全新图片时，修改合并资源包源目录中的对应 PNG，保留原尺寸和字形指标；字体映射在 assets/dialogmenu_settings/font/ui.json 。同名图标被其他页面引用时也会一起变化。仅增加 PNG 或编造一个新的 Icon 名称不会自动注册导航图标。 完全不用 CE 时发送资源包 把 DialogMenu 配套资源和需要的自定义图标 / 模型合入客户端会加载的资源包。全局 config.yml 的 ResourcePack 使用以下任一方式： Provider: URL ：填写真实资源包 ZIP 直链，玩家通过 /dmenu pack 接收。 Provider: External ：由 IA / Nexo / Oraxen 等插件或 server.properties 发送，填写 发送方实际使用的 UUID ，而不是随意生成一个 UUID。 完整可复制的 ResourcePack 配置见 资源包 。Provider 只决定检查 / 发送哪个包，不会自动合并文件、生成字体或改写字体 ID； RequireLoaded: false 只关闭加载门槛，不会补齐缺失图片。 菜单改完先 /dmenu check ，通过后 /dmenu reload 。只有菜单文字或已有图标名称变化时不需要重新打包；新增或替换 PNG、字体、模型时需要更新资源包并让玩家重新加载。"}, {"id": "items", "title": "物品页面与物品源", "file": "items.md", "html": "\u003ch1 id=\"物品页面与物品源\">物品页面与物品源\u003c/h1>\n\u003cp>真实物品展示放在 \u003ccode>Type: settings\u003c/code> 菜单的子页中。该页的 Layout 中存在 Display.Material 或 Type: item，就自动使用原生 Dialog 物品布局；也可显式写 Renderer: items。\u003c/p>\n\u003cp>这里显示的是实际 ItemStack 的副本，保留原物品模型和悬停提示。它不自动发放或扣除玩家物品。\u003c/p>\n\u003cp>不强制使用 CE。导航 Icon、任务 Icon、画布 sprite 与这里的 Display.Material 不是同一种字段；更换方法与非 CE 示例见 \u003ca href=\"#icons\">图标与材质\u003c/a>。\u003c/p>\n\u003ch2 id=\"页面片段\">页面片段\u003c/h2>\n\u003cp>以下放到 \u003ccode>Pages.preview\u003c/code>，不是独立菜单文件：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Title: 物品预览\nRenderer: items\nLayout: [钻石, 自定义武器, 关闭]\nIcons:\n  钻石:\n    Type: item\n    Display:\n      Material: minecraft:diamond\n      Amount: 3\n      Name: 原版钻石\n      Lore: [这里只展示，不会发放]\n  自定义武器:\n    Type: button\n    Display:\n      Material: &quot;source:CE:my_pack:sword&quot;\n      Fallback: BARRIER\n      Name: 自定义武器\n    Actions: [close]\n  关闭:\n    Actions: [close]\n\u003c/code>\u003c/pre>\n\u003cp>my_pack:sword 是示意物品，需要在 CraftEngine 中存在。未安装或找不到时显示屏障，且该自定义武器按钮停用。\u003c/p>\n\u003ch2 id=\"display-字段\">Display 字段\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>类型 / 默认\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Material\u003c/td>\n\u003ctd>字符串\u003c/td>\n\u003ctd>原版材质或 source:插件ID:物品ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Name\u003c/td>\n\u003ctd>文本 / 双语映射\u003c/td>\n\u003ctd>与控件外层 Name 二选一\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lore\u003c/td>\n\u003ctd>文本或列表\u003c/td>\n\u003ctd>与外层 Description 二选一，最多 6 行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amount\u003c/td>\n\u003ctd>整数，默认 1\u003c/td>\n\u003ctd>1–99；只改展示副本数量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fallback\u003c/td>\n\u003ctd>可选字符串\u003c/td>\n\u003ctd>必须是有效的原版物品\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>没有任何 Name 时使用控件名。Amount / Fallback 必须与 Material 配合。\u003c/p>\n\u003cp>Display.Name / Lore 是菜单里的配套文字，不会改写源物品自己的名称、Lore、模型或其他数据。物品原有提示仍可在悬停时查看。\u003c/p>\n\u003ch2 id=\"页面控件类型\">页面控件类型\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Type\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>Actions / Permission / RequiresPlugin\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>button（默认）\u003c/td>\n\u003ctd>可点击按钮，可带物品\u003c/td>\n\u003ctd>支持，Actions 必填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>item\u003c/td>\n\u003ctd>只展示物品，必须有 Material\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>text\u003c/td>\n\u003ctd>说明文字\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>heading\u003c/td>\n\u003ctd>标题文字\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>原生物品图标本身不绑定点击动作；点击配套名称 / 说明或下方同名按钮操作。原生页面使用 Minecraft 按钮与布局，保留焦点提示，不使用字体画布皮肤、玩家主题或自由坐标。\u003c/p>\n\u003cp>不要同页混用 toggle / slider / dropdown。需要设置控件时另建普通 settings 子页，用 page 动作连接。\u003c/p>\n\u003ch2 id=\"material-语法\">Material 语法\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">DIAMOND\nminecraft:diamond\nsource:VANILLA:diamond\nsource:CE:my_pack:sword\nsource:ItemsAdder:my_pack:sword\nsource:IA:my_pack:sword\nsource:Nexo:my_sword\nsource:Oraxen:my_sword\nsource:NI:物品ID\nsource:MythicMobs:SkeletonKingSword\nsource:MMOItems:SWORD:my_sword\nsource:HeadDatabase:123\n\u003c/code>\u003c/pre>\n\u003cp>插件 ID 不区分大小写。后面的物品 ID 原样传给适配器；CraftEngine 和 ItemsAdder 要求小写 namespace:id。其他来源的组合 ID 要按对应适配器和插件实际定义填写。\u003c/p>\n\u003cp>Material 不展开 PAPI，不支持 TrMenu 的 JSON、动画、JS 或头颅表达式。空气不能作为展示物品。\u003c/p>\n\u003ch2 id=\"支持的来源\">支持的来源\u003c/h2>\n\u003cp>内置 ItemBridge 1.0.32 的 39 个插件适配器；无需另装 ItemBridge，只安装实际使用的来源插件。“支持 39 种”不表示服务器安装了全部 39 种。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>插件\u003c/th>\n\u003cth>插件 ID\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>AdvancedItems\u003c/td>\n\u003ctd>advanceditems\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AzureFlow\u003c/td>\n\u003ctd>azureflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Baikiruto\u003c/td>\n\u003ctd>baikiruto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BreweryX\u003c/td>\n\u003ctd>breweryx\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CraftEngine\u003c/td>\n\u003ctd>craftengine\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CrazyVouchers\u003c/td>\n\u003ctd>crazyvouchers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CustomCrafting\u003c/td>\n\u003ctd>customcrafting\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CustomFishing\u003c/td>\n\u003ctd>customfishing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DragonArmourers\u003c/td>\n\u003ctd>dragonarmourers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EcoArmor\u003c/td>\n\u003ctd>ecoarmor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EcoCrates\u003c/td>\n\u003ctd>ecocrates\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EcoItems\u003c/td>\n\u003ctd>ecoitems\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EcoMobs\u003c/td>\n\u003ctd>ecomobs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EcoPets\u003c/td>\n\u003ctd>ecopets\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EcoScrolls\u003c/td>\n\u003ctd>ecoscrolls\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EmakiItem\u003c/td>\n\u003ctd>emakiitem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ExecutableBlocks\u003c/td>\n\u003ctd>executableblocks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ExecutableItems\u003c/td>\n\u003ctd>executableitems\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HeadDatabase\u003c/td>\n\u003ctd>headdatabase\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HMCCosmetics\u003c/td>\n\u003ctd>hmccosmetics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ItemEdit\u003c/td>\n\u003ctd>itemedit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ItemsAdder\u003c/td>\n\u003ctd>itemsadder\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ItemsXL\u003c/td>\n\u003ctd>itemsxl\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MagicGem\u003c/td>\n\u003ctd>magicgem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MMOItems\u003c/td>\n\u003ctd>mmoitems\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MythicMobs\u003c/td>\n\u003ctd>mythicmobs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NeigeItems\u003c/td>\n\u003ctd>neigeitems\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nexo\u003c/td>\n\u003ctd>nexo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nova\u003c/td>\n\u003ctd>nova\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oraxen\u003c/td>\n\u003ctd>oraxen\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PxRpg\u003c/td>\n\u003ctd>pxrpg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ratziel\u003c/td>\n\u003ctd>ratziel\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reforges\u003c/td>\n\u003ctd>reforges\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sertraline\u003c/td>\n\u003ctd>sertraline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Slimefun\u003c/td>\n\u003ctd>slimefun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>StatTrackers\u003c/td>\n\u003ctd>stattrackers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SX-Item\u003c/td>\n\u003ctd>sxitem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Talismans\u003c/td>\n\u003ctd>talismans\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Zaphkiel\u003c/td>\n\u003ctd>zaphkiel\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>常用别名：CE → CraftEngine，IA → ItemsAdder，NI → NeigeItems，SI / SX-Item → SX-Item，MM → MythicMobs，MI → MMOItems，HDB → HeadDatabase，CF → CustomFishing，EI → ExecutableItems，EB → ExecutableBlocks。\u003c/p>\n\u003ch2 id=\"来源失效时\">来源失效时\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>check / reload 时来源不可用，未设 Fallback\u003c/td>\n\u003ctd>校验失败，保留旧菜单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来源不可用，设了有效 Fallback\u003c/td>\n\u003ctd>警告，显示回退物品，动作停用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行中构建失败 / 插件停用\u003c/td>\n\u003ctd>不执行该物品按钮动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fallback 本身无效\u003c/td>\n\u003ctd>校验失败\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Fallback 只解决显示，不把失效物品当成成功商品。点击时也会重新检查来源，不能靠已经打开的界面绕过失效检查。\u003c/p>\n\u003cp>CraftEngine 重载后会刷新菜单；其他来源修改后可执行 /dmenu reload。每次展示和点击会重新查找物品，构建时传入查看菜单的玩家。\u003c/p>\n\u003cp>自定义模型仍需对应物品插件的资源包。DialogMenu 资源包只提供菜单资产，不包含服务器所有自定义物品。\u003c/p>", "text": "物品页面与物品源 真实物品展示放在 Type: settings 菜单的子页中。该页的 Layout 中存在 Display.Material 或 Type: item，就自动使用原生 Dialog 物品布局；也可显式写 Renderer: items。 这里显示的是实际 ItemStack 的副本，保留原物品模型和悬停提示。它不自动发放或扣除玩家物品。 不强制使用 CE。导航 Icon、任务 Icon、画布 sprite 与这里的 Display.Material 不是同一种字段；更换方法与非 CE 示例见 图标与材质 。 页面片段 以下放到 Pages.preview ，不是独立菜单文件： Title: 物品预览 Renderer: items Layout: [钻石, 自定义武器, 关闭] Icons: 钻石: Type: item Display: Material: minecraft:diamond Amount: 3 Name: 原版钻石 Lore: [这里只展示，不会发放] 自定义武器: Type: button Display: Material: \"source:CE:my_pack:sword\" Fallback: BARRIER Name: 自定义武器 Actions: [close] 关闭: Actions: [close] my_pack:sword 是示意物品，需要在 CraftEngine 中存在。未安装或找不到时显示屏障，且该自定义武器按钮停用。 Display 字段 字段 类型 / 默认 规则 Material 字符串 原版材质或 source:插件ID:物品ID Name 文本 / 双语映射 与控件外层 Name 二选一 Lore 文本或列表 与外层 Description 二选一，最多 6 行 Amount 整数，默认 1 1–99；只改展示副本数量 Fallback 可选字符串 必须是有效的原版物品 没有任何 Name 时使用控件名。Amount / Fallback 必须与 Material 配合。 Display.Name / Lore 是菜单里的配套文字，不会改写源物品自己的名称、Lore、模型或其他数据。物品原有提示仍可在悬停时查看。 页面控件类型 Type 用途 Actions / Permission / RequiresPlugin button（默认） 可点击按钮，可带物品 支持，Actions 必填 item 只展示物品，必须有 Material 不支持 text 说明文字 不支持 heading 标题文字 不支持 原生物品图标本身不绑定点击动作；点击配套名称 / 说明或下方同名按钮操作。原生页面使用 Minecraft 按钮与布局，保留焦点提示，不使用字体画布皮肤、玩家主题或自由坐标。 不要同页混用 toggle / slider / dropdown。需要设置控件时另建普通 settings 子页，用 page 动作连接。 Material 语法 DIAMOND minecraft:diamond source:VANILLA:diamond source:CE:my_pack:sword source:ItemsAdder:my_pack:sword source:IA:my_pack:sword source:Nexo:my_sword source:Oraxen:my_sword source:NI:物品ID source:MythicMobs:SkeletonKingSword source:MMOItems:SWORD:my_sword source:HeadDatabase:123 插件 ID 不区分大小写。后面的物品 ID 原样传给适配器；CraftEngine 和 ItemsAdder 要求小写 namespace:id。其他来源的组合 ID 要按对应适配器和插件实际定义填写。 Material 不展开 PAPI，不支持 TrMenu 的 JSON、动画、JS 或头颅表达式。空气不能作为展示物品。 支持的来源 内置 ItemBridge 1.0.32 的 39 个插件适配器；无需另装 ItemBridge，只安装实际使用的来源插件。“支持 39 种”不表示服务器安装了全部 39 种。 插件 插件 ID AdvancedItems advanceditems AzureFlow azureflow Baikiruto baikiruto BreweryX breweryx CraftEngine craftengine CrazyVouchers crazyvouchers CustomCrafting customcrafting CustomFishing customfishing DragonArmourers dragonarmourers EcoArmor ecoarmor EcoCrates ecocrates EcoItems ecoitems EcoMobs ecomobs EcoPets ecopets EcoScrolls ecoscrolls EmakiItem emakiitem ExecutableBlocks executableblocks ExecutableItems executableitems HeadDatabase headdatabase HMCCosmetics hmccosmetics ItemEdit itemedit ItemsAdder itemsadder ItemsXL itemsxl MagicGem magicgem MMOItems mmoitems MythicMobs mythicmobs NeigeItems neigeitems Nexo nexo Nova nova Oraxen oraxen PxRpg pxrpg Ratziel ratziel Reforges reforges Sertraline sertraline Slimefun slimefun StatTrackers stattrackers SX-Item sxitem Talismans talismans Zaphkiel zaphkiel 常用别名：CE → CraftEngine，IA → ItemsAdder，NI → NeigeItems，SI / SX-Item → SX-Item，MM → MythicMobs，MI → MMOItems，HDB → HeadDatabase，CF → CustomFishing，EI → ExecutableItems，EB → ExecutableBlocks。 来源失效时 情况 结果 check / reload 时来源不可用，未设 Fallback 校验失败，保留旧菜单 来源不可用，设了有效 Fallback 警告，显示回退物品，动作停用 运行中构建失败 / 插件停用 不执行该物品按钮动作 Fallback 本身无效 校验失败 Fallback 只解决显示，不把失效物品当成成功商品。点击时也会重新检查来源，不能靠已经打开的界面绕过失效检查。 CraftEngine 重载后会刷新菜单；其他来源修改后可执行 /dmenu reload。每次展示和点击会重新查找物品，构建时传入查看菜单的玩家。 自定义模型仍需对应物品插件的资源包。DialogMenu 资源包只提供菜单资产，不包含服务器所有自定义物品。"}, {"id": "resource-pack", "title": "资源包", "file": "resource-pack.md", "html": "\u003ch1 id=\"资源包\">资源包\u003c/h1>\n\u003cp>DialogMenu 的字体画布需要配套资源包。ResourcePack 配置决定资源安装、加载检查与发送方式，不会自动把其他图片转换成菜单字体，也不会自动替换字体 ID。\u003c/p>\n\u003cp>CraftEngine 不是必需依赖。使用 IA / Nexo / Oraxen 等来源的物品，和由哪个插件发送资源包，是两项独立设置；物品源写在 Display.Material，字体图标写 Font/Glyph，发送方式写这里的 Provider。换图标及自定义 PNG 的完整步骤见 \u003ca href=\"#icons\">图标与材质\u003c/a>。\u003c/p>\n\u003ch2 id=\"0121-起自动安装内置资源\">0.1.21 起：自动安装内置资源\u003c/h2>\n\u003cp>0.1.21 起，JAR 包含配套资源包，启动后导出为 \u003ccode>plugins/DialogMenu/resourcepack/DialogMenu-resourcepack.zip\u003c/code>。发布版 0.1.20 及更早版本仍需单独下载同版本 ZIP。\u003c/p>\n\u003cp>新安装的默认配置：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">ResourcePack:\n  Name: &quot;DialogMenu 菜单资源&quot;\n  Provider: Auto\n  AutoInstall: true\n  Pack: default\n  RequireLoaded: false\n  URL: &quot;&quot;\n  UUID: &quot;&quot;\n  SHA1: &quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>Auto 按以下顺序选择已启用的插件，只向选中的一方安装。CraftEngine 始终优先：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>提供方\u003c/th>\n\u003cth>自动安装到的资源源目录\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CraftEngine\u003c/td>\n\u003ctd>\u003ccode>plugins/CraftEngine/resources/dialogmenu/resourcepack/\u003c/code>，同时创建所属内容包的 \u003ccode>pack.yml\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ItemsAdder\u003c/td>\n\u003ctd>\u003ccode>plugins/ItemsAdder/contents/dialogmenu/resourcepack/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nexo\u003c/td>\n\u003ctd>\u003ccode>plugins/Nexo/pack/external_packs/dialogmenu/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oraxen\u003c/td>\n\u003ctd>\u003ccode>plugins/Oraxen/pack/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>这是源文件安装；\u003cstrong>仍须按照控制台提示构建、托管和发送资源包\u003c/strong>。DialogMenu 不会自动执行其他插件的全服重载。没有提供方时只导出 ZIP，供手动启用或 URL / External 发送。\u003c/p>\n\u003cp>文件首次安装后按哈希记录所有权。升级只更新未被修改的托管文件；已有不同内容或服主改过的文件会保留并报告冲突。相同内容的已有文件不会报冲突，也不会被接管。资源包内的共享 GUI 着色器需要与 BetterHud 或其他整合包协调，不能直接覆盖。控制台提示冲突时，应先完成合并再重新生成资源包。\u003c/p>\n\u003cp>CraftEngine 的 \u003ccode>resource-pack.exclude-core-shaders\u003c/code> 和 Oraxen 的 \u003ccode>Pack.import.remove_core_shaders_from_imported_packs\u003c/code> 若为 true，会过滤配套 GUI 着色器。DialogMenu 会提示，但不擅自修改提供方配置；需要服主决定合并方式。\u003c/p>\n\u003cp>Auto 的 \u003ccode>RequireLoaded: false\u003c/code> 允许手动启用客户端资源包，不再等待本服专用的 CraftEngine 加载回执；这并不表示资源已经加载。开启严格检查时，CraftEngine 使用真实托管 UUID，其他发送方需要填写其实际 UUID。已有服务器的配置不会被新默认配置覆盖；URL / External 省略 AutoInstall 时不会向其他插件安装资源。\u003ccode>AutoInstall: false\u003c/code> 可禁止写入提供方的源目录，ZIP 仍会导出，Auto 仍可检测 CE 发送来源并进行严格检查。\u003c/p>\n\u003ch2 id=\"目录链接与自动安装警告\">目录链接与自动安装警告\u003c/h2>\n\u003cp>0.1.21 的自动安装会拒绝指向插件目录外的资源目录链接。若控制台大量出现“资源路径包含链接或重定向”，且都指向 \u003ccode>plugins/CraftEngine/resources\u003c/code>，说明安装器拦住了这个目录；这不代表贴图文件损坏。可用 PowerShell 检查实际属性和目标：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-Item -LiteralPath '.\\plugins\\CraftEngine\\resources' -Force | Format-List FullName,Attributes,LinkType,Target\n\u003c/code>\u003c/pre>\n\u003cp>临时处理：在 DialogMenu 的 \u003ccode>config.yml\u003c/code> 中设置 \u003ccode>ResourcePack.AutoInstall: false\u003c/code>，执行 \u003ccode>/dmenu reload\u003c/code>；将已导出的 \u003ccode>plugins/DialogMenu/resourcepack/DialogMenu-resourcepack.zip\u003c/code> 手动合入一个启用的 CE 内容包的 \u003ccode>resourcepack\u003c/code> 目录，保留原有文件并处理着色器冲突，然后按服务器现有流程重建并发送资源包。不要仅删除或替换 \u003ccode>resources\u003c/code> 链接，否则可能影响其他内容包。\u003c/p>\n\u003cp>\u003ccode>0.1.22\u003c/code> 已支持上表中的资源输入根使用目录联接或软链接：CE 的 \u003ccode>resources\u003c/code>、IA 的 \u003ccode>contents\u003c/code>、Nexo 的 \u003ccode>pack/external_packs\u003c/code>、Oraxen 的 \u003ccode>pack\u003c/code>。安装时先固定其真实路径；输入根下的 \u003ccode>dialogmenu\u003c/code>、字体、贴图等内部路径仍禁止链接重定向。输入根换到其他位置后，旧位置的托管清单不会用来接管新位置的文件；已有不同内容会保留并提示冲突。\u003c/p>\n\u003ch2 id=\"手动指定-craftengine\">手动指定 CraftEngine\u003c/h2>\n\u003cp>以下是全局 config.yml 的完整结构：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 3\nDefaultMenu: settings\nResourcePack:\n  Name: &quot;DialogMenu 菜单资源（CraftEngine 合并包）&quot;\n  Provider: CraftEngine\n  Pack: default\n  RequireLoaded: true\n  URL: &quot;&quot;\n  UUID: &quot;&quot;\n  SHA1: &quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>Pack: default 对应 CraftEngine 配置 \u003ccode>resource-pack.packs\u003c/code> 的包 ID，不是源文件目录名。自动安装的内容包在 \u003ccode>plugins/CraftEngine/resources/dialogmenu/resourcepack/\u003c/code>；也可关闭自动安装并自行合入其他内容包。\u003c/p>\n\u003cp>DialogMenu 从 CraftEngine 托管信息读取实际 UUID，资源的合并与发送仍由 CraftEngine 完成。首次安装内容包后先执行 \u003ccode>/ce reload all\u003c/code>，再按服务器现有流程执行 \u003ccode>/ce workflow default\u003c/code>，并让玩家成功加载。\u003c/p>\n\u003ch2 id=\"resourcepack-全字段\">ResourcePack 全字段\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>默认\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Name\u003c/td>\n\u003ctd>DialogMenu 菜单资源\u003c/td>\n\u003ctd>给玩家看的非空名称\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Provider\u003c/td>\n\u003ctd>新装配置为 Auto\u003c/td>\n\u003ctd>Auto / CraftEngine / URL / External，大小写不敏感；旧配置省略字段仍按 CraftEngine 解析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AutoInstall\u003c/td>\n\u003ctd>Auto / CraftEngine 为 true，其余 false\u003c/td>\n\u003ctd>是否向检测到的提供方安装内置资源；不控制 ZIP 导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pack\u003c/td>\n\u003ctd>default\u003c/td>\n\u003ctd>CraftEngine 包 ID；1–64 位字母、数字、短横线、下划线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RequireLoaded\u003c/td>\n\u003ctd>新装配置为 false\u003c/td>\n\u003ctd>是否需要指定资源包成功加载；旧配置省略字段仍为 true\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>URL\u003c/td>\n\u003ctd>空字符串\u003c/td>\n\u003ctd>URL 模式必填 http / https ZIP 直链\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UUID\u003c/td>\n\u003ctd>空字符串\u003c/td>\n\u003ctd>URL 可省略；External 必填发送方的真实包 UUID；Auto 可填真实 UUID，优先于 CE 自动查询\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SHA1\u003c/td>\n\u003ctd>空字符串\u003c/td>\n\u003ctd>可留空，否则必须是 40 位十六进制 SHA-1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>整段 ResourcePack 省略时，为兼容旧配置使用旧加载检查；建议显式指定来源，避免把其他包的加载成功误认为菜单包已经加载。\u003c/p>\n\u003ch2 id=\"urldialogmenu-发送直链包\">URL：DialogMenu 发送直链包\u003c/h2>\n\u003cp>替换全局配置中的 ResourcePack 段：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">ResourcePack:\n  Name: 我的菜单资源\n  Provider: URL\n  URL: &quot;https://example.com/dialogmenu.zip&quot;\n  UUID: &quot;&quot;\n  SHA1: &quot;&quot;\n  RequireLoaded: true\n\u003c/code>\u003c/pre>\n\u003cp>example.com 是示意地址，必须改成真实可下载的资源包 ZIP。UUID 留空时按 URL 生成，也可指定固定 UUID。\u003c/p>\n\u003cp>玩家执行 \u003ccode>/dmenu pack\u003c/code> 发送下载请求。采用追加方式，不移除其他包，不因为拒绝加载而踢人。\u003c/p>\n\u003cp>同一 URL 的文件内容变更后，更新 SHA1，再 check / reload，让玩家重新执行 pack。同 UUID 的 URL 或 SHA1 发生变更时，之前记录的加载成功状态会失效。\u003c/p>\n\u003ch2 id=\"external其他插件发送\">External：其他插件发送\u003c/h2>\n\u003cp>适用于已经由 ItemsAdder、Nexo、Oraxen 等插件或 server.properties 发送资源包的服务器。先将 DialogMenu 配套资源合入该发送方实际使用的资源包，保留 assets 目录结构，再填写发送时实际使用的 UUID；DialogMenu 不会自动执行资源合并。\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">ResourcePack:\n  Name: 外部合并资源包\n  Provider: External\n  UUID: &quot;12345678-1234-1234-1234-123456789abc&quot;\n  RequireLoaded: true\n\u003c/code>\u003c/pre>\n\u003cp>这里 UUID 是格式示例，必须替换成其他插件或 server.properties 发送时实际使用的 UUID。不要根据 ZIP 文件名或 pack.mcmeta 的 description 猜测 UUID。\u003c/p>\n\u003cp>External 模式中 pack 命令只显示来源提示，由外部系统负责发送。\u003c/p>\n\u003ch2 id=\"什么算加载成功\">什么算加载成功\u003c/h2>\n\u003cp>RequireLoaded: true 时，需要指定 UUID 的成功加载响应，加载其他包不算。CraftEngine 包组要求所有成员成功。\u003c/p>\n\u003cp>客户端本地手动启用的包不会给服务器发送对应 UUID 的加载响应；服务器也不能逐张检查玩家是否实际渲染了图片。\u003c/p>\n\u003cp>RequireLoaded: false 可以关闭这个门槛，但不会自动补齐缺失的字体或模型。仅在已经自行保证客户端资源到位时使用。\u003c/p>\n\u003cp>资源包设置发生修改会关闭已打开菜单。未变且已加载的包可再次打开；更换到未加载的包时需让玩家通过来源插件重新接收，或重进服务器。\u003c/p>\n\u003ch2 id=\"资源内容\">资源内容\u003c/h2>\n\u003cp>字体画布需要对应资产：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>dialogmenu_settings\u003c/code>：设置界面皮肤、标签和按钮字体。\u003c/li>\n\u003cli>\u003ccode>dialogmenu_dialogue\u003c/code>：对话画布、任务图标和文字字体。\u003c/li>\n\u003cli>配套 \u003ccode>assets/minecraft/shaders/core/gui.vsh\u003c/code> 与 \u003ccode>gui.fsh\u003c/code>：已有焦点 / 边框处理。\u003c/li>\n\u003c/ul>\n\u003cp>已有 GUI 着色器的整合包需要合并兼容，不能把其中一方直接覆盖。物品模型则由物品来源插件自己的资源包提供。\u003c/p>\n\u003cp>0.1.21 已将旧 toraka_settings / toraka_dialogue 命名空间改为 dialogmenu_settings / dialogmenu_dialogue；升级时同步匹配版本的资源包，并修改自定义菜单中的旧字体引用。不要直接使用旧版资源包搭配新字体 ID。仅修改菜单文字、顺序和动作通常无需重新生成资源包；新增字体立绘或替换贴图需要更新资源。\u003c/p>\n\u003cp>本机 UI_Sprite 素材版与可分发基础皮肤的许可边界见源码仓库 \u003ccode>docs/guides/TEMPLATE-ASSETS.md\u003c/code>。发布资源包前沿用已有许可说明。\u003c/p>", "text": "资源包 DialogMenu 的字体画布需要配套资源包。ResourcePack 配置决定资源安装、加载检查与发送方式，不会自动把其他图片转换成菜单字体，也不会自动替换字体 ID。 CraftEngine 不是必需依赖。使用 IA / Nexo / Oraxen 等来源的物品，和由哪个插件发送资源包，是两项独立设置；物品源写在 Display.Material，字体图标写 Font/Glyph，发送方式写这里的 Provider。换图标及自定义 PNG 的完整步骤见 图标与材质 。 0.1.21 起：自动安装内置资源 0.1.21 起，JAR 包含配套资源包，启动后导出为 plugins/DialogMenu/resourcepack/DialogMenu-resourcepack.zip 。发布版 0.1.20 及更早版本仍需单独下载同版本 ZIP。 新安装的默认配置： ResourcePack: Name: \"DialogMenu 菜单资源\" Provider: Auto AutoInstall: true Pack: default RequireLoaded: false URL: \"\" UUID: \"\" SHA1: \"\" Auto 按以下顺序选择已启用的插件，只向选中的一方安装。CraftEngine 始终优先： 提供方 自动安装到的资源源目录 CraftEngine plugins/CraftEngine/resources/dialogmenu/resourcepack/ ，同时创建所属内容包的 pack.yml ItemsAdder plugins/ItemsAdder/contents/dialogmenu/resourcepack/ Nexo plugins/Nexo/pack/external_packs/dialogmenu/ Oraxen plugins/Oraxen/pack/ 这是源文件安装； 仍须按照控制台提示构建、托管和发送资源包 。DialogMenu 不会自动执行其他插件的全服重载。没有提供方时只导出 ZIP，供手动启用或 URL / External 发送。 文件首次安装后按哈希记录所有权。升级只更新未被修改的托管文件；已有不同内容或服主改过的文件会保留并报告冲突。相同内容的已有文件不会报冲突，也不会被接管。资源包内的共享 GUI 着色器需要与 BetterHud 或其他整合包协调，不能直接覆盖。控制台提示冲突时，应先完成合并再重新生成资源包。 CraftEngine 的 resource-pack.exclude-core-shaders 和 Oraxen 的 Pack.import.remove_core_shaders_from_imported_packs 若为 true，会过滤配套 GUI 着色器。DialogMenu 会提示，但不擅自修改提供方配置；需要服主决定合并方式。 Auto 的 RequireLoaded: false 允许手动启用客户端资源包，不再等待本服专用的 CraftEngine 加载回执；这并不表示资源已经加载。开启严格检查时，CraftEngine 使用真实托管 UUID，其他发送方需要填写其实际 UUID。已有服务器的配置不会被新默认配置覆盖；URL / External 省略 AutoInstall 时不会向其他插件安装资源。 AutoInstall: false 可禁止写入提供方的源目录，ZIP 仍会导出，Auto 仍可检测 CE 发送来源并进行严格检查。 目录链接与自动安装警告 0.1.21 的自动安装会拒绝指向插件目录外的资源目录链接。若控制台大量出现“资源路径包含链接或重定向”，且都指向 plugins/CraftEngine/resources ，说明安装器拦住了这个目录；这不代表贴图文件损坏。可用 PowerShell 检查实际属性和目标： Get-Item -LiteralPath '.\\plugins\\CraftEngine\\resources' -Force | Format-List FullName,Attributes,LinkType,Target 临时处理：在 DialogMenu 的 config.yml 中设置 ResourcePack.AutoInstall: false ，执行 /dmenu reload ；将已导出的 plugins/DialogMenu/resourcepack/DialogMenu-resourcepack.zip 手动合入一个启用的 CE 内容包的 resourcepack 目录，保留原有文件并处理着色器冲突，然后按服务器现有流程重建并发送资源包。不要仅删除或替换 resources 链接，否则可能影响其他内容包。 0.1.22 已支持上表中的资源输入根使用目录联接或软链接：CE 的 resources 、IA 的 contents 、Nexo 的 pack/external_packs 、Oraxen 的 pack 。安装时先固定其真实路径；输入根下的 dialogmenu 、字体、贴图等内部路径仍禁止链接重定向。输入根换到其他位置后，旧位置的托管清单不会用来接管新位置的文件；已有不同内容会保留并提示冲突。 手动指定 CraftEngine 以下是全局 config.yml 的完整结构： Version: 3 DefaultMenu: settings ResourcePack: Name: \"DialogMenu 菜单资源（CraftEngine 合并包）\" Provider: CraftEngine Pack: default RequireLoaded: true URL: \"\" UUID: \"\" SHA1: \"\" Pack: default 对应 CraftEngine 配置 resource-pack.packs 的包 ID，不是源文件目录名。自动安装的内容包在 plugins/CraftEngine/resources/dialogmenu/resourcepack/ ；也可关闭自动安装并自行合入其他内容包。 DialogMenu 从 CraftEngine 托管信息读取实际 UUID，资源的合并与发送仍由 CraftEngine 完成。首次安装内容包后先执行 /ce reload all ，再按服务器现有流程执行 /ce workflow default ，并让玩家成功加载。 ResourcePack 全字段 字段 默认 规则 Name DialogMenu 菜单资源 给玩家看的非空名称 Provider 新装配置为 Auto Auto / CraftEngine / URL / External，大小写不敏感；旧配置省略字段仍按 CraftEngine 解析 AutoInstall Auto / CraftEngine 为 true，其余 false 是否向检测到的提供方安装内置资源；不控制 ZIP 导出 Pack default CraftEngine 包 ID；1–64 位字母、数字、短横线、下划线 RequireLoaded 新装配置为 false 是否需要指定资源包成功加载；旧配置省略字段仍为 true URL 空字符串 URL 模式必填 http / https ZIP 直链 UUID 空字符串 URL 可省略；External 必填发送方的真实包 UUID；Auto 可填真实 UUID，优先于 CE 自动查询 SHA1 空字符串 可留空，否则必须是 40 位十六进制 SHA-1 整段 ResourcePack 省略时，为兼容旧配置使用旧加载检查；建议显式指定来源，避免把其他包的加载成功误认为菜单包已经加载。 URL：DialogMenu 发送直链包 替换全局配置中的 ResourcePack 段： ResourcePack: Name: 我的菜单资源 Provider: URL URL: \"https://example.com/dialogmenu.zip\" UUID: \"\" SHA1: \"\" RequireLoaded: true example.com 是示意地址，必须改成真实可下载的资源包 ZIP。UUID 留空时按 URL 生成，也可指定固定 UUID。 玩家执行 /dmenu pack 发送下载请求。采用追加方式，不移除其他包，不因为拒绝加载而踢人。 同一 URL 的文件内容变更后，更新 SHA1，再 check / reload，让玩家重新执行 pack。同 UUID 的 URL 或 SHA1 发生变更时，之前记录的加载成功状态会失效。 External：其他插件发送 适用于已经由 ItemsAdder、Nexo、Oraxen 等插件或 server.properties 发送资源包的服务器。先将 DialogMenu 配套资源合入该发送方实际使用的资源包，保留 assets 目录结构，再填写发送时实际使用的 UUID；DialogMenu 不会自动执行资源合并。 ResourcePack: Name: 外部合并资源包 Provider: External UUID: \"12345678-1234-1234-1234-123456789abc\" RequireLoaded: true 这里 UUID 是格式示例，必须替换成其他插件或 server.properties 发送时实际使用的 UUID。不要根据 ZIP 文件名或 pack.mcmeta 的 description 猜测 UUID。 External 模式中 pack 命令只显示来源提示，由外部系统负责发送。 什么算加载成功 RequireLoaded: true 时，需要指定 UUID 的成功加载响应，加载其他包不算。CraftEngine 包组要求所有成员成功。 客户端本地手动启用的包不会给服务器发送对应 UUID 的加载响应；服务器也不能逐张检查玩家是否实际渲染了图片。 RequireLoaded: false 可以关闭这个门槛，但不会自动补齐缺失的字体或模型。仅在已经自行保证客户端资源到位时使用。 资源包设置发生修改会关闭已打开菜单。未变且已加载的包可再次打开；更换到未加载的包时需让玩家通过来源插件重新接收，或重进服务器。 资源内容 字体画布需要对应资产： dialogmenu_settings ：设置界面皮肤、标签和按钮字体。 dialogmenu_dialogue ：对话画布、任务图标和文字字体。 配套 assets/minecraft/shaders/core/gui.vsh 与 gui.fsh ：已有焦点 / 边框处理。 已有 GUI 着色器的整合包需要合并兼容，不能把其中一方直接覆盖。物品模型则由物品来源插件自己的资源包提供。 0.1.21 已将旧 toraka_settings / toraka_dialogue 命名空间改为 dialogmenu_settings / dialogmenu_dialogue；升级时同步匹配版本的资源包，并修改自定义菜单中的旧字体引用。不要直接使用旧版资源包搭配新字体 ID。仅修改菜单文字、顺序和动作通常无需重新生成资源包；新增字体立绘或替换贴图需要更新资源。 本机 UI_Sprite 素材版与可分发基础皮肤的许可边界见源码仓库 docs/guides/TEMPLATE-ASSETS.md 。发布资源包前沿用已有许可说明。"}, {"id": "examples", "title": "完整示例库", "file": "examples.md", "html": "\u003ch1 id=\"完整示例库\">完整示例库\u003c/h1>\n\u003cp>本章每个代码块都是完整菜单，可保存到对应文件。无需在全局配置中注册，随后依次执行 \u003ccode>/dmenu check\u003c/code>、\u003ccode>/dmenu reload\u003c/code>，再用给出的 open 命令打开。\u003c/p>\n\u003cp>离线网页的代码块支持复制；\u003ca href=\"examples/README.md\">示例目录说明\u003c/a> 列出了随 Wiki 附带的 YAML 文件。只复制你要使用的菜单，不必覆盖现有文件。\u003c/p>\n\u003ch2 id=\"偏好设置preferencesyml\">偏好设置：preferences.yml\u003c/h2>\n\u003cp>保存到 \u003ccode>menus/preferences.yml\u003c/code>，打开 \u003ccode>/dmenu open preferences\u003c/code>。只使用内置语言 / 主题偏好，不依赖其他业务插件。\u003c/p>\n\u003c!-- example: preferences.yml -->\n\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 1\nType: settings\nTitle: 我的偏好\nDefaultPage: appearance\nLanguage: zh_cn\nTheme: dark\nMainMenu: [close]\nPages:\n  appearance:\n    Title: 界面与语言\n    Icon: appearance-icon\n    Keywords: [语言, 主题, appearance]\n    Layout: [语言, 主题, 关闭]\n    Icons:\n      语言:\n        Type: dropdown\n        Name: {zh_cn: 菜单语言, en_us: Menu language}\n        Bind: language\n        Options:\n          zh_cn: 简体中文\n          en_us: English\n      主题:\n        Type: dropdown\n        Name: {zh_cn: 界面主题, en_us: Menu theme}\n        Bind: theme\n        Options:\n          dark: {zh_cn: 暗色, en_us: Dark}\n          light: {zh_cn: 亮色, en_us: Light}\n      关闭:\n        Name: {zh_cn: 关闭, en_us: Close}\n        Actions: [close]\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"两页-npc-对话guideyml\">两页 NPC 对话：guide.yml\u003c/h2>\n\u003cp>保存到 \u003ccode>menus/guide.yml\u003c/code>，打开 \u003ccode>/dmenu open guide\u003c/code>。message 只发送演示文本，不会创建任务。\u003c/p>\n\u003c!-- example: guide.yml -->\n\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 1\nType: canvas\nDefaultPage: main\nSkin: parchment\nCanvas:\n  Width: 552\n  Rows: 20\n  Background: panel\n  HideFocusOutline: true\nPages:\n  main:\n    Title: 守门人的委托\n    Elements:\n      portrait:\n        Type: sprite\n        Position: [24, 3]\n        Sprite: emblem\n      name:\n        Position: [156, 3]\n        Width: 330\n        Text: 守门人 · 艾琳\n        Color: &quot;#f0d8b9&quot;\n      dialogue:\n        Position: [156, 7]\n        Width: 348\n        Rows: 5\n        Text:\n          - &quot;你好，{player}。&quot;\n          - 古堡里的灯又亮了。你愿意听听那里的故事吗？\n      continue:\n        Type: button\n        Position: [156, 16]\n        Sprite: wide-button\n        Text: 继续\n        Actions: [&quot;page: story&quot;]\n      leave:\n        Type: button\n        Position: [312, 16]\n        Sprite: wide-button\n        Text: 稍后再来\n        Actions: [close]\n      close:\n        Type: button\n        Position: [516, 2]\n        Sprite: close\n        Text: &quot;×&quot;\n        Actions: [close]\n  story:\n    Title: 古堡的故事\n    Elements:\n      title:\n        Position: [30, 3]\n        Width: 480\n        Text: 消失的巡夜人\n        Color: &quot;#f0d8b9&quot;\n      story:\n        Position: [30, 6]\n        Width: 480\n        Rows: 7\n        Text:\n          - 很久以前，巡夜人每晚都会点亮高塔。\n          - 如果你在古堡遇到他，请替我问一句好。\n      accept:\n        Type: button\n        Position: [156, 16]\n        Sprite: wide-button\n        Text: 我记住了\n        Actions: [&quot;message: 艾琳：祝你旅途平安。&quot;, close]\n      back:\n        Type: button\n        Position: [312, 16]\n        Sprite: wide-button\n        Text: 返回\n        Actions: [&quot;page: main&quot;]\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"难度选择与确认trialyml\">难度选择与确认：trial.yml\u003c/h2>\n\u003cp>保存到 \u003ccode>menus/trial.yml\u003c/code>，打开 \u003ccode>/dmenu open trial\u003c/code>。变量放在根部，两个页面共同使用；确认只发消息。\u003c/p>\n\u003c!-- example: trial.yml -->\n\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 1\nType: canvas\nDefaultPage: choose\nSkin: amethyst\nVariables:\n  difficulty: [normal, hard]\nPages:\n  choose:\n    Title: 选择试炼\n    Elements:\n      title:\n        Position: [30, 3]\n        Width: 480\n        Text: 请选择难度\n      normal:\n        Type: button\n        Position: [30, 7]\n        Text: 普通\n        SelectedWhen: difficulty=normal\n        SelectedSprite: selected\n        Actions: [&quot;set: difficulty=normal&quot;, refresh]\n      hard:\n        Type: button\n        Position: [150, 7]\n        Text: 困难\n        SelectedWhen: difficulty=hard\n        SelectedSprite: selected\n        Actions: [&quot;set: difficulty=hard&quot;, refresh]\n      normal-info:\n        Position: [30, 11]\n        Width: 480\n        Rows: 3\n        VisibleWhen: difficulty=normal\n        Text: 普通模式，适合初次挑战。\n      hard-info:\n        Position: [30, 11]\n        Width: 480\n        Rows: 3\n        VisibleWhen: difficulty=hard\n        Text: 困难模式，需要熟悉机制。\n      next:\n        Type: button\n        Position: [210, 16]\n        Sprite: wide-button\n        Text: 下一步\n        Actions: [&quot;page: confirm&quot;]\n  confirm:\n    Title: 确认试炼\n    Elements:\n      summary:\n        Position: [30, 4]\n        Width: 480\n        Rows: 4\n        Text:\n          - &quot;玩家：{player}&quot;\n          - &quot;选择的难度：{difficulty}&quot;\n          - 这是演示，不消耗物品，也不召唤首领。\n      confirm:\n        Type: button\n        Position: [156, 16]\n        Text: 确认\n        Actions: [&quot;message: 你选择了 {difficulty} 难度。&quot;, close]\n      back:\n        Type: button\n        Position: [282, 16]\n        Text: 返回选择\n        Actions: [&quot;page: choose&quot;]\n\u003c/code>\u003c/pre>\n\u003cp>按钮中间的临时变量不会成为永久存档。接入真实副本时，把确认动作改为业务插件实际命令，并让它检查准入和消耗。\u003c/p>\n\u003ch2 id=\"原生物品展示item-previewyml\">原生物品展示：item-preview.yml\u003c/h2>\n\u003cp>保存到 \u003ccode>menus/item-preview.yml\u003c/code>，打开 \u003ccode>/dmenu open item-preview\u003c/code>。不依赖自定义物品插件，也不发放物品。\u003c/p>\n\u003c!-- example: item-preview.yml -->\n\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 1\nType: settings\nTitle: 物品预览\nDefaultPage: main\nMainMenu: [close]\nPages:\n  main:\n    Title: 展示柜\n    Renderer: items\n    Layout: [说明, 钻石, 返回]\n    Icons:\n      说明:\n        Type: text\n        Name: 将鼠标移到物品上查看原版提示。\n      钻石:\n        Type: item\n        Display:\n          Material: minecraft:diamond\n          Amount: 3\n          Name: 钻石展示\n          Lore:\n            - 这里只展示物品副本。\n            - 不会把钻石放入背包。\n      返回:\n        Name: 关闭预览\n        Actions: [close]\n\u003c/code>\u003c/pre>\n\u003cp>要显示 CE 物品，把 Material 改为真实的 \u003ccode>source:CE:namespace:id\u003c/code>，并视需要加 \u003ccode>Fallback: BARRIER\u003c/code>。完整规则见 \u003ca href=\"#items\">物品页面\u003c/a>。\u003c/p>\n\u003ch2 id=\"现有三个菜单如何修改\">现有三个菜单如何修改\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>常见改动位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>demo-settings.yml\u003c/td>\n\u003ctd>\u003ccode>Pages.&lt;页&gt;.Layout\u003c/code> 改排列；\u003ccode>Icons.&lt;控件&gt;.Name / Description\u003c/code> 改文案；settings-demo 内 Bind 使用独立演示状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>demo-dialogue.yml\u003c/td>\n\u003ctd>\u003ccode>Pages.main.Elements.dialogue.Text\u003c/code> 改正文；portrait 改立绘；continue 改后续跳转\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>demo-boss.yml\u003c/td>\n\u003ctd>\u003ccode>Pages.intro\u003c/code> 改背景与建议；\u003ccode>Pages.confirm\u003c/code> 改难度说明与确认动作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>demo-boss 现有 Variables 在各页中分别声明；要扩展难度时保证各页变量允许值一致，或移到根部统一继承。不同条件说明的 VisibleWhen 与按钮 set 值也要同步。\u003c/p>", "text": "完整示例库 本章每个代码块都是完整菜单，可保存到对应文件。无需在全局配置中注册，随后依次执行 /dmenu check 、 /dmenu reload ，再用给出的 open 命令打开。 离线网页的代码块支持复制； 示例目录说明 列出了随 Wiki 附带的 YAML 文件。只复制你要使用的菜单，不必覆盖现有文件。 偏好设置：preferences.yml 保存到 menus/preferences.yml ，打开 /dmenu open preferences 。只使用内置语言 / 主题偏好，不依赖其他业务插件。 Version: 1 Type: settings Title: 我的偏好 DefaultPage: appearance Language: zh_cn Theme: dark MainMenu: [close] Pages: appearance: Title: 界面与语言 Icon: appearance-icon Keywords: [语言, 主题, appearance] Layout: [语言, 主题, 关闭] Icons: 语言: Type: dropdown Name: {zh_cn: 菜单语言, en_us: Menu language} Bind: language Options: zh_cn: 简体中文 en_us: English 主题: Type: dropdown Name: {zh_cn: 界面主题, en_us: Menu theme} Bind: theme Options: dark: {zh_cn: 暗色, en_us: Dark} light: {zh_cn: 亮色, en_us: Light} 关闭: Name: {zh_cn: 关闭, en_us: Close} Actions: [close] 两页 NPC 对话：guide.yml 保存到 menus/guide.yml ，打开 /dmenu open guide 。message 只发送演示文本，不会创建任务。 Version: 1 Type: canvas DefaultPage: main Skin: parchment Canvas: Width: 552 Rows: 20 Background: panel HideFocusOutline: true Pages: main: Title: 守门人的委托 Elements: portrait: Type: sprite Position: [24, 3] Sprite: emblem name: Position: [156, 3] Width: 330 Text: 守门人 · 艾琳 Color: \"#f0d8b9\" dialogue: Position: [156, 7] Width: 348 Rows: 5 Text: - \"你好，{player}。\" - 古堡里的灯又亮了。你愿意听听那里的故事吗？ continue: Type: button Position: [156, 16] Sprite: wide-button Text: 继续 Actions: [\"page: story\"] leave: Type: button Position: [312, 16] Sprite: wide-button Text: 稍后再来 Actions: [close] close: Type: button Position: [516, 2] Sprite: close Text: \"×\" Actions: [close] story: Title: 古堡的故事 Elements: title: Position: [30, 3] Width: 480 Text: 消失的巡夜人 Color: \"#f0d8b9\" story: Position: [30, 6] Width: 480 Rows: 7 Text: - 很久以前，巡夜人每晚都会点亮高塔。 - 如果你在古堡遇到他，请替我问一句好。 accept: Type: button Position: [156, 16] Sprite: wide-button Text: 我记住了 Actions: [\"message: 艾琳：祝你旅途平安。\", close] back: Type: button Position: [312, 16] Sprite: wide-button Text: 返回 Actions: [\"page: main\"] 难度选择与确认：trial.yml 保存到 menus/trial.yml ，打开 /dmenu open trial 。变量放在根部，两个页面共同使用；确认只发消息。 Version: 1 Type: canvas DefaultPage: choose Skin: amethyst Variables: difficulty: [normal, hard] Pages: choose: Title: 选择试炼 Elements: title: Position: [30, 3] Width: 480 Text: 请选择难度 normal: Type: button Position: [30, 7] Text: 普通 SelectedWhen: difficulty=normal SelectedSprite: selected Actions: [\"set: difficulty=normal\", refresh] hard: Type: button Position: [150, 7] Text: 困难 SelectedWhen: difficulty=hard SelectedSprite: selected Actions: [\"set: difficulty=hard\", refresh] normal-info: Position: [30, 11] Width: 480 Rows: 3 VisibleWhen: difficulty=normal Text: 普通模式，适合初次挑战。 hard-info: Position: [30, 11] Width: 480 Rows: 3 VisibleWhen: difficulty=hard Text: 困难模式，需要熟悉机制。 next: Type: button Position: [210, 16] Sprite: wide-button Text: 下一步 Actions: [\"page: confirm\"] confirm: Title: 确认试炼 Elements: summary: Position: [30, 4] Width: 480 Rows: 4 Text: - \"玩家：{player}\" - \"选择的难度：{difficulty}\" - 这是演示，不消耗物品，也不召唤首领。 confirm: Type: button Position: [156, 16] Text: 确认 Actions: [\"message: 你选择了 {difficulty} 难度。\", close] back: Type: button Position: [282, 16] Text: 返回选择 Actions: [\"page: choose\"] 按钮中间的临时变量不会成为永久存档。接入真实副本时，把确认动作改为业务插件实际命令，并让它检查准入和消耗。 原生物品展示：item-preview.yml 保存到 menus/item-preview.yml ，打开 /dmenu open item-preview 。不依赖自定义物品插件，也不发放物品。 Version: 1 Type: settings Title: 物品预览 DefaultPage: main MainMenu: [close] Pages: main: Title: 展示柜 Renderer: items Layout: [说明, 钻石, 返回] Icons: 说明: Type: text Name: 将鼠标移到物品上查看原版提示。 钻石: Type: item Display: Material: minecraft:diamond Amount: 3 Name: 钻石展示 Lore: - 这里只展示物品副本。 - 不会把钻石放入背包。 返回: Name: 关闭预览 Actions: [close] 要显示 CE 物品，把 Material 改为真实的 source:CE:namespace:id ，并视需要加 Fallback: BARRIER 。完整规则见 物品页面 。 现有三个菜单如何修改 文件 常见改动位置 demo-settings.yml Pages.\u003c页>.Layout 改排列； Icons.\u003c控件>.Name / Description 改文案；settings-demo 内 Bind 使用独立演示状态 demo-dialogue.yml Pages.main.Elements.dialogue.Text 改正文；portrait 改立绘；continue 改后续跳转 demo-boss.yml Pages.intro 改背景与建议； Pages.confirm 改难度说明与确认动作 demo-boss 现有 Variables 在各页中分别声明；要扩展难度时保证各页变量允许值一致，或移到根部统一继承。不同条件说明的 VisibleWhen 与按钮 set 值也要同步。"}, {"id": "troubleshooting", "title": "常见问题", "file": "troubleshooting.md", "html": "\u003ch1 id=\"常见问题\">常见问题\u003c/h1>\n\u003cp>排查时先执行 \u003ccode>/dmenu check\u003c/code>，读报错中的文件 / 页面 / 字段路径。check 通过后才执行 reload。新菜单文件即使尚未打开，也会参与整体验证。\u003c/p>\n\u003ch2 id=\"配置报错\">配置报错\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>报错 / 现象\u003c/th>\n\u003cth>原因与处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Version 必须为 3 / 1\u003c/td>\n\u003ctd>全局 config.yml 使用 3，单个 menus 文件使用 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缺少 Pages\u003c/td>\n\u003ctd>把旧版单页文件放到了新版 menus；给它补完整菜单外层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未知字段\u003c/td>\n\u003ctd>拼写、大小写或层级不对；或混用了两类菜单 / TrMenu 语法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无效菜单文件名 / 页面 ID\u003c/td>\n\u003ctd>使用小写英文开头、数字、下划线或短横线，总长不超过 48\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>页面不存在\u003c/td>\n\u003ctd>DefaultPage / page 指向不存在的页；页名只在当前菜单内查找\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>menu 目标需要为 canvas\u003c/td>\n\u003ctd>canvas 的 menu 动作只能直达 canvas 菜单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需要字符串列表\u003c/td>\n\u003ctd>Actions / Layout 写成了单条字符串，或 on/off 被 YAML 解析成布尔值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需要非空单行文字\u003c/td>\n\u003ctd>使用了换行、Tab、空字符串或多行块文本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>close 位置错误\u003c/td>\n\u003ctd>settings 放首项；canvas 放末项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>两个面板放不下\u003c/td>\n\u003ctd>减少 Description，减少控件，调整 heading 或拆页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下拉展开超出画布\u003c/td>\n\u003ctd>把 dropdown 提前，减少选项；选项最多 8 个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>元素超出画布\u003c/td>\n\u003ctd>检查 Position 加元素尺寸；Row 不是像素\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按钮点击区域重叠\u003c/td>\n\u003ctd>调整位置；只有同变量不同条件的互斥按钮允许重叠\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>选中贴图尺寸必须相同\u003c/td>\n\u003ctd>标准 button 配 selected；wide-button 不能配 selected\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>隐藏焦点框只支持默认尺寸\u003c/td>\n\u003ctd>Canvas 不是 552 × 20 行时设 HideFocusOutline: false\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>双语文字需要 zh_cn 和 en_us\u003c/td>\n\u003ctd>翻译映射缺语言；或改成单一纯文本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bind 插件依赖不能替换\u003c/td>\n\u003ctd>保留绑定原依赖；完全自定义时改 State + Actions\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>新版 settings 会先编译成内部格式；个别报错路径仍可能出现旧的 menus/页ID.yml 或 config.yml 前缀。以外层完整菜单路径和具体字段名定位。\u003c/p>\n\u003ch2 id=\"修改没生效\">修改没生效\u003c/h2>\n\u003col>\n\u003cli>确认编辑的是部署目标的 \u003ccode>plugins/DialogMenu/menus\u003c/code>，不是源码默认资源或归档服务器。\u003c/li>\n\u003cli>确认文件扩展名是小写 .yml，不是 .yaml / .txt，也不在子目录里。\u003c/li>\n\u003cli>check 只检查，不应用；执行 reload 并确认成功消息。\u003c/li>\n\u003cli>整体校验失败时上一份配置继续使用，先修复报错。\u003c/li>\n\u003cli>改 Language / Theme 不会重置已有玩家偏好，在界面中重新选择。\u003c/li>\n\u003cli>新版不会同时读取旧的 templates / languages 来覆盖新菜单，检查实际配置模式。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"无法打开\">无法打开\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>提示 / 现象\u003c/th>\n\u003cth>检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1.21.11 打开菜单报 ClickEvent.custom(Key) 的 NoSuchMethodError\u003c/td>\n\u003ctd>旧版本调用了较新 Adventure API；使用包含 1.21.11 修复的开发版及其配套资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>要求加载资源包\u003c/td>\n\u003ctd>ResourcePack 指定来源是否正确，客户端是否成功加载指定 UUID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Auto 已复制资源但仍缺贴图\u003c/td>\n\u003ctd>按控制台提示重新构建、发送资源包；文件复制成功不代表客户端已加载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pack 命令没有发包\u003c/td>\n\u003ctd>只有 Provider: URL 由 DialogMenu 发包，其他模式由外部来源发送\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控制台 open 无效\u003c/td>\n\u003ctd>open 是玩家命令，没有目标玩家参数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧 template 名打不开\u003c/td>\n\u003ctd>demo 菜单被改名 / 删除，使用实际菜单和页面 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无权限\u003c/td>\n\u003ctd>playersettings.use；管理命令另需 playersettings.admin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重新启动后变回默认样式\u003c/td>\n\u003ctd>启动配置失败时会暂用内置默认值；查看启动错误\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"界面显示问题\">界面显示问题\u003c/h2>\n\u003cul>\n\u003cli>方块字、图标缺失：资源包缺少相应 dialogmenu_settings / dialogmenu_dialogue 字体，或客户端仍是旧包。旧版 toraka_settings / toraka_dialogue 引用与当前开发版不能混用；更换方式见 \u003ca href=\"#icons\">图标与材质\u003c/a>。\u003c/li>\n\u003cli>自定义物品没有模型：物品来源插件的资源包未包含 / 未加载，不是加 Name 就能解决。\u003c/li>\n\u003cli>文字被截断：settings 缩短文字 / 分页；canvas 增加 Width / Rows，并检查边界。\u003c/li>\n\u003cli>画面被窗口裁切：降低客户端 GUI 缩放；大画布不会自动缩放适配窗口。\u003c/li>\n\u003cli>改 Width 没让按钮变宽：内置按钮尺寸取决于 Sprite；改用 wide-button。\u003c/li>\n\u003cli>物品页不跟随主题：原生 items 页面本来就使用 Minecraft 原生布局。\u003c/li>\n\u003cli>Title 没出现在 canvas 面板里：Title 是外部标题，添加 text 元素显示可见标题。\u003c/li>\n\u003cli>不显示底部原生关闭按钮：画布页面已移除该按钮，使用自己的 × 或 ESC。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"点击与状态问题\">点击与状态问题\u003c/h2>\n\u003cul>\n\u003cli>按钮可见但不能执行：检查 Permission、RequiresPlugin、依赖插件自身权限和物品源是否失效。\u003c/li>\n\u003cli>回退物品显示正常却不能点：Fallback 只用于显示，来源失败时动作会停用。\u003c/li>\n\u003cli>自定义开关显示未接入：确认 PlaceholderAPI 能返回正确 token，且返回值属于支持的真 / 假值。\u003c/li>\n\u003cli>选择值又变回去：外部命令未保存状态，或 State 返回值与 Options 键不一致。\u003c/li>\n\u003cli>切页后变量丢失：目标页没声明同名变量，或不接受该值；注意 Variables 整段覆盖。\u003c/li>\n\u003cli>放置很久后按钮无响应：当前会话点击凭据有效期为 10 分钟，重新打开。\u003c/li>\n\u003cli>canvas 想用 command 打开其他界面却被覆盖：动作完成后会重绘；canvas 内使用 page / menu。\u003c/li>\n\u003cli>想限制每日领取：本插件没有内置领取次数 / 冷却 / 经济事务，交给业务插件校验。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"需要保留的诊断信息\">需要保留的诊断信息\u003c/h2>\n\u003cp>记录插件版本、命令、完整报错、相关菜单及全局 ResourcePack 段。若是显示问题，再记录客户端版本、GUI 缩放以及是否成功加载资源包。\u003c/p>\n\u003cp>纯菜单 YAML 修改通常只需 check / reload，不必重启服务器。资源文件变化后还需要由发送方重新构建并让客户端加载。\u003c/p>", "text": "常见问题 排查时先执行 /dmenu check ，读报错中的文件 / 页面 / 字段路径。check 通过后才执行 reload。新菜单文件即使尚未打开，也会参与整体验证。 配置报错 报错 / 现象 原因与处理 Version 必须为 3 / 1 全局 config.yml 使用 3，单个 menus 文件使用 1 缺少 Pages 把旧版单页文件放到了新版 menus；给它补完整菜单外层 未知字段 拼写、大小写或层级不对；或混用了两类菜单 / TrMenu 语法 无效菜单文件名 / 页面 ID 使用小写英文开头、数字、下划线或短横线，总长不超过 48 页面不存在 DefaultPage / page 指向不存在的页；页名只在当前菜单内查找 menu 目标需要为 canvas canvas 的 menu 动作只能直达 canvas 菜单 需要字符串列表 Actions / Layout 写成了单条字符串，或 on/off 被 YAML 解析成布尔值 需要非空单行文字 使用了换行、Tab、空字符串或多行块文本 close 位置错误 settings 放首项；canvas 放末项 两个面板放不下 减少 Description，减少控件，调整 heading 或拆页 下拉展开超出画布 把 dropdown 提前，减少选项；选项最多 8 个 元素超出画布 检查 Position 加元素尺寸；Row 不是像素 按钮点击区域重叠 调整位置；只有同变量不同条件的互斥按钮允许重叠 选中贴图尺寸必须相同 标准 button 配 selected；wide-button 不能配 selected 隐藏焦点框只支持默认尺寸 Canvas 不是 552 × 20 行时设 HideFocusOutline: false 双语文字需要 zh_cn 和 en_us 翻译映射缺语言；或改成单一纯文本 Bind 插件依赖不能替换 保留绑定原依赖；完全自定义时改 State + Actions 新版 settings 会先编译成内部格式；个别报错路径仍可能出现旧的 menus/页ID.yml 或 config.yml 前缀。以外层完整菜单路径和具体字段名定位。 修改没生效 确认编辑的是部署目标的 plugins/DialogMenu/menus ，不是源码默认资源或归档服务器。 确认文件扩展名是小写 .yml，不是 .yaml / .txt，也不在子目录里。 check 只检查，不应用；执行 reload 并确认成功消息。 整体校验失败时上一份配置继续使用，先修复报错。 改 Language / Theme 不会重置已有玩家偏好，在界面中重新选择。 新版不会同时读取旧的 templates / languages 来覆盖新菜单，检查实际配置模式。 无法打开 提示 / 现象 检查 1.21.11 打开菜单报 ClickEvent.custom(Key) 的 NoSuchMethodError 旧版本调用了较新 Adventure API；使用包含 1.21.11 修复的开发版及其配套资源 要求加载资源包 ResourcePack 指定来源是否正确，客户端是否成功加载指定 UUID Auto 已复制资源但仍缺贴图 按控制台提示重新构建、发送资源包；文件复制成功不代表客户端已加载 pack 命令没有发包 只有 Provider: URL 由 DialogMenu 发包，其他模式由外部来源发送 控制台 open 无效 open 是玩家命令，没有目标玩家参数 旧 template 名打不开 demo 菜单被改名 / 删除，使用实际菜单和页面 ID 无权限 playersettings.use；管理命令另需 playersettings.admin 重新启动后变回默认样式 启动配置失败时会暂用内置默认值；查看启动错误 界面显示问题 方块字、图标缺失：资源包缺少相应 dialogmenu_settings / dialogmenu_dialogue 字体，或客户端仍是旧包。旧版 toraka_settings / toraka_dialogue 引用与当前开发版不能混用；更换方式见 图标与材质 。 自定义物品没有模型：物品来源插件的资源包未包含 / 未加载，不是加 Name 就能解决。 文字被截断：settings 缩短文字 / 分页；canvas 增加 Width / Rows，并检查边界。 画面被窗口裁切：降低客户端 GUI 缩放；大画布不会自动缩放适配窗口。 改 Width 没让按钮变宽：内置按钮尺寸取决于 Sprite；改用 wide-button。 物品页不跟随主题：原生 items 页面本来就使用 Minecraft 原生布局。 Title 没出现在 canvas 面板里：Title 是外部标题，添加 text 元素显示可见标题。 不显示底部原生关闭按钮：画布页面已移除该按钮，使用自己的 × 或 ESC。 点击与状态问题 按钮可见但不能执行：检查 Permission、RequiresPlugin、依赖插件自身权限和物品源是否失效。 回退物品显示正常却不能点：Fallback 只用于显示，来源失败时动作会停用。 自定义开关显示未接入：确认 PlaceholderAPI 能返回正确 token，且返回值属于支持的真 / 假值。 选择值又变回去：外部命令未保存状态，或 State 返回值与 Options 键不一致。 切页后变量丢失：目标页没声明同名变量，或不接受该值；注意 Variables 整段覆盖。 放置很久后按钮无响应：当前会话点击凭据有效期为 10 分钟，重新打开。 canvas 想用 command 打开其他界面却被覆盖：动作完成后会重绘；canvas 内使用 page / menu。 想限制每日领取：本插件没有内置领取次数 / 冷却 / 经济事务，交给业务插件校验。 需要保留的诊断信息 记录插件版本、命令、完整报错、相关菜单及全局 ResourcePack 段。若是显示问题，再记录客户端版本、GUI 缩放以及是否成功加载资源包。 纯菜单 YAML 修改通常只需 check / reload，不必重启服务器。资源文件变化后还需要由发送方重新构建并让客户端加载。"}, {"id": "migration", "title": "迁移与 TrMenu 对照", "file": "migration.md", "html": "\u003ch1 id=\"迁移与-trmenu-对照\">迁移与 TrMenu 对照\u003c/h1>\n\u003ch2 id=\"三种格式\">三种格式\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>格式\u003c/th>\n\u003cth>入口\u003c/th>\n\u003cth>页面在哪里\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>旧版 v1\u003c/td>\n\u003ctd>无 config.yml，存在 menu.yml\u003c/td>\n\u003ctd>单一旧配置及 languages\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>简化 v2\u003c/td>\n\u003ctd>config.yml 的 Version: 2\u003c/td>\n\u003ctd>config.yml 注册 Pages 列表；menus 一文件一页；templates 独立\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前 v3\u003c/td>\n\u003ctd>config.yml 的 Version: 3\u003c/td>\n\u003ctd>menus 一文件一菜单；每个文件自己的 Pages\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>旧格式保留兼容，不会在启动时强制覆盖。首次安装才导出新版默认文件。\u003c/p>\n\u003ch2 id=\"从-v2-迁移-settings\">从 v2 迁移 settings\u003c/h2>\n\u003col>\n\u003cli>在服务器目录外备份现有配置。\u003c/li>\n\u003cli>新建一份完整 settings 菜单：Version: 1、Type: settings。\u003c/li>\n\u003cli>将旧 config.yml 的 Title、DefaultPage、Language、Theme、HideFocusOutline、MainMenu 移到这份菜单根部。\u003c/li>\n\u003cli>将每份旧单页文件内容放到 \u003ccode>Pages.&lt;原页面ID&gt;\u003c/code> 下，保留原顺序。\u003c/li>\n\u003cli>全局 config.yml 改为 Version: 3、DefaultMenu: settings，并填写 ResourcePack。\u003c/li>\n\u003cli>将旧单页文件移出新版 menus 根目录，否则会按“完整菜单”解析并报缺少 Pages。\u003c/li>\n\u003cli>check 全部通过后 reload，逐页检查。\u003c/li>\n\u003c/ol>\n\u003cp>旧单页示意：\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">Title: 帮助\nLayout: [关闭]\nIcons:\n  关闭:\n    Actions: [close]\n\u003c/code>\u003c/pre>\n\u003cp>移入 Pages 后的完整菜单：\u003c/p>\n\u003c!-- example: migrated-help.yml -->\n\n\u003cpre>\u003ccode class=\"language-yaml\">Version: 1\nType: settings\nTitle: 玩家设置\nDefaultPage: help\nMainMenu: [close]\nPages:\n  help:\n    Title: 帮助\n    Layout: [关闭]\n    Icons:\n      关闭:\n        Actions: [close]\n\u003c/code>\u003c/pre>\n\u003cp>只把旧 Version 改成 3 不会自动迁移内容。\u003c/p>\n\u003ch2 id=\"从独立-templates-迁移\">从独立 templates 迁移\u003c/h2>\n\u003cp>给 canvas 模板加菜单外层，把每个模板除 Version 之外的内容放进 Pages 对应页。把同菜单的 \u003ccode>template: boss-confirm\u003c/code> 改为 \u003ccode>page: confirm\u003c/code>；跨 canvas 菜单跳转可用 \u003ccode>menu: 菜单ID\u003c/code>。\u003c/p>\n\u003cp>新版读取 menus 文件中的画布页，不把旧 templates 自动并入。共同变量可移至根 Variables，但要理解子页是整段覆盖。\u003c/p>\n\u003ch2 id=\"playersettings-旧插件名\">PlayerSettings 旧插件名\u003c/h2>\n\u003cp>DialogMenu 从 0.1.14 更名。不要同时加载旧 PlayerSettings JAR 与新 DialogMenu。新目录没有配置时，启动迁移会尝试导入旧目录并保留原文件；已有新配置优先，冲突不覆盖。\u003c/p>\n\u003cp>命令别名、playersettings 权限名、玩家语言与主题 PDC 键保留兼容。0.1.21 已把 toraka_settings / toraka_dialogue 字体命名空间改为 dialogmenu_settings / dialogmenu_dialogue；需要同步配套资源包并修改自定义 Font 引用，见 \u003ca href=\"#resource-pack\">资源包\u003c/a>。\u003c/p>\n\u003ch2 id=\"对照-trmenu-理解\">对照 TrMenu 理解\u003c/h2>\n\u003cp>本 Wiki 参考 \u003ca href=\"https://hhhhhy.gitbook.io/trmenu-v3\">TrMenu 文档\u003c/a> 的分章节配置手册形式。下表解释 DialogMenu 的实际机制，不承诺兼容 TrMenu 配置。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>习惯中的概念\u003c/th>\n\u003cth>DialogMenu 对应方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>一个菜单配置文件\u003c/td>\n\u003ctd>menus/文件名.yml，每份包含 Pages\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>菜单标题\u003c/td>\n\u003ctd>settings 的 Title；canvas 可见标题用 text 元素\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>布局\u003c/td>\n\u003ctd>settings 的 Layout 是控件名顺序；canvas 用像素 / 行坐标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图标\u003c/td>\n\u003ctd>settings 用 Icons；canvas 用 Elements；真实物品用 Display.Material\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>点击动作\u003c/td>\n\u003ctd>Actions 字符串列表，动作名及顺序规则见本 Wiki\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>条件显示\u003c/td>\n\u003ctd>canvas 只支持枚举变量等值条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义物品\u003c/td>\n\u003ctd>source:插件ID:物品ID，交给内置 ItemBridge 适配器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>变量\u003c/td>\n\u003ctd>settings 文本 / State 用 PAPI；canvas 用声明的枚举变量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>不要把箱子槽位网格、TrMenu 的嵌套动作组、JS / Kether、动态物品表达式、自动动画或点击类型配置直接贴进 DialogMenu。当前解析器只接受文档中列出的字段。\u003c/p>\n\u003cp>DialogMenu 当前没有内置经济交易、物品消耗、次数记录或定时刷新字段。需要这些业务时，通过命令接入对应插件。\u003c/p>", "text": "迁移与 TrMenu 对照 三种格式 格式 入口 页面在哪里 旧版 v1 无 config.yml，存在 menu.yml 单一旧配置及 languages 简化 v2 config.yml 的 Version: 2 config.yml 注册 Pages 列表；menus 一文件一页；templates 独立 当前 v3 config.yml 的 Version: 3 menus 一文件一菜单；每个文件自己的 Pages 旧格式保留兼容，不会在启动时强制覆盖。首次安装才导出新版默认文件。 从 v2 迁移 settings 在服务器目录外备份现有配置。 新建一份完整 settings 菜单：Version: 1、Type: settings。 将旧 config.yml 的 Title、DefaultPage、Language、Theme、HideFocusOutline、MainMenu 移到这份菜单根部。 将每份旧单页文件内容放到 Pages.\u003c原页面ID> 下，保留原顺序。 全局 config.yml 改为 Version: 3、DefaultMenu: settings，并填写 ResourcePack。 将旧单页文件移出新版 menus 根目录，否则会按“完整菜单”解析并报缺少 Pages。 check 全部通过后 reload，逐页检查。 旧单页示意： Title: 帮助 Layout: [关闭] Icons: 关闭: Actions: [close] 移入 Pages 后的完整菜单： Version: 1 Type: settings Title: 玩家设置 DefaultPage: help MainMenu: [close] Pages: help: Title: 帮助 Layout: [关闭] Icons: 关闭: Actions: [close] 只把旧 Version 改成 3 不会自动迁移内容。 从独立 templates 迁移 给 canvas 模板加菜单外层，把每个模板除 Version 之外的内容放进 Pages 对应页。把同菜单的 template: boss-confirm 改为 page: confirm ；跨 canvas 菜单跳转可用 menu: 菜单ID 。 新版读取 menus 文件中的画布页，不把旧 templates 自动并入。共同变量可移至根 Variables，但要理解子页是整段覆盖。 PlayerSettings 旧插件名 DialogMenu 从 0.1.14 更名。不要同时加载旧 PlayerSettings JAR 与新 DialogMenu。新目录没有配置时，启动迁移会尝试导入旧目录并保留原文件；已有新配置优先，冲突不覆盖。 命令别名、playersettings 权限名、玩家语言与主题 PDC 键保留兼容。0.1.21 已把 toraka_settings / toraka_dialogue 字体命名空间改为 dialogmenu_settings / dialogmenu_dialogue；需要同步配套资源包并修改自定义 Font 引用，见 资源包 。 对照 TrMenu 理解 本 Wiki 参考 TrMenu 文档 的分章节配置手册形式。下表解释 DialogMenu 的实际机制，不承诺兼容 TrMenu 配置。 习惯中的概念 DialogMenu 对应方式 一个菜单配置文件 menus/文件名.yml，每份包含 Pages 菜单标题 settings 的 Title；canvas 可见标题用 text 元素 布局 settings 的 Layout 是控件名顺序；canvas 用像素 / 行坐标 图标 settings 用 Icons；canvas 用 Elements；真实物品用 Display.Material 点击动作 Actions 字符串列表，动作名及顺序规则见本 Wiki 条件显示 canvas 只支持枚举变量等值条件 自定义物品 source:插件ID:物品ID，交给内置 ItemBridge 适配器 变量 settings 文本 / State 用 PAPI；canvas 用声明的枚举变量 不要把箱子槽位网格、TrMenu 的嵌套动作组、JS / Kether、动态物品表达式、自动动画或点击类型配置直接贴进 DialogMenu。当前解析器只接受文档中列出的字段。 DialogMenu 当前没有内置经济交易、物品消耗、次数记录或定时刷新字段。需要这些业务时，通过命令接入对应插件。"}, {"id": "maintaining", "title": "文档维护", "file": "MAINTAINING.md", "html": "\u003ch1 id=\"文档维护\">文档维护\u003c/h1>\n\u003ch2 id=\"交付内容\">交付内容\u003c/h2>\n\u003cp>\u003ccode>index.html\u003c/code> 是可离线阅读的单文件网页。章节、搜索数据、样式与脚本都在其中；不使用 CDN，也不需要 GitBook 账户或本地 Web 服务。\u003c/p>\n\u003cp>同目录 Markdown 是源文件，\u003ccode>SUMMARY.md\u003c/code> 提供章节顺序，可用于后续文档站导入。\u003ccode>examples/\u003c/code> 包含从文档中的完整代码块生成的 YAML。\u003c/p>\n\u003cp>这是可离线阅读的 Wiki，随源码提供 Markdown 与 index.html；尚未部署为 GitBook、GitHub Pages 或独立公网文档站。\u003c/p>\n\u003ch2 id=\"更新网页\">更新网页\u003c/h2>\n\u003cp>需要 Python 3 和 Python-Markdown 3.8.2。依赖及缓存放在服务器目录之外，不要放进 test_server。\u003c/p>\n\u003cp>从 DialogMenu 源码根目录执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">python -B tools/build_wiki.py --dependency-path &lt;安装Markdown的目录&gt;\n\u003c/code>\u003c/pre>\n\u003cp>如果当前 Python 环境已经安装 Markdown，可省略 dependency-path。可用 \u003ccode>python -B -m pip install --target &lt;服务器外的依赖目录&gt; Markdown==3.8.2\u003c/code> 准备构建依赖；生成后的网页不再依赖 Python。\u003c/p>\n\u003cp>构建器会：\u003c/p>\n\u003col>\n\u003cli>按 SUMMARY 读取 Markdown，生成目录和全文搜索数据。\u003c/li>\n\u003cli>把带 example 标记的完整 YAML 原样提取到 examples。\u003c/li>\n\u003cli>检查站内文件链接，拒绝断链。\u003c/li>\n\u003cli>把全部内容嵌入 index.html。\u003c/li>\n\u003c/ol>\n\u003cp>正文片段必须写清放置位置，只有完整菜单才能加 example 标记。\u003c/p>\n\u003ch2 id=\"示例列表\">示例列表\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"examples/hello.yml\">hello.yml\u003c/a>\u003c/td>\n\u003ctd>入门双页 settings\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"examples/preferences.yml\">preferences.yml\u003c/a>\u003c/td>\n\u003ctd>内置语言与主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"examples/guide.yml\">guide.yml\u003c/a>\u003c/td>\n\u003ctd>双页 NPC 对话\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"examples/trial.yml\">trial.yml\u003c/a>\u003c/td>\n\u003ctd>枚举难度、条件文字、确认页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"examples/item-preview.yml\">item-preview.yml\u003c/a>\u003c/td>\n\u003ctd>原版物品预览\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"examples/migrated-help.yml\">migrated-help.yml\u003c/a>\u003c/td>\n\u003ctd>旧单页迁移后的完整结构\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>生成器不修改服务器配置，也不把示例自动部署进 menus。\u003c/p>\n\u003ch2 id=\"核验范围\">核验范围\u003c/h2>\n\u003cp>字段说明依据当前本地源码。完整 YAML 示例使用 DialogMenu 的 MenuCatalogParser 检查格式、默认页、跳转和布局约束；这不等于启动游戏验证资源包渲染，也不验证文中示意的外部业务命令。\u003c/p>\n\u003cp>2026-09-24 校验结果：35 段 YAML 语法通过、6 段完整菜单及对应 6 份下载文件解析通过、3 段 ResourcePack 解析通过。网页检查覆盖 17 个页面（含目录）、全文搜索、无结果提示、同章节返回、配色切换、页内导航和复制按钮；桌面与窄屏显示已检查。\u003c/p>\n\u003cp>2026-09-24 图标文档补充后复核：37 段 YAML、6 段完整菜单及对应 6 份下载文件、3 段 ResourcePack 通过当前插件解析器校验，1 段 bitmap 字体 JSON 语法通过。网页更新为 18 个页面（含目录），已检查新图标章节、Oraxen 全文搜索、复制控件及 500 像素窄屏；10 份默认 / 部署 YAML 修改前后解析值一致，仅增加注释。未新增或实际加载示例 PNG，字体图形与 Advance 仍需使用者按实际图片验证。\u003c/p>\n\u003cp>示例中出现的 ExamplePlugin、example 命令、my_pack 物品、example.com 资源地址都是明确的集成占位，需要替换。随附六份完整菜单只使用内置动作、内置偏好或原版物品。\u003c/p>\n\u003cp>每次插件改动后至少核对：字段白名单与默认值、动作顺序、变量生命周期、物品源清单、资源包门槛，以及文件 / 页面数量限制。\u003c/p>", "text": "文档维护 交付内容 index.html 是可离线阅读的单文件网页。章节、搜索数据、样式与脚本都在其中；不使用 CDN，也不需要 GitBook 账户或本地 Web 服务。 同目录 Markdown 是源文件， SUMMARY.md 提供章节顺序，可用于后续文档站导入。 examples/ 包含从文档中的完整代码块生成的 YAML。 这是可离线阅读的 Wiki，随源码提供 Markdown 与 index.html；尚未部署为 GitBook、GitHub Pages 或独立公网文档站。 更新网页 需要 Python 3 和 Python-Markdown 3.8.2。依赖及缓存放在服务器目录之外，不要放进 test_server。 从 DialogMenu 源码根目录执行： python -B tools/build_wiki.py --dependency-path \u003c安装Markdown的目录> 如果当前 Python 环境已经安装 Markdown，可省略 dependency-path。可用 python -B -m pip install --target \u003c服务器外的依赖目录> Markdown==3.8.2 准备构建依赖；生成后的网页不再依赖 Python。 构建器会： 按 SUMMARY 读取 Markdown，生成目录和全文搜索数据。 把带 example 标记的完整 YAML 原样提取到 examples。 检查站内文件链接，拒绝断链。 把全部内容嵌入 index.html。 正文片段必须写清放置位置，只有完整菜单才能加 example 标记。 示例列表 文件 内容 hello.yml 入门双页 settings preferences.yml 内置语言与主题 guide.yml 双页 NPC 对话 trial.yml 枚举难度、条件文字、确认页 item-preview.yml 原版物品预览 migrated-help.yml 旧单页迁移后的完整结构 生成器不修改服务器配置，也不把示例自动部署进 menus。 核验范围 字段说明依据当前本地源码。完整 YAML 示例使用 DialogMenu 的 MenuCatalogParser 检查格式、默认页、跳转和布局约束；这不等于启动游戏验证资源包渲染，也不验证文中示意的外部业务命令。 2026-09-24 校验结果：35 段 YAML 语法通过、6 段完整菜单及对应 6 份下载文件解析通过、3 段 ResourcePack 解析通过。网页检查覆盖 17 个页面（含目录）、全文搜索、无结果提示、同章节返回、配色切换、页内导航和复制按钮；桌面与窄屏显示已检查。 2026-09-24 图标文档补充后复核：37 段 YAML、6 段完整菜单及对应 6 份下载文件、3 段 ResourcePack 通过当前插件解析器校验，1 段 bitmap 字体 JSON 语法通过。网页更新为 18 个页面（含目录），已检查新图标章节、Oraxen 全文搜索、复制控件及 500 像素窄屏；10 份默认 / 部署 YAML 修改前后解析值一致，仅增加注释。未新增或实际加载示例 PNG，字体图形与 Advance 仍需使用者按实际图片验证。 示例中出现的 ExamplePlugin、example 命令、my_pack 物品、example.com 资源地址都是明确的集成占位，需要替换。随附六份完整菜单只使用内置动作、内置偏好或原版物品。 每次插件改动后至少核对：字段白名单与默认值、动作顺序、变量生命周期、物品源清单、资源包门槛，以及文件 / 页面数量限制。"}, {"id": "summary", "title": "目录", "file": "SUMMARY.md", "html": "\u003ch1 id=\"目录\">目录\u003c/h1>\n\u003cul>\n\u003cli>\u003ca href=\"#readme\">首页\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#quick-start\">快速开始\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#structure\">目录与菜单结构\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#commands\">命令与权限\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#settings\">settings 菜单与页面\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#controls\">settings 控件参考\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#canvas\">canvas 画布\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#elements\">canvas 元素与贴图\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#text-tags\">图片标签与独立多语言\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#actions\">动作参考\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#variables\">变量、条件与占位符\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#icons\">图标与材质：更换图片与非 CE 用法\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#items\">物品页面与物品源\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#resource-pack\">资源包\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#examples\">完整示例库\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#troubleshooting\">常见问题\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#migration\">迁移与 TrMenu 对照\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#maintaining\">文档维护\u003c/a>\u003c/li>\n\u003c/ul>", "text": "目录 首页 快速开始 目录与菜单结构 命令与权限 settings 菜单与页面 settings 控件参考 canvas 画布 canvas 元素与贴图 图片标签与独立多语言 动作参考 变量、条件与占位符 图标与材质：更换图片与非 CE 用法 物品页面与物品源 资源包 完整示例库 常见问题 迁移与 TrMenu 对照 文档维护"}]</script>
<script>
"use strict";
const pages = JSON.parse(document.getElementById("wiki-data").textContent);
const byId = new Map(pages.map(p => [p.id, p]));
const article = document.getElementById("article");
const toc = document.getElementById("toc");
const pager = document.getElementById("pager");
const search = document.getElementById("search");
const nav = document.getElementById("nav");
const meta = document.getElementById("meta");
let current = pages[0];
function node(tag, text, cls) { const el = document.createElement(tag); if (text != null) el.textContent = text; if (cls) el.className = cls; return el; }
pages.filter(p => p.id !== "summary").forEach(p => { const a = node("a", p.title); a.href = "#" + p.id; a.dataset.id = p.id; nav.append(a); });
function updateActive() { nav.querySelectorAll("a").forEach(a => { const active = a.dataset.id === current.id; a.classList.toggle("active", active); if(active) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); }); }
async function copyCode(button, text) {
  try {
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else { const area = node("textarea"); area.value = text; area.style.position = "fixed"; area.style.top = "-10000px"; document.body.append(area); area.select(); const ok = document.execCommand("copy"); area.remove(); if(!ok) throw new Error("copy"); }
    button.textContent = "已复制";
  } catch { button.textContent = "请选中代码复制"; }
  setTimeout(() => { button.textContent = "复制"; }, 1800);
}
function drawPage() {
  const route = location.hash.slice(1).split("/");
  current = byId.get(route[0]) || pages[0];
  search.value = "";
  article.innerHTML = current.html;
  document.title = current.title + " · DialogMenu Wiki";
  meta.replaceChildren(node("span", "菜单格式 v3 · 中文配置手册"));
  const source = node("a", "Markdown 源文件"); source.href = current.file; meta.append(source);
  article.querySelectorAll("pre").forEach(pre => { const code = pre.querySelector("code"); if(!code) return; const button = node("button","复制","copy"); button.type="button"; button.setAttribute("aria-label","复制代码"); button.addEventListener("click",()=>copyCode(button,code.textContent)); pre.append(button); });
  article.querySelectorAll("table").forEach(table => { const wrap = node("div",null,"table-wrap"); table.before(wrap); wrap.append(table); });
  toc.replaceChildren();
  article.querySelectorAll("h2,h3").forEach(h => { const a = node("a",h.textContent); a.href="#"+current.id+"/"+encodeURIComponent(h.id); if(h.tagName==="H3") a.style.paddingLeft="24px"; toc.append(a); });
  const chapters = pages.filter(p => p.id !== "summary");
  const at = chapters.findIndex(p => p.id === current.id);
  pager.replaceChildren();
  if(at >= 0) [[chapters[at-1],"上一页"],[chapters[at+1],"下一页"]].forEach(([p,label])=>{ if(!p) return; const a=node("a"); a.href="#"+p.id; a.append(node("small",label),node("span",p.title)); pager.append(a); });
  updateActive(); document.body.classList.remove("menu-open");
  if(route[1]) { let id; try{id=decodeURIComponent(route[1]);}catch{id="";} requestAnimationFrame(()=>{const target=document.getElementById(id); if(target && article.contains(target)) target.scrollIntoView();}); }
  else window.scrollTo(0,0);
}
search.addEventListener("input",()=>{
  const query=search.value.trim().toLocaleLowerCase();
  if(!query){drawPage();return;}
  article.replaceChildren(node("h1","搜索文档"));
  toc.replaceChildren(); pager.replaceChildren(); meta.textContent="全文搜索 · 输入字段名或自然语言关键词";
  const terms=query.split(/\s+/);
  const results=pages.filter(p=>p.id!=="summary" && terms.every(t=>p.text.toLocaleLowerCase().includes(t)));
  article.append(node("p","找到 "+results.length+" 个相关章节"));
  results.forEach(p=>{const a=node("a",null,"result");a.href="#"+p.id;const start=Math.max(0,p.text.toLocaleLowerCase().indexOf(terms[0])-45);a.append(node("h2",p.title),node("p",(start?"…":"")+p.text.slice(start,start+160)+"…"));a.addEventListener("click",()=>{if(location.hash==="#"+p.id) drawPage();});article.append(a);});
  if(!results.length) article.append(node("p","试试 Pages、close、物品、资源包，或缩短搜索词。","empty"));
});
document.getElementById("theme").addEventListener("click",()=>{
  const dark=document.body.classList.toggle("dark");document.getElementById("theme").textContent=dark?"浅色":"深色";
  try{localStorage.setItem("dialogmenu-wiki-theme",dark?"dark":"light");}catch{}
});
try{if(localStorage.getItem("dialogmenu-wiki-theme")==="dark"){document.body.classList.add("dark");document.getElementById("theme").textContent="浅色";}}catch{}
document.getElementById("menu-toggle").addEventListener("click",()=>document.body.classList.toggle("menu-open"));
window.addEventListener("hashchange",drawPage);
document.addEventListener("click",e=>{const a=e.target.closest("a");if(a && a.getAttribute("href")===location.hash && search.value)drawPage();});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();document.body.classList.add("menu-open");search.focus();}});
drawPage();
</script>
</body>
</html>
