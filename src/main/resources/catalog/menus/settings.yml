        Type: "text" # 纯文字
        Name: {zh_cn: "选择会自动保存，下次打开继续使用。", en_us: "Your choices are saved for your next visit."} # 显示文字，可用单个字符串或 zh_cn / en_us 双语配置
      个人设置:
        Type: "text" # 纯文字
        Name: {zh_cn: "仅影响你自己的玩家菜单。", en_us: "Applies only to your own player menu."} # 显示文字，可用单个字符串或 zh_cn / en_us 双语配置
