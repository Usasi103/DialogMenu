        Bind: "language" # 内置偏好绑定 ID，自动读取与保存；不要改为显示文字
        Description: {zh_cn: "仅切换此玩家菜单的语言。", en_us: "Applies to this player menu."} # 控件下方的说明文字，可用字符串、双语文本或最多 3 项的列表
        Options: {zh_cn: "简体中文", en_us: "English"} # 选项值: 显示文字；按顺序排列，2–8 项；"off" 必须加引号
      主题设置:
        Type: "heading" # 分区标题，自动布局时开始下方面板
        Name: {zh_cn: "界面主题", en_us: "Menu theme"} # 显示文字，可用单个字符串或 zh_cn / en_us 双语配置
      主题:
        Type: "dropdown" # 竖向展开的下拉选择框，选项写在 Options 中
        Name: {zh_cn: "界面主题", en_us: "Menu theme"} # 显示文字，可用单个字符串或 zh_cn / en_us 双语配置
        Bind: "theme" # 内置偏好绑定 ID，自动读取与保存；不要改为显示文字
        Options: # 选项值: 显示文字；按顺序排列，2–8 项；"off" 必须加引号
          dark: {zh_cn: "暗色", en_us: "Dark"}
          light: {zh_cn: "亮色", en_us: "Light"}
