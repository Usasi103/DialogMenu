  appearance:
    # 界面与语言：Layout 决定显示顺序，Icons 定义每一项。
    # Name / Description 可直接写中文；{zh_cn: 中文, en_us: English} 用于双语。
    # 默认位置自动计算，可用 Position 覆盖；heading 开始下方面板；未列入 Layout 的项目不显示。
    # Bind 自动读取和保存设置；修改后 /dmenu reload。
    Title: {zh_cn: "界面与语言", en_us: "Appearance"} # 左侧分类名称与右侧页面标题
    Icon: "appearance-icon" # 左侧分类图标的内置贴图 ID
    Keywords: ["界面", "语言", "主题", "亮色", "暗色", "language", "theme", "light", "dark"] # 搜索此分类时匹配的关键词列表
    Layout: ["语言", "主题设置", "主题", "保存说明", "个人设置"] # 显示顺序；名称必须与下方 Icons 的项目名称一致
    Icons: # 本页的文字、按钮和选项定义；每个项目名称需唯一
      语言:
        Type: "dropdown" # 竖向展开的下拉选择框，选项写在 Options 中
