# 每个 menus/*.yml 都是一个完整菜单，文件名就是菜单 ID。
Version: 3
DefaultMenu: demo-settings

# JAR 已内置配套资源，启动和 /dmenu reload 时导出到：
# plugins/DialogMenu/resourcepack/DialogMenu-resourcepack.zip
# AutoInstall 为 true 时，按 CraftEngine > ItemsAdder > Nexo > Oraxen 的顺序
# 检测已启用的插件，把资源写入其资源源目录。CraftEngine 模式只安装到 CE。
# 仅更新本插件以前安装且未经修改的文件；现有自定义文件和冲突 shader 保留并报告。
# 安装后仍需按控制台提示重新生成、托管并发送合并资源包，客户端须接受并加载。
# 只使用 BetterHud 时，请将上述 ZIP 合并到 BetterHud 的资源包构建输入。
# 自动导出/安装不会替其他插件重载或发送资源包，也不会修改其配置。
ResourcePack:
  Name: "DialogMenu 菜单资源"
  Provider: Auto # Auto / CraftEngine / URL / External
  AutoInstall: true # false 时只导出 ZIP，不写入其他插件目录
  Pack: default # CraftEngine 的发送包 ID；与 resources/dialogmenu 目录名无关
  RequireLoaded: false # 避免因发送方 UUID 未配置而拦截；仍须加载完整资源才能显示菜单
  URL: "" # Provider: URL 时填写 ZIP 直链，玩家可使用 /dmenu pack 接收
  UUID: "" # External 必填；Auto 非 CE 的严格校验须填发送方实际 UUID
  SHA1: "" # URL 模式可填 ZIP 的 40 位 SHA-1；同地址更新包时需更新此值

# 已配置服务器直链时使用 Provider: URL、URL: 实际直链、RequireLoaded: true。
# IA/Nexo/Oraxen/BetterHud 等发送方使用 Provider: External、UUID: 实际包 UUID，
# 然后启用 RequireLoaded: true。不能随意生成 UUID，否则玩家加载正确包仍会被拦截。
# Auto + RequireLoaded: true 只接受明确 UUID，或成功接入 CE 后解析其 Pack 的真实 UUID。
# 原有配置不会自动改写；升级用户可手动选择 Auto，URL/External 默认不自动安装。
