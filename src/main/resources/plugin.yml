name: DialogMenu
version: '${version}'
main: online.toraka.dialogmenu.DialogMenu
# The public build targets Paper 26.3; the legacy api-version value remains valid for
# servers that load the unchanged Bukkit plugin descriptor.
api-version: '1.13'
description: Dialog and fullscreen menus in one plugin, with explicit menu types
folia-supported: false
commands:
  dfullscreen:
    description: Open the diagnostic fullscreen menu or inspect its sessions
    usage: /dfullscreen [legacy|close|status]
    permission: dialogmenu.fullscreen.test
permissions:
  dialogmenu.fullscreen.test:
    default: op
# PlaceholderAPI, Ambience (and its old module names), then every ItemBridge provider plugin in
# itembridge-providers.properties, sorted (ItemBridgeSourceTest keeps the two lists equal).
softdepend:
  - 'PlaceholderAPI'
  - 'Ambience'
  - 'LootBeam'
  - 'PickupNotifier'
  - 'AdvancedItems'
  - 'AzureFlow'
  - 'Baikiruto'
  - 'BreweryX'
  - 'CraftEngine'
  - 'CrazyVouchers'
  - 'CustomCrafting'
  - 'CustomFishing'
  - 'DragonArmourers'
  - 'EcoArmor'
  - 'EcoCrates'
  - 'EcoItems'
  - 'EcoMobs'
  - 'EcoPets'
  - 'EcoScrolls'
  - 'EmakiItem'
  - 'ExecutableBlocks'
  - 'ExecutableItems'
  - 'HMCCosmetics'
  - 'HeadDatabase'
  - 'ItemEdit'
  - 'ItemsAdder'
  - 'ItemsXL'
  - 'MMOItems'
  - 'MagicGem'
  - 'MythicMobs'
  - 'NeigeItems'
  - 'Nexo'
  - 'Nova'
  - 'Oraxen'
  - 'PxRpg'
  - 'Ratziel'
  - 'Reforges'
  - 'SX-Item'
  - 'Sertraline'
  - 'Slimefun'
  - 'StatTrackers'
  - 'Talismans'
  - 'Zaphkiel'
# No permissions section, as in the TabooLib build: playersettings.use (default true) is added
# with the command and playersettings.admin (default op) in onEnable, each only when the server
# does not know the node yet, so a leftover PlayerSettings jar never causes a duplicate error.
