# 参考图的首领介绍布局：左侧立绘位，右侧介绍/建议/奖励，下方操作。
# /dmenu template boss-intro
# 固定逻辑宽度随 Minecraft GUI 缩放；不是自动铺满任意分辨率的 HUD。
Version: 1
Title: "夜巡者 · 试炼档案"
Skin: amethyst
Canvas: {Width: 552, Rows: 20, Background: panel, HideFocusOutline: true}
Variables:
  difficulty: [normal, hard, overload]
Elements:
  portrait:
    Type: sprite
    Position: [21, 3]
    Sprite: emblem
    # 可替换为资源包字体立绘；配置方法见 npc-dialogue.yml 的 portrait。
  portrait-caption:
    Position: [33, 15]
    Width: 102
    Text: "夜巡者徽记"
    Color: "#a28ab6"
  title:
    Position: [156, 1]
    Width: 348
    Text: "夜巡者"
    FontSize: 16 # 6–24 像素；默认 8，插件自动预留行高
    Bold: true # true 加粗 / false 常规
    Color: "#d9bfef"
  subtitle:
    Position: [156, 4]
    Width: 348
    Text: "放弃存在，只为守护之人"
    Color: "#a28ab6"
  divider:
    Type: sprite
    Position: [156, 5]
    Sprite: divider
  story-heading:
    Position: [156, 6]
    Width: 348
    Text: "背景故事"
    Color: "#ba98d6"
  story:
    Position: [156, 7]
    Width: 348
    Rows: 3
    Text: "他曾是凡人法师，为守护故土踏入虚空。如今仍徘徊在旧日高塔，等待能够唤醒记忆的挑战者。"
  advice-heading:
    Position: [156, 11]
    Width: 348
    Text: "战斗建议"
    Color: "#ba98d6"
  advice:
    Position: [156, 12]
    Width: 348
    Rows: 2
    Text: ["· 躲避地面标记，留意蓄力攻击。", "· 与队友分散站位，保留位移技能。"]
  rewards:
    Position: [156, 14]
    Width: 100
    Text: "可能奖励"
    Color: "#bca4d0"
  reward-shard:
    Type: sprite
    Position: [156, 16]
    Sprite: reward
  reward-mark:
    Type: sprite
    Position: [192, 16]
    Sprite: reward
  reward-gear:
    Type: sprite
    Position: [228, 16]
    Sprite: reward
  # 碎片：紫水晶碎片；字体定义见资源包 assets/dialogmenu_dialogue/font/rewards.json。
  shard-icon:
    Type: sprite
    Position: [161, 16]
    Font: "dialogmenu_dialogue:rewards"
    Glyph: "\uE000"
    Width: 16
    Rows: 3
    Advance: 15
  # 印记：下界之星；字体定义见资源包 assets/dialogmenu_dialogue/font/rewards.json。
  mark-icon:
    Type: sprite
    Position: [197, 16]
    Font: "dialogmenu_dialogue:rewards"
    Glyph: "\uE001"
    Width: 16
    Rows: 3
    Advance: 16
  # 装备：钻石胸甲；字体定义见资源包 assets/dialogmenu_dialogue/font/rewards.json。
  gear-icon:
    Type: sprite
    Position: [233, 16]
    Font: "dialogmenu_dialogue:rewards"
    Glyph: "\uE002"
    Width: 16
    Rows: 3
    Advance: 16
  information:
    Type: button
    Position: [294, 17]
    Text: "攻击与信息"
    Actions: ["message: 试炼模板：请将本按钮接到你的攻略菜单。", "refresh"]
  start:
    Type: button
    Position: [414, 17]
    Text: "开始战斗"
    Actions: ["template: boss-confirm"]
  close:
    Type: button
    Position: [522, 1]
    Sprite: close
    Text: "×"
    Actions: ["close"]
