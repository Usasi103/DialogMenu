# 掉落光柱：Layout 决定显示顺序，Icons 定义每一项。
# Name / Description 可直接写中文；{zh_cn: 中文, en_us: English} 用于双语。
# 位置自动计算。heading 开始下方面板；未列入 Layout 的项目不显示。
# Bind 自动读取和保存设置；修改后 /playersettings reload。
Title: {zh_cn: "掉落光柱", en_us: "Loot beams"}
Icon: "loot-icon"
Keywords: ["掉落", "光柱", "掉落音效", "loot", "beam", "drop"]
Layout: ["光柱", "音效设置", "音效", "分别设置", "个人设置"]
Icons:
  光柱:
    Type: "toggle"
    Name: {zh_cn: "显示掉落光柱", en_us: "Show loot beams"}
    Bind: "loot-beams"
    Description: {zh_cn: "帮助你发现地面上的稀有掉落物。", en_us: "Helps you spot rare items on the ground."}
  音效设置:
    Type: "heading"
    Name: {zh_cn: "掉落音效", en_us: "Loot sounds"}
  音效:
    Type: "toggle"
    Name: {zh_cn: "播放光柱音效", en_us: "Play loot sounds"}
    Bind: "loot-sounds"
  分别设置:
    Type: "text"
    Name: {zh_cn: "光柱与音效可以分别设置。", en_us: "Beams and sounds can be set separately."}
  个人设置:
    Type: "text"
    Name: {zh_cn: "仅影响你自己的画面与声音。", en_us: "Changes only your own view and sounds."}
