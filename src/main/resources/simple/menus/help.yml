# 使用帮助：Layout 决定显示顺序，Icons 定义每一项。
# Name / Description 可直接写中文；{zh_cn: 中文, en_us: English} 用于双语。
# 位置自动计算。heading 开始下方面板；未列入 Layout 的项目不显示。
# Bind 自动读取和保存设置；修改后 /dialogmenu reload。
Title: {zh_cn: "使用帮助", en_us: "Help"}
Icon: "loot-icon"
Keywords: ["帮助", "资源包", "缩放", "help", "resource", "scale"]
Layout: ["导航", "高亮", "资源包", "加载", "缩放", "关闭"]
Icons:
  导航:
    Type: "text"
    Name: {zh_cn: "点击左侧分类，查看并调整对应设置。", en_us: "Choose a category on the left to change settings."}
  高亮:
    Type: "text"
    Name: {zh_cn: "绿色按钮表示该设置当前已开启。", en_us: "Green buttons show the active selection."}
  资源包:
    Type: "heading"
    Name: {zh_cn: "资源包与界面大小", en_us: "Resource pack and GUI scale"}
  加载:
    Type: "text"
    Name: {zh_cn: "此界面需要服务器资源包。", en_us: "This menu needs the server resource pack."}
  缩放:
    Type: "text"
    Name: {zh_cn: "若界面显示不完整，请调低界面缩放。", en_us: "Lower GUI scale if the menu does not fit."}
  关闭:
    Type: "text"
    Name: {zh_cn: "按 Esc 关闭菜单。", en_us: "Press Esc to close the menu."}
