# 界面与语言：Layout 决定显示顺序，Icons 定义每一项。
# Name / Description 可直接写中文；{zh_cn: 中文, en_us: English} 用于双语。
# 位置自动计算。heading 开始下方面板；未列入 Layout 的项目不显示。
# Bind 自动读取和保存设置；修改后 /dialogmenu reload。
Title: {zh_cn: "界面与语言", en_us: "Appearance"}
Icon: "appearance-icon"
Keywords: ["界面", "语言", "主题", "亮色", "暗色", "language", "theme", "light", "dark"]
Layout: ["语言", "主题设置", "主题", "保存说明", "个人设置"]
Icons:
  语言:
    Type: "dropdown"
    Name: {zh_cn: "菜单语言", en_us: "Menu language"}
    Bind: "language"
    Description: {zh_cn: "仅切换此玩家菜单的语言。", en_us: "Applies to this player menu."}
    Options: {zh_cn: "简体中文", en_us: "English"}
  主题设置:
    Type: "heading"
    Name: {zh_cn: "界面主题", en_us: "Menu theme"}
  主题:
    Type: "dropdown"
    Name: {zh_cn: "界面主题", en_us: "Menu theme"}
    Bind: "theme"
    Options:
      dark: {zh_cn: "暗色", en_us: "Dark"}
      light: {zh_cn: "亮色", en_us: "Light"}
  保存说明:
    Type: "text"
    Name: {zh_cn: "选择会自动保存，下次打开继续使用。", en_us: "Your choices are saved for your next visit."}
  个人设置:
    Type: "text"
    Name: {zh_cn: "仅影响你自己的玩家菜单。", en_us: "Applies only to your own player menu."}
