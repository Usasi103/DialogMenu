# GitHub 正式 Release 更新提醒。修改后重启插件/服务器生效。
enabled: true
# 启动延迟后再错开 0~119 秒发起检查，之后固定每 6 小时检查一次。
startup-delay-seconds: 60
# 检查周期固定在源码中；旧版 check-interval-hours 字段不再读取。
# 默认只检测正式 Release；使用预发布分支时可开启。
include-prereleases: false
notify-console: true
# OP 或持有 toraka.update.notify 权限的玩家收到提示。
# 同一版本每次在线会话只提醒一次，普通玩家不会收到。
notify-admins: true
# 仅匿名检查公开仓库，不读取任何 GitHub Token。
# 私有/不存在的仓库或没有 Release 时静默跳过，不提示配置凭据。
# 旧版 require-token / token-environment 字段已废弃，即使保留也不会读取。
